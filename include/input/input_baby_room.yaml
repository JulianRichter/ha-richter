input_boolean:
  # Toggle to disable the baby room morning alarm routine
  baby_room_alarm_disabled:
    name: Baby Room - Alarm Disabled
    icon: mdi:alarm-off

input_datetime:
  # Scheduled start time for baby room morning routine
  baby_room_alarm_time:
    name: Baby Room - Alarm Time
    has_date: false
    has_time: true
    initial: "07:00:00"
    icon: mdi:alarm
