automation:
  # ====================================================================
  # Baby Room - Motion Sensor
  # - Controls baby room lighting based on occupancy and presence state
  # - After sunset & home (awake): Turns on warm ambient light (brightness 126)
  # - After sunset & away (sleeping): Turns on ultra-dim red night light (brightness 5)
  # - Motion cleared: Smoothly turns off light via light_low_before_off
  # ====================================================================

  - id: "baby_room_motion_sensor"
    alias: "Baby Room - Motion Sensor"
    mode: single

    variables:
      brightness_sleep: "{{ states('input_number.light_brightness_sleep') | int(5) }}"
      brightness_awake: "{{ states('input_number.light_brightness_awake') | int(126) }}"
      color_sleep: >-
        {% set raw = states('input_text.light_color_sleep') %}
        {{ raw.split(',') | map('int') | list if (raw not in ['unknown', 'unavailable', '', 'none'] and ',' in raw) else [255, 0, 0] }}
      color_awake: >-
        {% set raw = states('input_text.light_color_awake') %}
        {{ raw.split(',') | map('int') | list if (raw not in ['unknown', 'unavailable', '', 'none'] and ',' in raw) else [255, 166, 87] }}


    trigger:
      # Occupancy state changed
      - trigger: state
        entity_id:
          - binary_sensor.baby_room_motion_sensor_occupancy
        to:
          - "on"
          - "off"

    condition:
      # Light is low or off
      - condition: template
        value_template: |
          {% set brightness = state_attr('light.baby_room_light', 'brightness') %}
          {% if brightness == None %}
            {{ true }}
          {% else %}
            {{
              brightness | int <= brightness_sleep or
              brightness | int == brightness_awake
            }}
          {% endif %}

    action:
      - choose:
          # ============================================================
          # Motion detected (home / awake)
          # ============================================================
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'on' }}"
              - condition: template
                value_template: "{{ states('sun.sun') == 'below_horizon' }}"
              - condition: template
                value_template: "{{ states('input_boolean.presence_home') == 'on' }}"
            sequence:
              - action: light.turn_on
                data:
                  brightness: "{{ brightness_awake }}"
                  rgb_color: "{{ color_awake }}"
                target:
                  entity_id: light.baby_room_light

          # ============================================================
          # Motion detected (away / sleeping)
          # ============================================================
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'on' }}"
              - condition: template
                value_template: "{{ states('sun.sun') == 'below_horizon' }}"
              - condition: template
                value_template: "{{ states('input_boolean.presence_home') == 'off' }}"
            sequence:
              - action: light.turn_on
                data:
                  brightness: "{{ brightness_sleep }}"
                  rgb_color: "{{ color_sleep }}"
                target:
                  entity_id: light.baby_room_light

          # ============================================================
          # Motion cleared
          # ============================================================
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.state == 'off' }}"
            sequence:
              - action: script.light_low_before_off
                data:
                  entity_id: light.baby_room_light

        default: []

