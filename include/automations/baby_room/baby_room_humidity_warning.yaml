automation:
  # ====================================================================
  # Baby Room - Humidity Warning
  # - Warns via caring TTS to open window when humidity is high for 5 minutes
  # - Notifies via caring TTS to close window when humidity rate stabilizes
  # - Announces in German and optionally in Chinese via play_media_tts_humidity_warning
  # ====================================================================

  - alias: Baby Room - Humidity Warning
    id: baby_room_humidity_warning
    mode: single

    triggers:
      # ---------------------------------------------------------
      # 1) Humidity too high for more than 5 minutes -> open window
      # ---------------------------------------------------------
      - trigger: numeric_state
        entity_id: sensor.baby_room_multi_sensor_humidity
        above: input_number.dashboard_humidity_threshold_medium
        for:
          minutes: 5
        id: humidity_high

      # ---------------------------------------------------------
      # 2) Humidity decrease converged -> close window
      # ---------------------------------------------------------
      - trigger: numeric_state
        entity_id: sensor.baby_room_humidity_change
        above: -1.0
        for:
          seconds: 30
        id: humidity_converged

    conditions: []

    actions:
      - choose:
          # =====================================================
          # CASE 1: Humidity high -> notify to open the window
          # =====================================================
          - conditions:
              - condition: trigger
                id: humidity_high
            sequence:
              # Announce caring humidity warning via TTS
              - action: script.play_media_tts_humidity_warning
                data:
                  entity_id: media_player.living_room
                  room: baby_room
                  status: high
                  humidity_sensor: sensor.baby_room_multi_sensor_humidity

          # =====================================================
          # CASE 2: Humidity converged → notify to close window
          # =====================================================
          - conditions:
              - condition: trigger
                id: humidity_converged
              - condition: state
                entity_id: binary_sensor.baby_room_window_contact
                state: "on" # window is open
            sequence:
              # Announce stabilized humidity via TTS
              - action: script.play_media_tts_humidity_warning
                data:
                  entity_id: media_player.living_room
                  room: baby_room
                  status: converged
                  humidity_sensor: sensor.baby_room_multi_sensor_humidity
