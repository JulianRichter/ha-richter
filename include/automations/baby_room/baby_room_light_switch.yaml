automation:
  # ====================================================================
  # Baby Room - Light Switch
  # - Controls baby room light and heater via wall switch button events
  # - Single press up: Toggles light brightness (full 255 / warm 127)
  # - Single press down: Turns off light smoothly via light_low_before_off
  # - Hold up: Turns baby room heater on
  # - Hold down: Turns baby room heater off
  # ====================================================================

  - id: "baby_room_light_switch"
    alias: "Baby Room - Light Switch"
    mode: single

    trigger:
      # Wall switch event received
      - trigger: state
        entity_id: event.baby_room_light_switch_action
        not_from: unavailable
        not_to: unavailable

    condition: []

    action:
      - choose:
          # Up: Light on
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'on' }}"
            sequence:
              - choose:
                  conditions:
                    - condition: template
                      value_template: "{{ state_attr('light.baby_room_light', 'brightness') | int != 255 }}"
                  sequence:
                    - action: light.turn_on
                      data:
                        brightness: 255
                        color_temp_kelvin: 2700
                      target:
                        entity_id: light.baby_room_light
                default:
                  - action: light.turn_on
                    data:
                      brightness: 127
                      rgb_color: [255, 166, 87]
                    target:
                      entity_id: light.baby_room_light
          # Down: Light off
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'off' }}"
            sequence:
              - action: script.light_low_before_off
                data:
                  entity_id: light.baby_room_light
          # Up hold: Heater on
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_up' }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.baby_room_heater
          # Down hold: Heater off
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_down' }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.baby_room_heater
        default: []
