automation:
  # ====================================================================
  # Baby Room - Light Switch
  # - Controls baby room lighting and auxiliary heater via wall switch
  # - Single press up when off: Turns on dim/warm ambient light first
  # - Single press up when on: Steps up to full daylight (or toggles back to dim)
  # - Single press down: Smoothly turns off light via light_low_before_off
  # - Up hold: Turns on auxiliary heater
  # - Down hold: Turns off auxiliary heater
  # ====================================================================

  - id: "baby_room_light_switch"
    alias: "Baby Room - Light Switch"
    mode: single

    variables:
      brightness_high: "{{ states('input_number.light_brightness_high') | int(255) }}"
      brightness_awake: "{{ states('input_number.light_brightness_awake') | int(126) }}"
      color_awake: >-
        {% set raw = states('input_text.light_color_awake') %}
        {{ raw.split(',') | map('int') | list if (raw not in ['unknown', 'unavailable', '', 'none'] and ',' in raw) else [255, 166, 87] }}

    trigger:
      # Wall switch event received
      - trigger: state
        entity_id: event.baby_room_light_switch_action
        not_from: unavailable
        not_to: unavailable

    condition: []

    action:
      - choose:
          # Up: Light on
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'on' }}"
            sequence:
              - choose:
                  # If light is currently off: always start with dim/warm ambient first
                  - conditions:
                      - condition: state
                        entity_id: light.baby_room_light
                        state: "off"
                    sequence:
                      - color_temp_kelvin: 2700
                        data:
                          brightness: "{{ brightness_awake }}"
                          rgb_color: "{{ color_awake }}"
                        target:
                          entity_id: light.baby_room_light

                  # If light is already on at full brightness: toggle back to dim/warm ambient
                  - conditions:
                      - condition: template
                        value_template: "{{ state_attr('light.baby_room_light', 'brightness') | default(0, true) | int(0) == brightness_high }}"
                    sequence:
                      - action: light.turn_on
                        data:
                          brightness: "{{ brightness_awake }}"
                          rgb_color: "{{ color_awake }}"
                        target:
                          entity_id: light.baby_room_light

                # If light is already on at dim/warm: step up to full brightness
                default:
                  - action: light.turn_on
                    data:
                      brightness: "{{ brightness_high }}"
                      color_temp_kelvin: 2000
                    target:
                      entity_id: light.baby_room_light

          # Down: Light off
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'off' }}"
            sequence:
              - action: script.light_low_before_off
                data:
                  entity_id: light.baby_room_light

          # Up hold: Heater on
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_up' }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.baby_room_heater

          # Down hold: Heater off
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_down' }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.baby_room_heater

        default: []
