automation:
  # ====================================================================
  # Kitchen - Light Switch
  # - Controls kitchen lighting via wall switch button events
  # - Acts as manual fallback for motion lighting with shared brightness (brightness_high)
  # - Single press up when off: Turns on kitchen light to shared full brightness
  # - Single press up when on: Toggles between full and dim/warm setting
  # - Down single click: Turns off kitchen light instantly without transition
  # ====================================================================

  - id: "kitchen_light_switch"
    alias: "Kitchen - Light Switch"
    mode: single

    variables:
      brightness_high: "{{ states('input_number.light_brightness_high') | int(255) }}"
      brightness_awake: "{{ states('input_number.light_brightness_awake') | int(126) }}"

    trigger:
      # Button action event from kitchen switch
      - trigger: state
        entity_id: event.kitchen_light_switch_action
        not_from: unavailable
        not_to: unavailable

    condition: []

    action:
      - choose:
          # Up single press: turn on light
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'on' }}"
            sequence:
              - choose:
                  # If kitchen light is off: turn on to shared full brightness (fallback for motion)
                  - conditions:
                      - condition: state
                        entity_id: light.kitchen_light_group
                        state: "off"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.kitchen_light_group
                        data:
                          brightness: "{{ brightness_high }}"
                          color_temp_kelvin: 2000

                  # If already at full brightness: toggle to dim/warm setting
                  - conditions:
                      - condition: template
                        value_template: "{{ state_attr('light.kitchen_light_group', 'brightness') | default(0, true) | int(0) == brightness_high }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.kitchen_light_group
                        data:
                          brightness: "{{ brightness_awake }}"
                          color_temp_kelvin: 2000

                # If already at dim/warm: step back up to full brightness
                default:
                  - action: light.turn_on
                    target:
                      entity_id: light.kitchen_light_group
                    data:
                      brightness: "{{ brightness_high }}"
                      color_temp_kelvin: 2000

          # Down single press: turn off light instantly
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'off' }}"
            sequence:
              - action: light.turn_off
                target:
                  entity_id: light.kitchen_light_group

          # Up hold: reserved
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_up' }}"
            sequence: []

          # Down hold: reserved
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_down' }}"
            sequence: []

        default: []
