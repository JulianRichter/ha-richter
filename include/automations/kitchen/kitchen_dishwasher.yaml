automation:
  # ====================================================================
  # Kitchen - Dishwasher
  # - Tracks dishwasher cycle completion using binary_sensor.kitchen_dishwasher
  # - Sets helper input_boolean.kitchen_dishwasher_done when cycle finishes
  # - Announces via play_media_tts_dishwasher on media_player.kitchen when someone enters the kitchen
  # - If someone is already in the kitchen when it finishes, announces immediately
  # - Only announces when presence_home is on (not while sleeping or away)
  # - Clears the helper upon announcement and when a new cycle starts
  # ====================================================================

  - id: "kitchen_dishwasher"
    alias: "Kitchen - Dishwasher"
    mode: restart

    trigger:
      # Dishwasher cycle started running
      - trigger: state
        entity_id: binary_sensor.kitchen_dishwasher
        from: "off"
        to: "on"
        id: dishwasher_started

      # Dishwasher cycle completed (power dropped below 3W with 5m cooldown)
      - trigger: state
        entity_id: binary_sensor.kitchen_dishwasher
        from: "on"
        to: "off"
        id: dishwasher_finished

      # Someone enters the kitchen
      - trigger: state
        entity_id: binary_sensor.kitchen_motion_sensor_occupancy
        from: "off"
        to: "on"
        id: kitchen_motion

    condition: []

    action:
      - choose:
          # Cycle started: clear any lingering reminder
          - conditions:
              - condition: trigger
                id: dishwasher_started
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.kitchen_dishwasher_done

          # Cycle finished: set reminder, announce immediately if kitchen is currently occupied & awake
          - conditions:
              - condition: trigger
                id: dishwasher_finished
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.kitchen_dishwasher_done
              - if:
                  - condition: state
                    entity_id: binary_sensor.kitchen_motion_sensor_occupancy
                    state: "on"
                  - condition: state
                    entity_id: input_boolean.presence_home
                    state: "on"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.kitchen_dishwasher_done
                  - action: script.play_media_tts_dishwasher
                    data:
                      entity_id: media_player.kitchen

          # Someone enters the kitchen while clean dishes are pending
          - conditions:
              - condition: trigger
                id: kitchen_motion
              - condition: state
                entity_id: input_boolean.kitchen_dishwasher_done
                state: "on"
              - condition: state
                entity_id: input_boolean.presence_home
                state: "on"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.kitchen_dishwasher_done
              - action: script.play_media_tts_dishwasher
                data:
                  entity_id: media_player.kitchen
