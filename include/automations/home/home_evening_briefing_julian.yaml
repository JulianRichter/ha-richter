automation:
  # ====================================================================
  # Evening Briefing - Julian
  # - Triggers daily at 18:00
  # - Fetches weather forecast, tomorrow's calendar events, and open todos
  # - Passes assembled prompt to play_media_tts_gemini script
  # - Plays briefing on living room speaker
  # - Runs only once per day (last_triggered check)
  # ====================================================================

  - id: "evening_briefing_julian"
    alias: "Evening Briefing - Julian"
    mode: single

    # ------------------------------------------------------------------
    # Trigger: daily at 18:00
    # ------------------------------------------------------------------
    trigger:
      - trigger: time
        at: "18:00:00"

    # ------------------------------------------------------------------
    # Conditions: Julian is home + once per day safety
    # ------------------------------------------------------------------
    condition:
      # Only when Julian is home
      - condition: state
        entity_id: person.julian
        state: "home"

      # Only once per calendar day (safety guard)
      - condition: template
        value_template: >
          {% set last = state_attr('automation.evening_briefing_julian', 'last_triggered') %}
          {{ last is none or (last | as_datetime).date() != now().date() }}

    # ------------------------------------------------------------------
    # Actions: gather data → Gemini TTS script
    # ------------------------------------------------------------------
    action:

      # -- Step 1: Fetch tomorrow's calendar events --
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.familie
            - calendar.german_holidays_all
            - calendar.julian_all
            - calendar.keno
            - calendar.leo
        data:
          start_date_time: >
            {{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') + 'T00:00:00' }}
          end_date_time: >
            {{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') + 'T23:59:59' }}
        response_variable: calendar_events_tomorrow

      # -- Step 2: Fetch open todo items --
      - action: todo.get_items
        target:
          entity_id: todo.julian_google_tasks
        data:
          status: needs_action
        response_variable: todo_items

      # -- Step 3: Generate and play evening briefing via Gemini TTS script --
      - action: script.play_media_tts_gemini
        data:
          entity_id: media_player.living_room
          prompt: >
            {%- set cond_map = {
              'clear-night': 'klar',
              'cloudy': 'bewölkt',
              'fog': 'neblig',
              'hail': 'Hagel',
              'lightning': 'Gewitter',
              'lightning-rainy': 'Gewitter mit Regen',
              'partlycloudy': 'teilweise bewölkt',
              'pouring': 'starker Regen',
              'rainy': 'Regen',
              'snowy': 'Schnee',
              'snowy-rainy': 'Schneeregen',
              'sunny': 'sonnig',
              'windy': 'windig',
              'windy-variant': 'windig'
            } -%}
            {%- set cur_temp = states('sensor.weather_home_current_temperature') | float(0) | round(0) | int -%}
            {%- set cur_cond_raw = states('sensor.weather_home_current_condition') -%}
            {%- set cur_cond = cond_map.get(cur_cond_raw, cur_cond_raw) -%}
            {%- set dt = state_attr('sensor.weather_home_forecast', 'datetime') | default([], true) -%}
            {%- set temp = state_attr('sensor.weather_home_forecast', 'temperature') | default([], true) -%}
            {%- set precip = state_attr('sensor.weather_home_forecast', 'precipitation') | default([], true) -%}
            {%- set cond = state_attr('sensor.weather_home_forecast', 'condition') | default([], true) -%}
            {%- set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
            {%- set ns_weather = namespace(temps=[], rain_times=[], conditions=[]) -%}
            {%- if dt and temp and cond and dt is iterable -%}
              {%- for i in range(dt | length) -%}
                {%- if dt[i][:10] == tomorrow -%}
                  {%- set ns_weather.temps = ns_weather.temps + [temp[i] | float(0)] -%}
                  {%- if precip[i] | float(0) >= 0.2 -%}
                    {%- set ns_weather.rain_times = ns_weather.rain_times + [dt[i][11:13] ~ ' Uhr'] -%}
                  {%- endif -%}
                  {%- set c_name = cond_map.get(cond[i], cond[i]) -%}
                  {%- if c_name not in ns_weather.conditions -%}
                    {%- set ns_weather.conditions = ns_weather.conditions + [c_name] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set cal_items = namespace(list=[]) -%}
            {%- if calendar_events_tomorrow is defined and calendar_events_tomorrow -%}
              {%- for cal_id, cal_data in calendar_events_tomorrow.items() -%}
                {%- if cal_data.events | length > 0 -%}
                  {%- for event in cal_data.events -%}
                    {%- set time_str = '' -%}
                    {%- if event.start is defined -%}
                      {%- if 'T' in event.start -%}
                        {%- set time_str = ' um ' ~ event.start[11:16] ~ ' Uhr' -%}
                      {%- else -%}
                        {%- set time_str = ' (ganztägig)' -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- set cal_items.list = cal_items.list + [event.summary ~ time_str] -%}
                  {%- endfor -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set todo_items_list = namespace(list=[]) -%}
            {%- if todo_items is defined and todo_items and 'todo.julian_google_tasks' in todo_items -%}
              {%- set raw_todos = todo_items['todo.julian_google_tasks']['items'] | default([]) -%}
              {%- for item in raw_todos -%}
                {%- if item.due is defined and item.due -%}
                  {%- if item.due[:10] == tomorrow -%}
                    {%- set todo_items_list.list = todo_items_list.list + [item.summary ~ ' (morgen fällig)'] -%}
                  {%- elif item.due[:10] <= now().strftime('%Y-%m-%d') -%}
                    {%- set todo_items_list.list = todo_items_list.list + [item.summary ~ ' (überfällig)'] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            Du bist JARVIS – der hochentwickelte, loyale und kultivierte persönliche KI-Assistent von Julian (inspiriert vom intelligenten, britisch-trockenen JARVIS aus Iron Man).
            Sprich ruhig, pointiert, geistreich und souverän auf Deutsch.
            Absolut keine künstliche Euphorie ("Was für ein Feierabend!"), keine banalen Floskeln ("Lass die Seele baumeln!"), kein Radio-Moderatorenton und kein geschwätziges Coaching.
            Höchste Informationsdichte: Jedes Wort sitzt. Bring die Fakten elegant, klar und treffsicher auf den Punkt (ca. 4 bis 5 geschliffene Sätze, Dauer: ca. 30 Sekunden).

            === HINTERGRUND-INFOS FÜR DEN ABEND ===
            Wochentag: {{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }}
            Morgen ist: {{ ['Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag','Montag'][now().weekday()] }}
            Aktuelle Uhrzeit: {{ now().strftime('%H:%M') }}
            Aktuelles Wetter: {{ cur_temp }} Grad, {{ cur_cond }}

            Wetter morgen:
            {%- if ns_weather.temps %}
            - Höchstwert morgen: ca. {{ ns_weather.temps | max | round(0) | int }} Grad (Tiefstwert: {{ ns_weather.temps | min | round(0) | int }} Grad)
            - Verlauf: {{ ns_weather.conditions | join(', ') }}
            - Regen: {{ ('Regen erwartet ab ca. ' ~ ns_weather.rain_times[0]) if ns_weather.rain_times else 'Kein Regen in Sicht' }}
            {%- else %}
            Keine Vorhersagedaten für morgen verfügbar.
            {%- endif %}

            Kalender morgen:
            {%- if cal_items.list | length > 0 %}
            {%- for ev in cal_items.list %}
            - {{ ev }}
            {%- endfor %}
            {%- else %}
            Keine Termine morgen eingetragen (Tag ist komplett frei).
            {%- endif %}

            Aufgaben für morgen:
            {%- if todo_items_list.list | length > 0 %}
            {%- for td in todo_items_list.list %}
            - {{ td }}
            {%- endfor %}
            {%- else %}
            Keine fälligen Aufgaben für morgen.
            {%- endif %}

            === REGELN FÜR DIE SPRACHAUSGABE (TTS) ===
            1. JARVIS-Tonalität & Aufbau:
               - Stilvoller Auftakt: "Guten Abend, Julian."
               - Wetter für morgen prägnant zusammenfassen (Höchsttemperatur und ob Regen droht).
               - Morgen anstehende Termine präzise erwähnen. Wenn frei: Trocken und positiv anmerken, dass der Kalender morgen unberührt ist.
               - Aufgaben: Nur erwähnen, wenn konkrete Aufgaben für morgen vorliegen. Wenn die Liste leer ist: Das Thema Aufgaben NIEMALS erwähnen.
               - Souveräner Abschluss ohne Floskeln (z.B. "Die Systeme laufen im Hintergrund. Einen angenehmen Feierabend, Julian.").
            2. Streng verbotene Phrasen:
               - Keine Moderationsfloskeln ("Lass uns mal schauen", "Werfen wir einen Blick").
               - Keine Motivationstrainer-Sprüche oder kitschige Phrasen ("Genieß den wohlverdienten Feierabend").
               - Keine Assistenten-Höflichkeitsfloskeln ("Sag Bescheid wenn du was brauchst", "Lass mich wissen").
               - Niemals die Höflichkeitsform "Sie" oder "Ihnen" verwenden, sondern Julian immer direkt mit "Julian" oder "du" ansprechen.
            3. Perfekte Formatierung für Google Cloud TTS:
               - Reiner Fließtext: KEINE Markdown-Zeichen (keine **, keine #, keine Aufzählungsstriche -).
               - KEINE Emojis und keine Anführungszeichen.
               - Verwende NUR Punkte und Kommas für natürliche Sprechpausen. KEINE Doppelpunkte (:), keine Schrägstriche, keine Klammern.
               - Uhrzeiten und Zahlen umgangssprachlich ausschreiben (z.B. "um halb drei", "um zehn Uhr", "achtzehn Grad"). NIEMALS "14:30 Uhr" schreiben!
            4. Ausgabe:
               - Gib AUSSCHLIESSLICH den reinen Text zum Vorlesen aus, ohne Vorwort, Einleitung der KI oder Formatierung.
