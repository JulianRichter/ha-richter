automation:
  # ====================================================================
  # Evening Briefing - Julian
  # - Triggers daily at 18:00 when Julian is home (once per day)
  # - Spoken current time at the beginning without redundant "am Abend"
  # - Weather outlook for tomorrow + separate clothing recommendation sentence
  # - Full schedule overview: remaining events tonight + tomorrow's appointments
  #   with individual sentences (no rushed run-on text)
  # - Conditional Smart Home notices: open windows, offline/stale sensors
  # - Understated, elegant finishing sentence in JARVIS style
  # ====================================================================

  - id: "evening_briefing_julian"
    alias: "Evening Briefing - Julian"
    mode: single

    # ------------------------------------------------------------------
    # Trigger: daily at 18:00
    # ------------------------------------------------------------------
    trigger:
      - trigger: time
        at: "18:00:00"

    # ------------------------------------------------------------------
    # Conditions: Julian is home + once per day safety
    # ------------------------------------------------------------------
    condition:
      # Only when Julian is home
      - condition: state
        entity_id: person.julian
        state: "home"

      # Only once per calendar day (safety guard)
      - condition: template
        value_template: >
          {% set last = state_attr('automation.evening_briefing_julian', 'last_triggered') %}
          {{ last is none or (last | as_datetime).date() != now().date() }}

    # ------------------------------------------------------------------
    # Actions: gather data → Gemini TTS script
    # ------------------------------------------------------------------
    action:

      # -- Step 1: Fetch calendar events from now until end of tomorrow --
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.1114zxy_gmail_com
            - calendar.familie
            - calendar.german_holidays_all
            - calendar.julian_all
            - calendar.keno
            - calendar.leo
        data:
          start_date_time: "{{ now().isoformat() }}"
          end_date_time: "{{ (today_at('23:59:59') + timedelta(days=1)).isoformat() }}"
        response_variable: calendar_events

      # -- Step 2: Fetch open todo items (only if integration is available) --
      - if:
          - condition: template
            value_template: >-
              {{ states('todo.julian_google_tasks') not in ['unavailable', 'unknown'] }}
        then:
          - action: todo.get_items
            target:
              entity_id: todo.julian_google_tasks
            data:
              status: needs_action
            response_variable: todo_items

      # -- Step 3: Generate and play evening briefing via Gemini TTS script --
      - action: script.play_media_tts_gemini
        data:
          entity_id: media_player.living_room
          prompt: |
            {#- ---------- Weather: tomorrow ---------- -#}
            {%- set cond_map = {
              'clear-night': 'klar', 'cloudy': 'bewölkt', 'fog': 'neblig',
              'hail': 'Hagel', 'lightning': 'Gewitter', 'lightning-rainy': 'Gewitter mit Regen',
              'partlycloudy': 'teilweise bewölkt', 'pouring': 'starker Regen', 'rainy': 'Regen',
              'snowy': 'Schnee', 'snowy-rainy': 'Schneeregen', 'sunny': 'sonnig',
              'windy': 'windig', 'windy-variant': 'windig'
            } -%}
            {%- set dt = state_attr('sensor.weather_home_forecast', 'datetime') | default([], true) -%}
            {%- set temp = state_attr('sensor.weather_home_forecast', 'temperature') | default([], true) -%}
            {%- set precip = state_attr('sensor.weather_home_forecast', 'precipitation') | default([], true) -%}
            {%- set cond = state_attr('sensor.weather_home_forecast', 'condition') | default([], true) -%}
            {%- set tomorrow_date = (now() + timedelta(days=1)).date() -%}
            {%- set wx = namespace(all=[], morn=[], aft=[], eve=[], rain_times=[], conditions=[]) -%}
            {%- if dt and temp and cond and dt is iterable -%}
              {%- for i in range(dt | length) -%}
                {%- set f_dt = dt[i] | as_datetime -%}
                {%- if f_dt is not none and (f_dt | as_local).date() == tomorrow_date -%}
                  {%- set f_local = f_dt | as_local -%}
                  {%- set t_val = temp[i] | float(0) -%}
                  {%- set hr = f_local.hour -%}
                  {%- set wx.all = wx.all + [t_val] -%}
                  {%- if hr >= 6 and hr <= 10 -%}{%- set wx.morn = wx.morn + [t_val] -%}{%- endif -%}
                  {%- if hr >= 12 and hr <= 17 -%}{%- set wx.aft = wx.aft + [t_val] -%}{%- endif -%}
                  {%- if hr >= 18 and hr <= 23 -%}{%- set wx.eve = wx.eve + [t_val] -%}{%- endif -%}
                  {%- if precip[i] | default(0) | float(0) >= 0.2 -%}
                    {%- set wx.rain_times = wx.rain_times + [hr ~ ' Uhr'] -%}
                  {%- endif -%}
                  {%- set c_name = cond_map.get(cond[i], cond[i]) -%}
                  {%- if c_name not in wx.conditions -%}
                    {%- set wx.conditions = wx.conditions + [c_name] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set morn_t = (wx.morn | sum / wx.morn | length) | round(0) | int if wx.morn else (wx.all | min | round(0) | int if wx.all else 15) -%}
            {%- set aft_t = (wx.aft | max) | round(0) | int if wx.aft else (wx.all | max | round(0) | int if wx.all else 20) -%}
            {%- set eve_t = (wx.eve | sum / wx.eve | length) | round(0) | int if wx.eve else (wx.all | min | round(0) | int if wx.all else 15) -%}
            {#- ---------- Calendar: remaining tonight vs tomorrow ---------- -#}
            {%- set cal_names = {
              'calendar.julian_all': 'Julian',
              'calendar.1114zxy_gmail_com': 'Schascha',
              'calendar.keno': 'Keno',
              'calendar.leo': 'Leo',
              'calendar.familie': 'Familie',
              'calendar.german_holidays_all': 'Feiertag'
            } -%}
            {%- set cal_tonight = namespace(items=[]) -%}
            {%- set cal_tomorrow = namespace(items=[]) -%}
            {%- for cal_id, cal_data in (calendar_events | default({}, true)).items() -%}
              {%- set person = cal_names.get(cal_id, '') -%}
              {%- set label = ('[' ~ person ~ '] ') if person else '' -%}
              {%- for event in cal_data.events | default([], true) -%}
                {%- if 'T' in event.start -%}
                  {%- set start_dt = as_datetime(event.start) | as_local -%}
                  {%- if start_dt.date() == now().date() and start_dt > now() -%}
                    {%- set cal_tonight.items = cal_tonight.items + [{'sort': start_dt.strftime('%H:%M'), 'text': label ~ event.summary ~ ' um ' ~ start_dt.strftime('%H:%M') ~ ' Uhr'}] -%}
                  {%- elif start_dt.date() == tomorrow_date -%}
                    {%- set cal_tomorrow.items = cal_tomorrow.items + [{'sort': start_dt.strftime('%H:%M'), 'text': label ~ event.summary ~ ' um ' ~ start_dt.strftime('%H:%M') ~ ' Uhr'}] -%}
                  {%- endif -%}
                {%- else -%}
                  {%- set start_d = as_datetime(event.start) | as_local -%}
                  {%- if start_d.date() == tomorrow_date -%}
                    {%- set cal_tomorrow.items = cal_tomorrow.items + [{'sort': '00:00', 'text': label ~ event.summary ~ ' (ganztägig)'}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {#- ---------- Tasks ---------- -#}
            {%- set today_str = now().strftime('%Y-%m-%d') -%}
            {%- set tomorrow_str = tomorrow_date.strftime('%Y-%m-%d') -%}
            {%- set tasks = namespace(items=[]) -%}
            {%- if todo_items is defined and todo_items and 'todo.julian_google_tasks' in todo_items -%}
              {%- for item in todo_items['todo.julian_google_tasks']['items'] | default([], true) -%}
                {%- if item.due is defined and item.due -%}
                  {%- if item.due[:10] == tomorrow_str -%}
                    {%- set tasks.items = tasks.items + [item.summary ~ ' (morgen fällig)'] -%}
                  {%- elif item.due[:10] <= today_str -%}
                    {%- set tasks.items = tasks.items + [item.summary ~ ' (überfällig)'] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {#- ---------- Smart Home Notices (Conditional) ---------- -#}
            {%- set notices = namespace(list=[]) -%}
            {#- 1. Open Windows -#}
            {%- if is_state('binary_sensor.template_tablet_sidebar_window_contacts', 'on') -%}
              {%- set open_wins = [] -%}
              {%- if is_state('binary_sensor.kitchen_window_contact', 'on') -%}{%- set open_wins = open_wins + ['Küche'] -%}{%- endif -%}
              {%- if is_state('binary_sensor.living_room_window_contact', 'on') -%}{%- set open_wins = open_wins + ['Wohnzimmer'] -%}{%- endif -%}
              {%- if is_state('binary_sensor.bedroom_window_contact', 'on') -%}{%- set open_wins = open_wins + ['Schlafzimmer'] -%}{%- endif -%}
              {%- if is_state('binary_sensor.baby_room_window_contact', 'on') -%}{%- set open_wins = open_wins + ['Kinderzimmer'] -%}{%- endif -%}
              {%- if open_wins | length > 0 -%}
                {%- set notices.list = notices.list + ['Offenes Fenster im Bereich: ' ~ (open_wins | join(', '))] -%}
              {%- endif -%}
            {%- endif -%}
            {#- 2. Offline / Unresponsive Sensors -#}
            {%- set monitored = [
              ('binary_sensor.kitchen_window_contact', 'Küchenfenster-Kontakt'),
              ('binary_sensor.living_room_window_contact', 'Wohnzimmerfenster-Kontakt'),
              ('binary_sensor.bedroom_window_contact', 'Schlafzimmerfenster-Kontakt'),
              ('binary_sensor.baby_room_window_contact', 'Kinderzimmerfenster-Kontakt'),
              ('sensor.kitchen_multi_sensor_temperature', 'Küchen-Sensor'),
              ('sensor.living_room_multi_sensor_temperature', 'Wohnzimmer-Sensor'),
              ('sensor.bedroom_multi_sensor_temperature', 'Schlafzimmer-Sensor'),
              ('sensor.baby_room_multi_sensor_temperature', 'Kinderzimmer-Sensor'),
              ('sensor.bathroom_multi_sensor_temperature', 'Badezimmer-Sensor'),
              ('sensor.garden_multi_sensor_temperature', 'Garten-Sensor'),
              ('binary_sensor.kitchen_motion_sensor_occupancy', 'Küchen-Bewegungssensor'),
              ('binary_sensor.living_room_motion_sensor_occupancy', 'Wohnzimmer-Bewegungssensor'),
              ('binary_sensor.bedroom_motion_sensor_left_occupancy', 'Schlafzimmer-Bewegungssensor links'),
              ('binary_sensor.bedroom_motion_sensor_right_occupancy', 'Schlafzimmer-Bewegungssensor rechts'),
              ('binary_sensor.baby_room_motion_sensor_occupancy', 'Kinderzimmer-Bewegungssensor'),
              ('binary_sensor.bathroom_motion_sensor_occupancy', 'Badezimmer-Bewegungssensor')
            ] -%}
            {%- set ns_stale = namespace(sensors=[]) -%}
            {%- for s_id, s_name in monitored -%}
              {%- if states(s_id) in ['unavailable', 'unknown'] -%}
                {%- set ns_stale.sensors = ns_stale.sensors + [s_name ~ ' (offline)'] -%}
              {%- elif states[s_id] is defined and states[s_id].last_updated is defined and (as_timestamp(now()) - as_timestamp(states[s_id].last_updated)) > 86400 -%}
                {%- set ns_stale.sensors = ns_stale.sensors + [s_name ~ ' (keine Rückmeldung seit mehreren Tagen)'] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if ns_stale.sensors | length > 0 -%}
              {%- set notices.list = notices.list + ['Sensor-Status: ' ~ (ns_stale.sensors | join(', '))] -%}
            {%- endif -%}
            {#- 3. Birthdays & Anniversaries -#}
            {%- if is_state('calendar.family_birthday', 'on') -%}
              {%- set bday_msg = state_attr('calendar.family_birthday', 'message') | default('', true) -%}
              {%- if bday_msg -%}
                {%- set notices.list = notices.list + ['Besonderer Anlass: ' ~ bday_msg] -%}
              {%- endif -%}
            {%- endif -%}
            {%- if is_state('calendar.family_anniversary', 'on') -%}
              {%- set anniv_msg = state_attr('calendar.family_anniversary', 'message') | default('', true) -%}
              {%- if anniv_msg -%}
                {%- set notices.list = notices.list + ['Besonderer Anlass: ' ~ anniv_msg] -%}
              {%- endif -%}
            {%- endif -%}
            {#- ---------- Fitness & Biometrics ---------- -#}
            {%- set t_steps_raw = states('sensor.julian_daily_steps') | float(0) | int -%}
            {%- set t_steps = (((t_steps_raw + 250) // 500) * 500) | int -%}
            Du bist JARVIS, ein britisch-eleganter, loyaler und diskreter persönlicher Assistent wie JARVIS aus Iron Man.
            Du sprichst ein ruhiges, intelligentes und hochwertiges Abendbriefing über den Lautsprecher im Wohnzimmer.
            Tonalität: ruhig, kultiviert, gelassen und auf den Punkt. Sprich mit angenehmer Sprachmelodie, niemals gehetzt.

            WICHTIGE REGELN FÜR ENTSPANNTE SPRACHPAUSEN:
            1. Formatiere den Text in getrennte Absätze (durch eine Leerzeile getrennt).
            2. Mache kurze, klare Sätze. JEDER Termin oder Gedanke erhält einen EIGENEN Satz mit einem Punkt am Ende.
            3. NIEMALS mehrere Termine oder Uhrzeiten mit Kommas in einen langen Schachtelsatz stopfen!
            4. Die Uhrzeit immer schlicht nennen – NIEMALS "am Abend" anhängen, wenn die Begrüßung das bereits enthält!
               - RICHTIG: "Guten Abend. Es ist jetzt achtzehn Uhr."
               - FALSCH: "Guten Abend. Es ist jetzt achtzehn Uhr am Abend."

            AUFBAU DES BRIEFINGS:
            Absatz 1 (Begrüßung & Uhrzeit):
            - Begrüßung ("Guten Abend.") und schlichte Nennung der aktuellen Uhrzeit in Worten (z.B. "Es ist jetzt achtzehn Uhr." oder "Es ist kurz nach sechs.").

            Absatz 2 (Temperaturverlauf & Kleidung morgen in zwei bis drei geschliffenen Sätzen):
            - Satz 1 (Verlauf): Morgentemperatur zur Orientierung, Nachmittagshöchstwert mit Himmel/Sonne, und die Abkühlung am Abend (z.B. "Morgen früh starten wir frisch bei acht Grad. Am Nachmittag klettert das Thermometer bei sonnigem Himmel auf milde einundzwanzig Grad, ehe es abends auf dreizehn Grad absinkt.").
              * Bei geringem Unterschied (unter 4 Grad): Schlicht als beständigen Tag zusammenfassen (z.B. "Morgen bleibt es den ganzen Tag über kühl bei sieben bis neun Grad und verhangenem Himmel.").
            - Satz 2 (Niederschlag): Nur erwähnen, falls Regen droht oder explizit trocken bleibt (z.B. "Regen droht morgen nicht." oder "Ab vierzehn Uhr setzt Regen ein.").
            - Satz 3: Eine konkrete, abgestimmte Kleidungsempfehlung für morgen, die diesen Tagesverlauf berücksichtigt (z.B. "Für den Vormittag empfiehlt sich eine Übergangsjacke, später reicht ein Sakko." bzw. "Eine wetterfeste Jacke ist angeraten.").

            Absatz 3 (Fitness & Tagesaktivität - NUR falls in den Daten vorhanden):
            - Nenne kurz, natürlich und dezent die bisherigen Schritte des Tages, gerundet auf 500er (z.B. "Bislang bist du heute rund siebeneinhalbtausend Schritte gegangen.", "Du kommst heute bisher auf rund siebeneinhalbtausend Schritte." oder "Dein Schrittzähler liegt aktuell bei rund siebeneinhalbtausend Schritten.").
            - Formuliere die Bewegung ungezwungen und natürlich im eleganten Alltagston.
            - Schrittzahl IMMER gerundet auf halbe Tausender nennen – NIEMALS exakte oder krumme Zahlen sprechen.
            - Liegen keine Schrittdaten vor: Diesen Absatz komplett weglassen!
            - Wichtig: Niemals motivierend oder belehrend wie ein Fitnesstrainer klingen. Sachlich, unaufgeregt und diskret im JARVIS-Stil.

            Absatz 4 (Termine & Tagesplan):
            - Falls für heute Abend noch Termine anstehen: Nenne sie kurz in einem Satz.
            - Morgen anstehende Termine: Nenne die morgigen Termine ruhig nacheinander in kurzen Einzelsätzen. Wenn morgen keine Termine anstehen: Trocken erwähnen, dass der Kalender morgen komplett frei ist.
            - Zuordnung der Termine (den Namen natürlich und elegant einbinden):
              * [Julian]: Persönliche Termine des Zuhörers – sprich ihn direkt in der Du-Form an (z.B. "Für dich steht um zehn Uhr ein Meeting an.").
              * [Schascha]: Termine seiner Ehefrau Schascha (z.B. "Schascha hat um elf Uhr einen Termin.", "Für Schascha steht Pilates an.").
              * [Keno] oder [Leo]: Termine der Söhne Keno und Leo (z.B. "Keno startet um acht Uhr mit dem Kindergarten.", "Um halb fünf folgt der Sportkurs für Leo.").
              * [Familie]: Gemeinsame Familientermine, Geburtstage oder Jubiläen (z.B. "Morgen hat Ole Geburtstag.", "Als Familie steht um achtzehn Uhr ein Abendessen an.").
              * [Feiertag]: Deutsche Feiertage (z.B. "Morgen ist Feiertag.").
            - Falls Aufgaben vorliegen: Kurz und beiläufig in einem Satz erwähnen.

            Absatz 5 (Smart-Home-Hinweise - NUR falls in den Daten vorhanden):
            - Falls offene Fenster oder Offline-Sensoren vorliegen: Binde dies ruhig und beiläufig in einem Satz ein (besonders offene Fenster am Abend sind wichtig).
            - Liegen keine Hinweise vor: Diesen Absatz komplett weglassen!

            Absatz 6 (Stilvoller Abschluss):
            - Ein kurzer, vornehmer Feierabend-Abschluss (z.B. "Einen entspannten Feierabend." oder "Einen angenehmen und ruhigen Abend.").

            STRENG VERBOTEN:
            - Den Zuhörer niemals mit Namen ansprechen (weder "Julian" noch "Sir"). Sprich ihn direkt in der Du-Form an ("du hast", "für dich"). Die Namen der Familienmitglieder (Schascha, Keno, Leo) bei deren Terminen natürlich ganz normal nennen.
            - Keine unnatürlichen oder gestelzten Floskeln wie "zu Buche stehen", "zu Buche schlagen", "absolviert" oder bürokratische Amtsphrasen. Sprich menschlich, flüssig und ungezwungen.
            - Keine Roboterfloskeln ("Die Systeme laufen im Hintergrund", "Statusbericht").
            - Keine übertriebenen Motivations- oder Feierabendfloskeln ("Lass die Seele baumeln").
            - Keine exakten oder krummen Schrittzahlen nennen – stets auf 500er runden (z.B. "rund siebentausendfünfhundert Schritte" oder "rund siebeneinhalbtausend Schritte" statt exakter Zahlen).
            - Keine Doppelpunkte, keine Aufzählungszeichen, kein Markdown. Uhrzeiten immer in Worten ("um neun Uhr", "halb zehn").

            BEISPIEL:
            Guten Abend. Es ist jetzt achtzehn Uhr.

            Morgen früh starten wir frisch bei acht Grad. Am Nachmittag klettert das Thermometer bei sonnigem Himmel auf einundzwanzig Grad, bevor es zum Abend auf dreizehn Grad absinkt. Für den Vormittag empfiehlt sich eine Übergangsjacke, später reicht ein Sakko.

            Bislang bist du heute rund siebeneinhalbtausend Schritte gegangen.

            Morgen hat Ole Geburtstag. Keno startet um acht Uhr mit dem Kindergarten, und um halb drei steht die Abholung an. Um halb fünf folgt der Sportkurs für Leo, während Schascha um achtzehn Uhr einen Termin hat.

            Das Fenster im Schlafzimmer steht aktuell noch offen.

            Einen entspannten Feierabend.

            AKTUELLE DATEN:
            - Uhrzeit jetzt: {{ now().strftime('%H:%M') }} Uhr, {{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }}
            - Morgen ist: {{ ['Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag','Montag'][now().weekday()] }}
            - Temperaturverlauf & Wetter morgen:
            {%- if wx.all %}
              * Start am Morgen: ca. {{ morn_t }} Grad
              * Nachmittag (Höchstwert): bis zu {{ aft_t }} Grad, {{ wx.conditions | join(', ') }}
              * Abkühlung am Abend: ca. {{ eve_t }} Grad
              * Niederschlag: {{ ('Regen ab etwa ' ~ wx.rain_times[0] ~ '.') if wx.rain_times else 'Kein Regen erwartet.' }}
            {%- else %}
              * Keine Vorhersagedaten verfügbar (Absatz weglassen).
            {%- endif %}
            - Fitness & Aktivität heute:
            {%- if t_steps >= 500 %}
              * Schritte heute bisher: rund {{ t_steps }} Schritte (bereits auf 500er gerundet)
            {%- else %}
              * Keine Daten (Absatz weglassen).
            {%- endif %}
            - Noch anstehende Termine heute Abend:
            {%- for ev in cal_tonight.items | sort(attribute='sort') %}
              * {{ ev.text }}
            {%- else %}
              * Keine weiteren Termine heute Abend.
            {%- endfor %}
            - Termine morgen:
            {%- for ev in cal_tomorrow.items | sort(attribute='sort') %}
              * {{ ev.text }}
            {%- else %}
              * Morgen keine Termine (Kalender ist frei).
            {%- endfor %}
            - Aufgaben:
            {%- if todo_items is not defined %}
              * Aufgabenliste derzeit nicht erreichbar.
            {%- else %}
            {%- for td in tasks.items %}
              * {{ td }}
            {%- else %}
              * Keine fälligen Aufgaben für morgen.
            {%- endfor %}
            {%- endif %}
            - Smart-Home-Hinweise:
            {%- if notices.list | length > 0 %}
            {%- for n in notices.list %}
              * {{ n }}
            {%- endfor %}
            {%- else %}
              * Keine Auffälligkeiten (nicht erwähnen).
            {%- endif %}

            Gib ausschließlich den gesprochenen Text mit Leerzeilen zwischen den Absätzen aus:
          error_message: "Guten Abend. Das Abend-Briefing konnte gerade nicht geladen werden."

