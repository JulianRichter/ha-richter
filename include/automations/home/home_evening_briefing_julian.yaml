automation:
  # ====================================================================
  # Evening Briefing - Julian
  # - Triggers daily at 18:00
  # - Fetches weather forecast, tomorrow's calendar events, and open todos
  # - Passes assembled prompt to play_media_tts_gemini script
  # - Plays briefing on living room speaker
  # - Runs only once per day (last_triggered check)
  # ====================================================================

  - id: "evening_briefing_julian"
    alias: "Evening Briefing - Julian"
    mode: single

    # ------------------------------------------------------------------
    # Trigger: daily at 18:00
    # ------------------------------------------------------------------
    trigger:
      - trigger: time
        at: "18:00:00"

    # ------------------------------------------------------------------
    # Conditions: Julian is home + once per day safety
    # ------------------------------------------------------------------
    condition:
      # Only when Julian is home
      - condition: state
        entity_id: person.julian
        state: "home"

      # Only once per calendar day (safety guard)
      - condition: template
        value_template: >
          {% set last = state_attr('automation.evening_briefing_julian', 'last_triggered') %}
          {{ last is none or (last | as_datetime).date() != now().date() }}

    # ------------------------------------------------------------------
    # Actions: gather data → Gemini TTS script
    # ------------------------------------------------------------------
    action:

      # -- Step 1: Fetch tomorrow's calendar events --
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.familie
            - calendar.german_holidays_all
            - calendar.julian_all
            - calendar.keno
            - calendar.leo
        data:
          start_date_time: >
            {{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') + 'T00:00:00' }}
          end_date_time: >
            {{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') + 'T23:59:59' }}
        response_variable: calendar_events_tomorrow

      # -- Step 2: Fetch open todo items --
      - action: todo.get_items
        target:
          entity_id: todo.julian_google_tasks
        data:
          status: needs_action
        response_variable: todo_items

      # -- Step 3: Generate and play evening briefing via Gemini TTS script --
      - action: script.play_media_tts_gemini
        data:
          entity_id: media_player.living_room
          prompt: >
            Du bist der freundliche Smart-Home-Assistent der Familie.
            Erstelle ein natürlich klingendes Abend-Briefing auf Deutsch
            für Julian. Sprich ihn direkt an.

            Das Briefing besteht aus Abschnitten. Baue sie fließend ineinander
            über, nicht als steife Aufzählung.

            === AKTUELLE DATEN ===
            Uhrzeit: {{ now().strftime('%H:%M') }} Uhr
            Datum: {{ now().strftime('%d.%m.%Y') }}
            Wochentag: {{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }}
            Morgen ist: {{ ['Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag','Montag'][now().weekday()] }}
            Aktuelle Temperatur: {{ states('sensor.weather_home_current_temperature') }}°C
            Aktuelles Wetter: {{ states('sensor.weather_home_current_condition') }}

            === ABSCHNITT 1: BEGRÜSSUNG & WETTER MORGEN ===
            {% set dt = state_attr('sensor.weather_home_forecast', 'datetime') -%}
            {% set temp = state_attr('sensor.weather_home_forecast', 'temperature') -%}
            {% set precip = state_attr('sensor.weather_home_forecast', 'precipitation') -%}
            {% set cond = state_attr('sensor.weather_home_forecast', 'condition') -%}
            {% set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
            {% if dt and temp and cond -%}
              {% for i in range(dt | length) -%}
                {% if dt[i][:10] == tomorrow -%}
            {{ dt[i][11:16] }} Uhr: {{ temp[i] }}°C, {{ cond[i] }}, Niederschlag {{ precip[i] }}mm
                {% endif -%}
              {% endfor -%}
            {% else -%}
            Keine Vorhersagedaten für morgen verfügbar.
            {% endif %}

            === ABSCHNITT 2: TERMINE MORGEN ===
            {% set ns = namespace(has_events=false) -%}
            {% for cal_id, cal_data in calendar_events_tomorrow.items() -%}
              {% if cal_data.events | length > 0 -%}
                {% set ns.has_events = true -%}
                {% for event in cal_data.events -%}
            - {{ event.summary }}{% if event.start is defined %} ({{ event.start }}){% endif %}

                {% endfor -%}
              {% endif -%}
            {% endfor -%}
            {% if not ns.has_events -%}
            Keine Termine morgen.
            {% endif %}

            === ABSCHNITT 3: OFFENE AUFGABEN (ToDo-Liste) ===
            {% set todos = todo_items['todo.julian_google_tasks']['items'] | default([]) -%}
            {% if todos | length > 0 -%}
              {% for item in todos -%}
            - {{ item.summary }}{% if item.due is defined %} (fällig: {{ item.due }}){% endif %}

              {% endfor -%}
            {% else -%}
            Keine offenen Aufgaben.
            {% endif %}

            === REGELN ===
            - Starte mit einer lockeren Abend-Begrüßung
            - Fasse das Wetter für morgen natürlich zusammen, erwähne kurz
              wie es gerade draußen ist als Überleitung
            - Bei Regen morgen: nenne den ungefähren Zeitraum, nicht
              stündlich aufzählen
            - Temperatur immer ohne Komma, nur ganze Zahlen
            - Kalender: Wenn keine Termine morgen vorliegen, formuliere es
              positiv oder erwähne es gar nicht. Niemals roboterhaft auflisten
            - Geburtstage und Feiertage morgen besonders hervorheben
            - ToDo-Liste: Wenn Aufgaben vorhanden sind, erwähne sie beiläufig
              und natürlich.
              Bei bald fälligen Aufgaben dezent erinnern. Wenn die Liste
              leer ist, erwähne sie NICHT
            - Halte jeden Abschnitt kurz (2-3 Sätze). Das Gesamtbriefing
              sollte sich natürlich und fließend anhören, nicht wie eine
              Checkliste
            - Schließe mit einem netten Wunsch für den Abend ab
            - Klinge wie ein aufmerksamer Freund, nicht wie eine Maschine
            - Ein Hauch von Humor ist willkommen, aber nicht erzwungen —
              wenn sich eine witzige Bemerkung natürlich ergibt, gerne,
              aber nicht in jeden Satz pressen
            - Keine Sensor-IDs, keine technischen Details, keine Rohdaten
            - Antworte NUR mit dem Briefing-Text, ohne Erklärungen drumherum
