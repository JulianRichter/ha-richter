automation:
  # ====================================================================
  # Evening Briefing - Julian
  # - Triggers daily at 18:00
  # - Fetches weather forecast, tomorrow's calendar events, and open todos
  # - Passes assembled prompt to play_media_tts_gemini script
  # - Plays briefing on living room speaker
  # - Runs only once per day (last_triggered check)
  # ====================================================================

  - id: "evening_briefing_julian"
    alias: "Evening Briefing - Julian"
    mode: single

    # ------------------------------------------------------------------
    # Trigger: daily at 18:00
    # ------------------------------------------------------------------
    trigger:
      - trigger: time
        at: "18:00:00"

    # ------------------------------------------------------------------
    # Conditions: Julian is home + once per day safety
    # ------------------------------------------------------------------
    condition:
      # Only when Julian is home
      - condition: state
        entity_id: person.julian
        state: "home"

      # Only once per calendar day (safety guard)
      - condition: template
        value_template: >
          {% set last = state_attr('automation.evening_briefing_julian', 'last_triggered') %}
          {{ last is none or (last | as_datetime).date() != now().date() }}

    # ------------------------------------------------------------------
    # Actions: gather data → Gemini TTS script
    # ------------------------------------------------------------------
    action:

      # -- Step 1: Fetch tomorrow's calendar events --
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.familie
            - calendar.german_holidays_all
            - calendar.julian_all
            - calendar.keno
            - calendar.leo
        data:
          start_date_time: >
            {{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') + 'T00:00:00' }}
          end_date_time: >
            {{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') + 'T23:59:59' }}
        response_variable: calendar_events_tomorrow

      # -- Step 2: Fetch open todo items --
      - action: todo.get_items
        target:
          entity_id: todo.julian_google_tasks
        data:
          status: needs_action
        response_variable: todo_items

      # -- Step 3: Generate and play evening briefing via Gemini TTS script --
      - action: script.play_media_tts_gemini
        data:
          entity_id: media_player.living_room
          prompt: >
            Du bist JARVIS – der hochentwickelte, loyale und kultivierte persönliche KI-Assistent von Julian (inspiriert vom intelligenten, britisch-trockenen JARVIS aus Iron Man).
            Sprich ruhig, pointiert, geistreich und souverän auf Deutsch.
            Absolut keine künstliche Euphorie, keine banalen Floskeln, kein Radio-Moderatorenton.
            Erstelle ein kurzes, elegantes Feierabend-Briefing (ca. 4 bis 5 geschliffene Sätze) für den Lautsprecher im Wohnzimmer.

            === AKTUELLE DATEN ===
            Uhrzeit: {{ now().strftime('%H:%M') }} Uhr
            Wochentag: {{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }}
            Morgen ist: {{ ['Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag','Montag'][now().weekday()] }}
            Aktuelle Temperatur: {{ states('sensor.weather_home_current_temperature') | float(0) | round(0) | int }} Grad

            === WETTER MORGEN ===
            {% set dt = state_attr('sensor.weather_home_forecast', 'datetime') -%}
            {% set temp = state_attr('sensor.weather_home_forecast', 'temperature') -%}
            {% set precip = state_attr('sensor.weather_home_forecast', 'precipitation') -%}
            {% set cond = state_attr('sensor.weather_home_forecast', 'condition') -%}
            {% set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
            {% if dt and temp and cond -%}
              {% for i in range(dt | length) -%}
                {% if dt[i][:10] == tomorrow -%}
            {{ dt[i][11:16] }} Uhr: {{ temp[i] | float(0) | round(0) | int }} Grad, {{ cond[i] }}, Niederschlag {{ precip[i] }} mm
                {% endif -%}
              {% endfor -%}
            {% else -%}
            Keine Vorhersagedaten für morgen verfügbar.
            {% endif %}

            === TERMINE MORGEN ===
            {% set ns = namespace(has_events=false) -%}
            {% for cal_id, cal_data in calendar_events_tomorrow.items() -%}
              {% if cal_data.events | length > 0 -%}
                {% set ns.has_events = true -%}
                {% for event in cal_data.events -%}
            - {{ event.summary }}{% if event.start is defined %} ({{ event.start }}){% endif %}
                {% endfor -%}
              {% endif -%}
            {% endfor -%}
            {% if not ns.has_events -%}
            Keine Termine morgen eingetragen.
            {% endif %}

            === OFFENE AUFGABEN ===
            {% set todos = todo_items['todo.julian_google_tasks']['items'] | default([]) -%}
            {% if todos | length > 0 -%}
              {% for item in todos -%}
            - {{ item.summary }}{% if item.due is defined %} (fällig: {{ item.due }}){% endif %}
              {% endfor -%}
            {% else -%}
            Keine offenen Aufgaben.
            {% endif %}

            === REGELN FÜR DIE SPRACHAUSGABE (TTS) ===
            1. JARVIS-Tonalität:
               - Stilvoller Auftakt: "Guten Abend, Julian."
               - Wetter für morgen prägnant zusammenfassen (Höchsttemperatur, Regenrisiko).
               - Morgen anstehende Termine, Feiertage oder Geburtstage auf den Punkt bringen. Falls der Tag komplett frei ist: Eine feine, trockene Bemerkung dazu.
               - Aufgaben: Nur erwähnen, falls Aufgaben für morgen relevant sind. Wenn die Liste leer ist: Das Thema Aufgaben NIEMALS erwähnen.
               - Abschluss: Ein eleganter, entspannter Feierabend-Wunsch (z.B. "Ich wünsche Ihnen einen angenehmen und ungestörten Feierabend.").
            2. Streng verbotene Phrasen:
               - Keine Moderationsfloskeln ("Lass uns mal schauen", "Werfen wir einen Blick").
               - Keine Motivationstrainer-Sprüche oder kitschige Phrasen.
               - Keine Assistenten-Höflichkeitsfloskeln ("Sag Bescheid wenn du was brauchst").
            3. Formatierung für Google Cloud TTS:
               - Reiner Fließtext: KEINE Markdown-Zeichen (keine **, keine #, keine Aufzählungsstriche -).
               - KEINE Emojis und keine Anführungszeichen.
               - Verwende NUR Punkte und Kommas für natürliche Sprechpausen. KEINE Doppelpunkte (:), keine Schrägstriche, keine Klammern.
               - Schreibe Uhrzeiten und Zahlen umgangssprachlich aus (z.B. "um halb drei", "um zehn Uhr", "achtzehn Grad"). NIEMALS "14:30 Uhr" schreiben!
            4. Ausgabe:
               - Gib AUSSCHLIESSLICH den reinen Text zum Vorlesen aus, ohne Vorwort oder Formatierung.
