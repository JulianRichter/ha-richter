automation:
  # ====================================================================
  # Morning Briefing - Julian
  # - Triggers when Pixel Watch 3 starts charging (placed on charger)
  # - Requires bathroom motion as confirmation (Julian is present)
  # - No time window – works on demand at any hour
  # - Fetches weather forecast, calendar events, and open todo items
  # - On weekends: includes a family activity suggestion for Augsburg
  # - Passes assembled prompt to play_media_tts_gemini script
  # - Plays briefing on bathroom speaker with graceful error fallback
  # ====================================================================

  - id: "morning_briefing_julian"
    alias: "Morning Briefing - Julian"
    mode: single

    # ------------------------------------------------------------------
    # Trigger: Pixel Watch placed on charger
    # ------------------------------------------------------------------
    trigger:
      - trigger: state
        entity_id: sensor.pixel_watch_3_battery_state
        to: "charging"

    # ------------------------------------------------------------------
    # Condition: Julian is in the bathroom
    # ------------------------------------------------------------------
    condition:
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.bathroom_motion_sensor_occupancy
            state: "on"
          - condition: state
            entity_id: binary_sensor.bathroom_shower_motion_sensor_occupancy
            state: "on"

    # ------------------------------------------------------------------
    # Actions: settle briefly → gather data → Gemini TTS script
    # ------------------------------------------------------------------
    action:

      # -- Fetch today's calendar events --
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.familie
            - calendar.german_holidays_all
            - calendar.julian_all
            - calendar.keno
            - calendar.leo
        data:
          duration:
            hours: 24
        response_variable: calendar_events

      # -- Fetch open todo items --
      - action: todo.get_items
        target:
          entity_id: todo.julian_google_tasks
        data:
          status: needs_action
        response_variable: todo_items

      # -- Generate and play briefing via Gemini TTS script --
      - action: script.play_media_tts_gemini
        data:
          entity_id: media_player.bathroom
          prompt: >
            {%- set cond_map = {
              'clear-night': 'klar',
              'cloudy': 'bewölkt',
              'fog': 'neblig',
              'hail': 'Hagel',
              'lightning': 'Gewitter',
              'lightning-rainy': 'Gewitter mit Regen',
              'partlycloudy': 'teilweise bewölkt',
              'pouring': 'starker Regen',
              'rainy': 'Regen',
              'snowy': 'Schnee',
              'snowy-rainy': 'Schneeregen',
              'sunny': 'sonnig',
              'windy': 'windig',
              'windy-variant': 'windig'
            } -%}
            {%- set cur_temp = states('sensor.weather_home_current_temperature') | float(0) | round(0) | int -%}
            {%- set cur_cond_raw = states('sensor.weather_home_current_condition') -%}
            {%- set cur_cond = cond_map.get(cur_cond_raw, cur_cond_raw) -%}
            {%- set dt = state_attr('sensor.weather_home_forecast', 'datetime') | default([], true) -%}
            {%- set temp = state_attr('sensor.weather_home_forecast', 'temperature') | default([], true) -%}
            {%- set precip = state_attr('sensor.weather_home_forecast', 'precipitation') | default([], true) -%}
            {%- set cond = state_attr('sensor.weather_home_forecast', 'condition') | default([], true) -%}
            {%- set today = now().strftime('%Y-%m-%d') -%}
            {%- set ns = namespace(temps=[], rain_times=[], conditions=[]) -%}
            {%- if dt and temp and cond and dt is iterable -%}
              {%- for i in range(dt | length) -%}
                {%- if dt[i][:10] == today -%}
                  {%- set ns.temps = ns.temps + [temp[i] | float(0)] -%}
                  {%- if precip[i] | float(0) >= 0.2 -%}
                    {%- set ns.rain_times = ns.rain_times + [dt[i][11:13] ~ ' Uhr'] -%}
                  {%- endif -%}
                  {%- set c_name = cond_map.get(cond[i], cond[i]) -%}
                  {%- if c_name not in ns.conditions -%}
                    {%- set ns.conditions = ns.conditions + [c_name] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set cal_items = namespace(list=[]) -%}
            {%- if calendar_events is defined and calendar_events -%}
              {%- for cal_id, cal_data in calendar_events.items() -%}
                {%- if cal_data.events | length > 0 -%}
                  {%- for event in cal_data.events -%}
                    {%- set time_str = '' -%}
                    {%- if event.start is defined -%}
                      {%- if 'T' in event.start -%}
                        {%- set time_str = ' um ' ~ event.start[11:16] ~ ' Uhr' -%}
                      {%- else -%}
                        {%- set time_str = ' (ganztägig)' -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- set cal_items.list = cal_items.list + [event.summary ~ time_str] -%}
                  {%- endfor -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set todo_items_list = namespace(list=[]) -%}
            {%- if todo_items is defined and todo_items and 'todo.julian_google_tasks' in todo_items -%}
              {%- set raw_todos = todo_items['todo.julian_google_tasks']['items'] | default([]) -%}
              {%- for item in raw_todos -%}
                {%- if item.due is defined and item.due -%}
                  {%- if item.due[:10] == today -%}
                    {%- set todo_items_list.list = todo_items_list.list + [item.summary ~ ' (heute fällig)'] -%}
                  {%- elif item.due[:10] < today -%}
                    {%- set todo_items_list.list = todo_items_list.list + [item.summary ~ ' (überfällig)'] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set hour = now().hour -%}
            {%- if hour < 12 -%}
              {%- set tageszeit = 'morgens' -%}
            {%- elif hour < 14 -%}
              {%- set tageszeit = 'mittags' -%}
            {%- elif hour < 18 -%}
              {%- set tageszeit = 'nachmittags' -%}
            {%- else -%}
              {%- set tageszeit = 'abends' -%}
            {%- endif -%}
            Du bist JARVIS – der hochentwickelte, loyale und kultivierte persönliche KI-Assistent von Julian (inspiriert vom intelligenten, britisch-trockenen JARVIS aus Iron Man).
            Sprich ruhig, pointiert, geistreich und souverän auf Deutsch.
            Absolut keine künstliche Euphorie ("Was für ein herrlicher Tag!"), keine banalen Floskeln ("Genieß deinen Kaffee!"), kein Radio-Moderatorenton und kein geschwätziges Coaching.
            Höchste Informationsdichte: Jedes Wort sitzt. Bring die Fakten elegant, klar und treffsicher auf den Punkt (ca. 4 bis 5 geschliffene Sätze, Dauer: ca. 30 Sekunden).

            === HINTERGRUND-INFOS FÜR HEUTE ===
            Wochentag: {{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }}
            Aktuelle Uhrzeit: {{ now().strftime('%H:%M') }}
            Tageszeit: {{ tageszeit }}

            Wetter:
            - Aktuell: {{ cur_temp }} Grad, {{ cur_cond }}
            {%- if ns.temps %}
            - Höchstwert heute: ca. {{ ns.temps | max | round(0) | int }} Grad (Tiefstwert: {{ ns.temps | min | round(0) | int }} Grad)
            - Verlauf: {{ ns.conditions | join(', ') }}
            - Regen: {{ ('Regen erwartet ab ca. ' ~ ns.rain_times[0]) if ns.rain_times else 'Kein Regen in Sicht' }}
            {%- endif %}

            Kalender heute:
            {%- if cal_items.list | length > 0 %}
            {%- for ev in cal_items.list %}
            - {{ ev }}
            {%- endfor %}
            {%- else %}
            Keine Termine eingetragen (Tag ist komplett frei).
            {%- endif %}

            Aufgaben für heute:
            {%- if todo_items_list.list | length > 0 %}
            {%- for td in todo_items_list.list %}
            - {{ td }}
            {%- endfor %}
            {%- else %}
            Keine fälligen Aufgaben für heute.
            {%- endif %}
            {%- if now().weekday() >= 5 %}
            {%- set keno_age = ((now().date() - strptime('2023-04-15', '%Y-%m-%d').date()).days / 365.25) | round(1) %}
            {%- set leo_months = ((now().date() - strptime('2025-11-15', '%Y-%m-%d').date()).days / 30.44) | round(0) | int %}

            Wochenend-Idee für die Familie:
            Julian verbringt das Wochenende mit seiner Frau Xingyang und den beiden Söhnen Keno (ca. {{ keno_age }} Jahre) und Leo (ca. {{ leo_months }} Monate, Kinderwagen).
            Mache einen stilvollen, durchdachten und wettergerechten Ausflugsvorschlag in oder um Augsburg (z.B. Siebentischwald, Zoo, Botanischer Garten oder bei Regen eine passende Alternative).
            {%- endif %}

            === REGELN FÜR DIE SPRACHAUSGABE (TTS) ===
            1. JARVIS-Tonalität & Aufbau:
               - Stilvoller, direkter Auftakt: Morgens "Guten Morgen, Julian.", tagsüber "Guten Tag, Julian.", abends "Guten Abend, Julian.".
               - Wetter kompakt und pointiert zusammenfassen.
               - Kalender präzise erwähnen. Wenn frei: Trocken und positiv anmerken, dass der Terminkalender heute unberührt und frei ist.
               - Aufgaben: Nur erwähnen, wenn konkrete Aufgaben für heute vorliegen. Wenn die Liste leer ist: Das Thema Aufgaben NIEMALS erwähnen.
               - Am Wochenende: Den Ausflugsvorschlag kurz und elegant in einem einzigen Satz einbinden.
               - Souveräner Abschluss ohne Floskeln (z.B. "Die Systeme laufen einwandfrei. Einen erfolgreichen Tag, Julian." oder "Machen wir das Beste daraus.").
            2. Streng verbotene Phrasen:
               - Keine Moderationsfloskeln ("Lass uns mal schauen", "Werfen wir einen Blick", "Was gibt es sonst noch").
               - Keine Motivationstrainer-Sprüche ("Starten wir mit voller Energie", "Du schaffst das", "Genieß deinen Kaffee").
               - Keine Assistenten-Höflichkeitsfloskeln ("Lass mich wissen wenn du Hilfe brauchst", "Sag Bescheid").
               - Niemals die Höflichkeitsform "Sie" oder "Ihnen" verwenden, sondern Julian immer direkt mit "Julian" oder "du" ansprechen.
            3. Perfekte Formatierung für Google Cloud TTS:
               - Reiner Fließtext: KEINE Markdown-Zeichen (keine **, keine #, keine Aufzählungsstriche -).
               - KEINE Emojis und keine Anführungszeichen.
               - Verwende NUR Punkte und Kommas für natürliche Sprechpausen. KEINE Doppelpunkte (:), keine Schrägstriche, keine Klammern.
               - Uhrzeiten und Zahlen umgangssprachlich ausschreiben (z.B. "um halb drei", "um zehn Uhr", "achtzehn Grad"). NIEMALS "14:30 Uhr" schreiben!
            4. Ausgabe:
               - Gib AUSSCHLIESSLICH den reinen Text zum Vorlesen aus, ohne Vorwort, Einleitung der KI oder Formatierung.
