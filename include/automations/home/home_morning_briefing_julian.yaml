automation:
  # ====================================================================
  # Morning Briefing - Julian
  # - Triggers when Pixel Watch 3 starts charging (placed on charger)
  # - Requires bathroom motion as confirmation (Julian is present)
  # - Works on demand at any hour:
  #   * Tagsüber (< 20:00): Wetter/Kleidung für heute + verbleibende Termine heute
  #   * Spätabends (>= 20:00): Automatische Vorausschau auf Wetter/Kleidung/Termine morgen
  # - Spoken current time at the beginning without redundant "am Abend/Morgen"
  # - All remaining appointments with individual sentences (no rushed run-on text)
  # - Conditional Smart Home notices: open windows, offline/stale sensors
  # - Understated, elegant finishing sentence in JARVIS style
  # ====================================================================

  - id: "morning_briefing_julian"
    alias: "Morning Briefing - Julian"
    mode: single

    # ------------------------------------------------------------------
    # Trigger: Pixel Watch placed on charger
    # ------------------------------------------------------------------
    trigger:
      - trigger: state
        entity_id: sensor.pixel_watch_3_battery_state
        to: "charging"

    # ------------------------------------------------------------------
    # Condition: Julian is in the bathroom
    # ------------------------------------------------------------------
    condition:
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.bathroom_motion_sensor_occupancy
            state: "on"
          - condition: state
            entity_id: binary_sensor.bathroom_shower_motion_sensor_occupancy
            state: "on"

    # ------------------------------------------------------------------
    # Actions: gather data → Gemini TTS script
    # ------------------------------------------------------------------
    action:

      # -- Fetch calendar events from now until end of tomorrow --
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.familie
            - calendar.german_holidays_all
            - calendar.julian_all
            - calendar.keno
            - calendar.leo
        data:
          start_date_time: "{{ now().isoformat() }}"
          end_date_time: "{{ (today_at('23:59:59') + timedelta(days=1)).isoformat() }}"
        response_variable: calendar_events

      # -- Fetch open todo items (only if integration is available) --
      - if:
          - condition: template
            value_template: >-
              {{ states('todo.julian_google_tasks') not in ['unavailable', 'unknown'] }}
        then:
          - action: todo.get_items
            target:
              entity_id: todo.julian_google_tasks
            data:
              status: needs_action
            response_variable: todo_items

      # -- Generate and play briefing via Gemini TTS script --
      - action: script.play_media_tts_gemini
        data:
          entity_id: media_player.bathroom
          prompt: |
            {#- ---------- Time & Time-of-day Awareness ---------- -#}
            {%- set hour = now().hour -%}
            {%- set is_night = hour >= 20 -%}
            {%- set greeting = 'Guten Morgen' if hour < 11 else ('Guten Tag' if hour < 18 else 'Guten Abend') -%}
            {%- set is_weekend = now().weekday() >= 5 -%}
            {#- ---------- Weather ---------- -#}
            {%- set cond_map = {
              'clear-night': 'klar', 'cloudy': 'bewölkt', 'fog': 'neblig',
              'hail': 'Hagel', 'lightning': 'Gewitter', 'lightning-rainy': 'Gewitter mit Regen',
              'partlycloudy': 'teilweise bewölkt', 'pouring': 'starker Regen', 'rainy': 'Regen',
              'snowy': 'Schnee', 'snowy-rainy': 'Schneeregen', 'sunny': 'sonnig',
              'windy': 'windig', 'windy-variant': 'windig'
            } -%}
            {%- set cur_temp = states('sensor.weather_home_current_temperature') | float(0) | round(0) | int -%}
            {%- set cur_cond = cond_map.get(states('sensor.weather_home_current_condition'), states('sensor.weather_home_current_condition')) -%}
            {%- set dt = state_attr('sensor.weather_home_forecast', 'datetime') | default([], true) -%}
            {%- set temp = state_attr('sensor.weather_home_forecast', 'temperature') | default([], true) -%}
            {%- set precip = state_attr('sensor.weather_home_forecast', 'precipitation') | default([], true) -%}
            {%- set cond = state_attr('sensor.weather_home_forecast', 'condition') | default([], true) -%}
            {%- set target_date = (now() + timedelta(days=1)).date() if is_night else now().date() -%}
            {%- set wx = namespace(all=[], morn=[], aft=[], eve=[], rain_times=[], conditions=[]) -%}
            {%- if dt and temp and cond and dt is iterable -%}
              {%- for i in range(dt | length) -%}
                {%- set f_dt = dt[i] | as_datetime -%}
                {%- if f_dt is not none and (f_dt | as_local).date() == target_date -%}
                  {%- set f_local = f_dt | as_local -%}
                  {%- set t_val = temp[i] | float(0) -%}
                  {%- set hr = f_local.hour -%}
                  {%- if is_night or f_dt >= now() - timedelta(minutes=59) -%}
                    {%- set wx.all = wx.all + [t_val] -%}
                    {%- if hr >= 6 and hr <= 10 -%}{%- set wx.morn = wx.morn + [t_val] -%}{%- endif -%}
                    {%- if hr >= 12 and hr <= 17 -%}{%- set wx.aft = wx.aft + [t_val] -%}{%- endif -%}
                    {%- if hr >= 18 and hr <= 23 -%}{%- set wx.eve = wx.eve + [t_val] -%}{%- endif -%}
                    {%- if precip[i] | default(0) | float(0) >= 0.2 -%}
                      {%- set wx.rain_times = wx.rain_times + [hr ~ ' Uhr'] -%}
                    {%- endif -%}
                    {%- set c_name = cond_map.get(cond[i], cond[i]) -%}
                    {%- if c_name not in wx.conditions -%}
                      {%- set wx.conditions = wx.conditions + [c_name] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set morn_t = (wx.morn | sum / wx.morn | length) | round(0) | int if wx.morn else cur_temp -%}
            {%- set aft_t = (wx.aft | max) | round(0) | int if wx.aft else (wx.all | max | round(0) | int if wx.all else cur_temp) -%}
            {%- set eve_t = (wx.eve | sum / wx.eve | length) | round(0) | int if wx.eve else (wx.all | min | round(0) | int if wx.all else cur_temp) -%}
            {#- ---------- Calendar: remaining today vs tomorrow ---------- -#}
            {%- set cal_today = namespace(items=[]) -%}
            {%- set cal_tomorrow = namespace(items=[]) -%}
            {%- set tomorrow_d = (now() + timedelta(days=1)).date() -%}
            {%- for cal_id, cal_data in (calendar_events | default({}, true)).items() -%}
              {%- for event in cal_data.events | default([], true) -%}
                {%- if 'T' in event.start -%}
                  {%- set start_dt = as_datetime(event.start) | as_local -%}
                  {%- if start_dt.date() == now().date() and start_dt > now() -%}
                    {%- set cal_today.items = cal_today.items + [{'sort': start_dt.strftime('%H:%M'), 'text': event.summary ~ ' um ' ~ start_dt.strftime('%H:%M') ~ ' Uhr'}] -%}
                  {%- elif start_dt.date() == tomorrow_d -%}
                    {%- set cal_tomorrow.items = cal_tomorrow.items + [{'sort': start_dt.strftime('%H:%M'), 'text': event.summary ~ ' um ' ~ start_dt.strftime('%H:%M') ~ ' Uhr'}] -%}
                  {%- endif -%}
                {%- else -%}
                  {%- set start_d = as_datetime(event.start) | as_local -%}
                  {%- if start_d.date() == now().date() -%}
                    {%- set cal_today.items = cal_today.items + [{'sort': '00:00', 'text': event.summary ~ ' (ganztägig)'}] -%}
                  {%- elif start_d.date() == tomorrow_d -%}
                    {%- set cal_tomorrow.items = cal_tomorrow.items + [{'sort': '00:00', 'text': event.summary ~ ' (ganztägig)'}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {#- ---------- Tasks ---------- -#}
            {%- set today_str = now().strftime('%Y-%m-%d') -%}
            {%- set tomorrow_str = tomorrow_d.strftime('%Y-%m-%d') -%}
            {%- set tasks = namespace(items=[]) -%}
            {%- if todo_items is defined and todo_items and 'todo.julian_google_tasks' in todo_items -%}
              {%- for item in todo_items['todo.julian_google_tasks']['items'] | default([], true) -%}
                {%- if item.due is defined and item.due -%}
                  {%- if is_night and item.due[:10] == tomorrow_str -%}
                    {%- set tasks.items = tasks.items + [item.summary ~ ' (morgen fällig)'] -%}
                  {%- elif not is_night and item.due[:10] == today_str -%}
                    {%- set tasks.items = tasks.items + [item.summary ~ ' (heute fällig)'] -%}
                  {%- elif item.due[:10] < today_str -%}
                    {%- set tasks.items = tasks.items + [item.summary ~ ' (überfällig)'] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {#- ---------- Smart Home Notices (Conditional) ---------- -#}
            {%- set notices = namespace(list=[]) -%}
            {#- 1. Open Windows -#}
            {%- if is_state('binary_sensor.template_tablet_sidebar_window_contacts', 'on') -%}
              {%- set open_wins = [] -%}
              {%- if is_state('binary_sensor.kitchen_window_contact', 'on') -%}{%- set open_wins = open_wins + ['Küche'] -%}{%- endif -%}
              {%- if is_state('binary_sensor.living_room_window_contact', 'on') -%}{%- set open_wins = open_wins + ['Wohnzimmer'] -%}{%- endif -%}
              {%- if is_state('binary_sensor.bedroom_window_contact', 'on') -%}{%- set open_wins = open_wins + ['Schlafzimmer'] -%}{%- endif -%}
              {%- if is_state('binary_sensor.baby_room_window_contact', 'on') -%}{%- set open_wins = open_wins + ['Kinderzimmer'] -%}{%- endif -%}
              {%- if open_wins | length > 0 -%}
                {%- set notices.list = notices.list + ['Offenes Fenster im Bereich: ' ~ (open_wins | join(', '))] -%}
              {%- endif -%}
            {%- endif -%}
            {#- 2. Offline / Unresponsive Sensors -#}
            {%- set monitored = [
              ('binary_sensor.kitchen_window_contact', 'Küchenfenster-Kontakt'),
              ('binary_sensor.living_room_window_contact', 'Wohnzimmerfenster-Kontakt'),
              ('binary_sensor.bedroom_window_contact', 'Schlafzimmerfenster-Kontakt'),
              ('binary_sensor.baby_room_window_contact', 'Kinderzimmerfenster-Kontakt'),
              ('sensor.kitchen_multi_sensor_temperature', 'Küchen-Sensor'),
              ('sensor.living_room_multi_sensor_temperature', 'Wohnzimmer-Sensor'),
              ('sensor.bedroom_multi_sensor_temperature', 'Schlafzimmer-Sensor'),
              ('sensor.baby_room_multi_sensor_temperature', 'Kinderzimmer-Sensor'),
              ('sensor.bathroom_multi_sensor_temperature', 'Badezimmer-Sensor'),
              ('sensor.garden_multi_sensor_temperature', 'Garten-Sensor'),
              ('binary_sensor.kitchen_motion_sensor_occupancy', 'Küchen-Bewegungssensor'),
              ('binary_sensor.living_room_motion_sensor_occupancy', 'Wohnzimmer-Bewegungssensor'),
              ('binary_sensor.bedroom_motion_sensor_left_occupancy', 'Schlafzimmer-Bewegungssensor links'),
              ('binary_sensor.bedroom_motion_sensor_right_occupancy', 'Schlafzimmer-Bewegungssensor rechts'),
              ('binary_sensor.baby_room_motion_sensor_occupancy', 'Kinderzimmer-Bewegungssensor'),
              ('binary_sensor.bathroom_motion_sensor_occupancy', 'Badezimmer-Bewegungssensor')
            ] -%}
            {%- set ns_stale = namespace(sensors=[]) -%}
            {%- for s_id, s_name in monitored -%}
              {%- if states(s_id) in ['unavailable', 'unknown'] -%}
                {%- set ns_stale.sensors = ns_stale.sensors + [s_name ~ ' (offline)'] -%}
              {%- elif states[s_id] is defined and states[s_id].last_updated is defined and (as_timestamp(now()) - as_timestamp(states[s_id].last_updated)) > 86400 -%}
                {%- set ns_stale.sensors = ns_stale.sensors + [s_name ~ ' (keine Rückmeldung seit mehreren Tagen)'] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if ns_stale.sensors | length > 0 -%}
              {%- set notices.list = notices.list + ['Sensor-Status: ' ~ (ns_stale.sensors | join(', '))] -%}
            {%- endif -%}
            {#- 3. Birthdays & Anniversaries -#}
            {%- if is_state('calendar.family_birthday', 'on') -%}
              {%- set bday_msg = state_attr('calendar.family_birthday', 'message') | default('', true) -%}
              {%- if bday_msg -%}
                {%- set notices.list = notices.list + ['Besonderer Anlass heute: ' ~ bday_msg] -%}
              {%- endif -%}
            {%- endif -%}
            {#- 4. Transit delays (morning only) -#}
            {%- if hour < 12 and is_state('binary_sensor.augsburg_curtiusstrasse_koenigsplatz_delays', 'on') -%}
              {%- set notices.list = notices.list + ['Hinweis zur Tram 1: Auf der Linie gibt es aktuell Störungen oder Verspätungen.'] -%}
            {%- endif -%}
            {#- ---------- Fitness & Biometrics ---------- -#}
            {%- set sleep_min = states('sensor.julian_sleep_duration') | float(0) | int -%}
            {%- set sleep_h = sleep_min // 60 -%}
            {%- set sleep_m = sleep_min % 60 -%}
            {%- set y_steps_raw = states('input_number.julian_yesterday_steps') | float(0) | int -%}
            {%- set y_steps = (((y_steps_raw + 250) // 500) * 500) | int -%}
            {%- set t_steps_raw = states('sensor.julian_daily_steps') | float(0) | int -%}
            {%- set t_steps = (((t_steps_raw + 250) // 500) * 500) | int -%}
            Du bist JARVIS, ein britisch-eleganter, loyaler und diskreter persönlicher Assistent wie JARVIS aus Iron Man.
            Du sprichst ein ruhiges, intelligentes und hochwertiges Briefing über den Lautsprecher im Badezimmer.
            Tonalität: ruhig, kultiviert, gelassen und auf den Punkt. Sprich mit angenehmer Sprachmelodie, niemals gehetzt.

            WICHTIGE REGELN FÜR ENTSPANNTE SPRACHPAUSEN:
            1. Formatiere den Text in getrennte Absätze (durch eine Leerzeile getrennt).
            2. Mache kurze, klare Sätze. JEDER Termin oder Gedanke erhält einen EIGENEN Satz mit einem Punkt am Ende.
            3. NIEMALS mehrere Termine oder Uhrzeiten mit Kommas in einen langen Schachtelsatz stopfen!
            4. Die Uhrzeit immer schlicht nennen – NIEMALS "am Abend" oder "am Morgen" anhängen, wenn die Begrüßung das bereits enthält!
               - RICHTIG: "Guten Abend. Es ist jetzt kurz nach zehn."
               - FALSCH: "Guten Abend. Es ist jetzt kurz nach zehn Uhr am Abend."

            AUFBAU DES BRIEFINGS:
            Absatz 1 (Begrüßung & Uhrzeit):
            - Begrüßung ("{{ greeting }}.") und schlichte Nennung der aktuellen Uhrzeit in Worten (z.B. "Es ist jetzt acht Uhr fünfzehn." oder "Es ist kurz nach zehn.").

            Absatz 2 (Temperaturverlauf & Kleidung in zwei bis drei geschliffenen Sätzen):
            {%- if is_night %}
            - Da es bereits später Abend ist: Schildere den morgigen Temperaturverlauf.
            - Satz 1 (Verlauf): Morgentemperatur zur Orientierung, Nachmittagshöchstwert mit Himmel/Sonne, und die Abkühlung am Abend (z.B. "Morgen früh starten wir frisch bei acht Grad. Am Nachmittag klettert das Thermometer bei sonnigem Himmel auf milde neunzehn Grad, ehe es abends wieder auf zwölf Grad abkühlt.").
              * Bei geringem Unterschied (unter 4 Grad): Schlicht als beständigen Tag zusammenfassen (z.B. "Es bleibt morgen den ganzen Tag über kühl bei sieben bis neun Grad und bedecktem Himmel.").
            - Satz 2 (Niederschlag): Nur erwähnen, falls Regen droht oder explizit trocken bleibt (z.B. "Regen ist nicht zu erwarten." oder "Ab vierzehn Uhr setzt Regen ein.").
            - Satz 3: Eine konkrete, abgestimmte Kleidungsempfehlung, die den Verlauf berücksichtigt (z.B. "Für den Vormittag empfiehlt sich eine Übergangsjacke, später reicht ein Sakko." bzw. "Eine wetterfeste Jacke ist angeraten.").
            {%- else %}
            - Satz 1 (Verlauf): Aktuelle Temperatur / Vormittag zur Orientierung, Nachmittagshöchstwert mit Himmel/Sonne, und die Abkühlung am Abend (z.B. "Aktuell starten wir bei frischen sieben Grad. Am Nachmittag klettert das Thermometer bei Sonnenschein auf angenehme neunzehn Grad, bevor es zum Abend wieder auf zwölf Grad abkühlt.").
              * Bei geringem Unterschied (unter 4 Grad): Schlicht als beständigen Tag zusammenfassen (z.B. "Es bleibt heute den ganzen Tag über kühl bei sieben bis neun Grad und verhangenem Himmel.").
            - Satz 2 (Niederschlag): Nur erwähnen, falls Regen droht oder explizit trocken bleibt (z.B. "Regen ist heute nicht in Sicht." oder "Ab vierzehn Uhr setzt Regen ein.").
            - Satz 3: Eine konkrete, abgestimmte Kleidungsempfehlung, die den Verlauf berücksichtigt (z.B. "Für den Vormittag empfiehlt sich eine Übergangsjacke, am Nachmittag reicht ein leichtes Sakko." bzw. "Ein Regenschirm sollte für den Nachmittag eingeplant werden.").
            {%- endif %}

            Absatz 3 (Fitness & Erholung - NUR falls in den Daten vorhanden):
            {%- if is_night %}
            - Schritte heute: Nenne kurz und dezent die bisherigen Schritte des Tages, gerundet auf 500er (z.B. "Heute stehen bislang rund achttausend Schritte zu Buche." oder "Bislang sind es heute knapp siebeneinhalbtausend Schritte.").
            {%- else %}
            - Schlaf und gestrige Aktivität in ein bis zwei ruhigen, dezenten Sätzen (z.B. "Die Nacht brachte acht Stunden und vierzig Minuten Schlaf. Gestern lagst du bei rund siebeneinhalbtausend Schritten.").
            - Schrittzahl IMMER gerundet auf halbe Tausender nennen (z.B. "rund siebeneinhalbtausend Schritte", "knapp siebentausendfünfhundert Schritte") – NIEMALS exakte oder krumme Zahlen sprechen.
            - Nur erwähnen, was tatsächlich in den Daten vorhanden ist.
            {%- endif %}
            - Wichtig: Niemals motivierend oder belehrend wie ein Fitnesstrainer klingen. Einfach sachlich, dezent und elegant im JARVIS-Ton.
            - Liegen keine Fitnessdaten vor: Diesen Absatz komplett weglassen!

            Absatz 4 (Termine & Tagesplan):
            {%- if is_night %}
            - Blicke direkt auf morgen: Nenne die morgigen Termine ruhig nacheinander in kurzen Einzelsätzen. Falls morgen frei ist: Erwähne, dass der morgige Tag terminfrei ist.
            {%- else %}
            - Wenn heute noch Termine anstehen: Nenne jeden anstehenden Termin in einem eigenen kurzen Satz.
            - Wenn heute keine Termine mehr anstehen: Sage, dass heute keine Termine mehr anstehen, und nenne die Termine für morgen (oder erwähne, dass auch morgen frei ist).
            {%- endif %}
            - Falls Aufgaben vorliegen: Kurz und beiläufig in einem Satz erwähnen.

            {%- if is_weekend and not is_night %}
            Absatz 5 (Wochenende - nur falls heute terminfrei):
            - Eine kurze Ausflugsidee für die Familie in Augsburg (z.B. Siebentischwald oder Zoo).
            {%- endif %}

            Absatz {{ '6' if is_weekend and not is_night else '5' }} (Smart-Home-Hinweise - NUR falls in den Daten vorhanden):
            - Falls offene Fenster oder Offline-Sensoren vorliegen: Binde dies ruhig und beiläufig in einem Satz ein (z.B. "Hinweis: Das Schlafzimmerfenster steht aktuell noch offen.", "Der Küchenfenster-Kontakt meldet sich seit einigen Tagen nicht.").
            - Liegen keine Hinweise vor: Diesen Absatz komplett weglassen!

            Absatz {{ '7' if is_weekend and not is_night else '6' }} (Stilvoller Abschluss):
            {%- if is_night %}
            - Ein kurzer, vornehmer Nacht-Abschluss (z.B. "Eine gute Nacht und angenehme Ruhe." oder "Einen erholsamen Abend.").
            {%- else %}
            - Ein kurzer, vornehmer Tages-Abschluss (z.B. "Einen erfolgreichen und angenehmen Tag." oder "Einen guten Start in den Tag.").
            {%- endif %}

            STRENG VERBOTEN:
            - Niemals einen Namen nennen (weder Julian noch Sir). Sprich direkt in der Du-Form, niemals mit Sie.
            - Keine Roboterfloskeln ("Alle Systeme laufen einwandfrei", "Statusbericht").
            - Keine übertriebenen Motivationssprüche.
            - Keine exakten oder krummen Schrittzahlen nennen – stets auf 500er runden (z.B. "rund siebentausendfünfhundert Schritte" oder "rund siebeneinhalbtausend Schritte" statt exakter Zahlen).
            - Keine Doppelpunkte, keine Aufzählungszeichen, kein Markdown. Uhrzeiten immer in Worten ("um acht Uhr", "halb drei").

            BEISPIEL:
            Guten Morgen. Es ist jetzt acht Uhr fünfzehn.

            Aktuell starten wir bei frischen sieben Grad. Am Nachmittag klettert das Thermometer bei Sonnenschein auf angenehme neunzehn Grad, bevor es zum Abend wieder auf zwölf Grad abkühlt. Für den Vormittag empfiehlt sich eine Übergangsjacke, später reicht ein Sakko.

            Die Nacht brachte acht Stunden und vierzig Minuten Schlaf. Gestern lagst du bei rund siebeneinhalbtausend Schritten.

            Die Termine beginnen um neun Uhr mit dem Team-Meeting. Um vierzehn Uhr folgt die Projektbesprechung.

            Das Fenster im Schlafzimmer steht aktuell noch offen.

            Einen guten und erfolgreichen Start in den Tag.

            AKTUELLE DATEN:
            - Uhrzeit jetzt: {{ now().strftime('%H:%M') }} Uhr, {{ ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] }}
            - Modus: {{ 'Spätabends (Fokus auf morgen)' if is_night else 'Tagsüber (Fokus auf heute)' }}
            - Temperaturverlauf & Wetter:
            {%- if is_night %}
            {%- if wx.all %}
              * Fokus: Morgen (ganzer Tag)
              * Start am Morgen: ca. {{ morn_t }} Grad
              * Nachmittag (Höchstwert): bis zu {{ aft_t }} Grad, {{ wx.conditions | join(', ') }}
              * Abkühlung am Abend: ca. {{ eve_t }} Grad
              * Niederschlag: {{ ('Regen ab etwa ' ~ wx.rain_times[0] ~ '.') if wx.rain_times else 'Kein Regen erwartet.' }}
            {%- else %}
              * Keine Vorhersagedaten verfügbar (Wetter weglassen).
            {%- endif %}
            {%- else %}
            {%- if wx.all %}
              * Fokus: Restlicher Tag heute
              {%- if hour < 11 %}
              * Aktuell am Morgen: {{ cur_temp }} Grad
              * Nachmittag (Höchstwert): bis zu {{ aft_t }} Grad, {{ wx.conditions | join(', ') }}
              * Abkühlung am Abend: ca. {{ eve_t }} Grad
              {%- elif hour < 17 %}
              * Aktuell: {{ cur_temp }} Grad
              * Nachmittag (Höchstwert): bis zu {{ aft_t }} Grad, {{ wx.conditions | join(', ') }}
              * Abkühlung am Abend: ca. {{ eve_t }} Grad
              {%- else %}
              * Aktuell am Abend: {{ cur_temp }} Grad, {{ wx.conditions | join(', ') }}
              * Späterer Abend / Nacht: ca. {{ eve_t }} Grad
              {%- endif %}
              * Niederschlag: {{ ('Regen ab etwa ' ~ wx.rain_times[0] ~ '.') if wx.rain_times else 'Kein Regen erwartet.' }}
            {%- else %}
              * Keine Vorhersagedaten verfügbar (Wetter weglassen).
            {%- endif %}
            {%- endif %}
            - Fitness & Erholung:
            {%- if is_night %}
            {%- if t_steps >= 500 %}
              * Schritte heute bisher: rund {{ t_steps }} Schritte (bereits auf 500er gerundet)
            {%- else %}
              * Keine Daten (Absatz weglassen).
            {%- endif %}
            {%- else %}
            {%- set has_fitness = (sleep_min >= 60) or (y_steps >= 500) %}
            {%- if has_fitness %}
            {%- if sleep_min >= 60 %}
              * Schlafdauer letzte Nacht: {{ sleep_h }} Stunde{{ 'n' if sleep_h != 1 else '' }}{{ (' und ' ~ sleep_m ~ ' Minuten') if sleep_m > 0 else '' }}
            {%- endif %}
            {%- if y_steps >= 500 %}
              * Schritte gestern: rund {{ y_steps }} Schritte (bereits auf 500er gerundet)
            {%- endif %}
            {%- else %}
              * Keine Daten (Absatz weglassen).
            {%- endif %}
            {%- endif %}
            {%- if is_night %}
            - Termine morgen:
            {%- for ev in cal_tomorrow.items | sort(attribute='sort') %}
              * {{ ev.text }}
            {%- else %}
              * Morgen keine Termine (Kalender ist frei).
            {%- endfor %}
            {%- else %}
            - Noch anstehende Termine heute:
            {%- for ev in cal_today.items | sort(attribute='sort') %}
              * {{ ev.text }}
            {%- else %}
              * Keine weiteren Termine heute.
            {%- endfor %}
            - Termine morgen:
            {%- for ev in cal_tomorrow.items | sort(attribute='sort') %}
              * {{ ev.text }}
            {%- else %}
              * Auch morgen keine Termine (Kalender ist frei).
            {%- endfor %}
            {%- endif %}
            - Aufgaben:
            {%- if todo_items is not defined %}
              * Aufgabenliste derzeit nicht erreichbar.
            {%- else %}
            {%- for td in tasks.items %}
              * {{ td }}
            {%- else %}
              * Keine fälligen Aufgaben.
            {%- endfor %}
            {%- endif %}
            - Smart-Home-Hinweise:
            {%- if notices.list | length > 0 %}
            {%- for n in notices.list %}
              * {{ n }}
            {%- endfor %}
            {%- else %}
              * Keine Auffälligkeiten (nicht erwähnen).
            {%- endif %}

            Gib ausschließlich den gesprochenen Text mit Leerzeilen zwischen den Absätzen aus:
          error_message: "Guten Morgen. Das Tages-Briefing konnte gerade nicht geladen werden."
