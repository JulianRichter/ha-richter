automation:
  # ====================================================================
  # Home - Spotify to Music Assistant
  # - Detects native Spotify Cast playback (Google Home voice or Spotify Connect) on a speaker
  # - Debounces stale metadata: Spotify briefly restores the previous session on launch, so
  #   every track change restarts the run and only settled speaker metadata is used
  # - Uses Spotify's playlist only when Spotify is verifiably playing the same track
  # - Hands over playback to the Music Assistant player on the same physical speaker
  # ====================================================================

  - id: "home_spotify_to_music_assistant"
    alias: "Home - Spotify to Music Assistant"
    description: "Hands over native Spotify Cast playback to Music Assistant on the same speaker."
    mode: restart

    # ------------------------------------------------------------------
    # Triggers: Cast speaker starts playing or switches track
    # ------------------------------------------------------------------
    trigger:
      # Cast speaker starts playing (ignores HA startup restores)
      - trigger: state
        entity_id: &cast_speakers
          - media_player.living_room_cast
          - media_player.kitchen_cast
          - media_player.bedroom_cast
          - media_player.bathroom_cast
          - media_player.baby_room_cast
          - media_player.entrance_cast
          - media_player.minis_cast
          - media_player.wohnzimmer_kuche
          - media_player.chromecast_cast
        to: "playing"
        not_from:
          - "unavailable"
          - "unknown"

      # Track changes on the speaker (restarts the run -> debounces stale session data)
      - trigger: state
        entity_id: *cast_speakers
        attribute: media_title

    # ------------------------------------------------------------------
    # Variables: Speaker mapping and shared settings
    # ------------------------------------------------------------------
    variables:
      # Cast entity -> Music Assistant player on the same physical speaker
      speaker_map:
        media_player.living_room_cast: media_player.living_room
        media_player.kitchen_cast: media_player.kitchen
        media_player.bedroom_cast: media_player.bedroom
        media_player.bathroom_cast: media_player.bathroom
        media_player.baby_room_cast: media_player.baby_room
        media_player.entrance_cast: media_player.entrance
        media_player.minis_cast: media_player.minis
        media_player.wohnzimmer_kuche: media_player.wohnzimmer_kuche_2
        media_player.chromecast_cast: media_player.chromecast
      spotify_entity: media_player.spotify_julian
      cast_entity: "{{ trigger.entity_id }}"
      target_player: "{{ speaker_map.get(cast_entity, '') }}"
      settle_seconds: 3

    # ------------------------------------------------------------------
    # Conditions: Mapped speaker is playing the native Spotify receiver
    # ------------------------------------------------------------------
    condition:
      # Speaker is mapped, playing, and running the Spotify Cast app
      - condition: template
        value_template: >-
          {{ target_player != ''
             and is_state(cast_entity, 'playing')
             and (state_attr(cast_entity, 'app_name') | default('', true) | lower) == 'spotify' }}

    # ------------------------------------------------------------------
    # Actions: Wait for settled metadata, then hand over to Music Assistant
    # ------------------------------------------------------------------
    action:
      # Step 1: Debounce - any track change during this delay restarts the run
      - delay:
          seconds: "{{ settle_seconds }}"

      # Step 2: Abort if the speaker stopped playing Spotify or has no track info
      - condition: template
        value_template: >-
          {{ is_state(cast_entity, 'playing')
             and (state_attr(cast_entity, 'app_name') | default('', true) | lower) == 'spotify'
             and (state_attr(cast_entity, 'media_title') | default('', true)) != '' }}

      # Step 3: Capture the settled track from the speaker (source of truth)
      - variables:
          cast_title: "{{ state_attr(cast_entity, 'media_title') | default('', true) }}"
          cast_artist: "{{ state_attr(cast_entity, 'media_artist') | default('', true) }}"
          cast_uri: >-
            {% set content_id = state_attr(cast_entity, 'media_content_id') | default('', true) | string %}
            {{ content_id if content_id.startswith('spotify:track:') else '' }}

      # Step 4: Refresh the Spotify entity until it reports the same track (max ~6 s)
      - repeat:
          sequence:
            - action: homeassistant.update_entity
              target:
                entity_id: "{{ spotify_entity }}"
            - delay:
                milliseconds: 1500
          until:
            - condition: template
              value_template: >-
                {% set same_title = state_attr(spotify_entity, 'media_title') == cast_title %}
                {% set same_uri = cast_uri != '' and state_attr(spotify_entity, 'media_content_id') == cast_uri %}
                {{ repeat.index >= 4 or (is_state(spotify_entity, 'playing') and (same_title or same_uri)) }}

      # Step 5: Only trust Spotify data (playlist, shuffle) if it plays the same track
      - variables:
          spotify_synced: >-
            {% set same_title = state_attr(spotify_entity, 'media_title') == cast_title %}
            {% set same_uri = cast_uri != '' and state_attr(spotify_entity, 'media_content_id') == cast_uri %}
            {{ is_state(spotify_entity, 'playing') and (same_title or same_uri) }}
          spotify_playlist: "{{ (state_attr(spotify_entity, 'media_playlist') | default('', true)) if spotify_synced else '' }}"
          spotify_track_uri: "{{ (state_attr(spotify_entity, 'media_content_id') | default('', true)) if spotify_synced else '' }}"
          spotify_shuffle: "{{ spotify_synced and (state_attr(spotify_entity, 'shuffle') | default(false, true)) }}"

      # Step 6: Choose what to play (playlist > track URI > title search with radio)
      - variables:
          use_playlist: "{{ spotify_playlist != '' }}"
          media_type: "{{ 'playlist' if use_playlist else 'track' }}"
          media_id: >-
            {% if use_playlist %}
              {{ spotify_playlist }}
            {% elif spotify_track_uri != '' %}
              {{ spotify_track_uri }}
            {% elif cast_uri != '' %}
              {{ cast_uri }}
            {% else %}
              {{ cast_title }}
            {% endif %}
          # Artist is only needed to disambiguate a free-text title search
          search_by_title: "{{ not use_playlist and spotify_track_uri == '' and cast_uri == '' }}"

      # Step 7: Hand over playback to Music Assistant
      - if:
          # Title search -> pass artist for exact matching
          - condition: template
            value_template: "{{ search_by_title and cast_artist != '' }}"
        then:
          - action: music_assistant.play_media
            target:
              entity_id: "{{ target_player }}"
            data:
              media_id: "{{ media_id }}"
              media_type: "{{ media_type }}"
              artist: "{{ cast_artist }}"
              radio_mode: true
              enqueue: replace
        # Playlist or Spotify URI -> no artist needed; radio only for single tracks
        else:
          - action: music_assistant.play_media
            target:
              entity_id: "{{ target_player }}"
            data:
              media_id: "{{ media_id }}"
              media_type: "{{ media_type }}"
              radio_mode: "{{ not use_playlist }}"
              enqueue: replace

      # Step 8: Restore shuffle for playlists that were shuffled on Spotify
      - if:
          - condition: template
            value_template: "{{ use_playlist and spotify_shuffle }}"
        then:
          - action: media_player.shuffle_set
            target:
              entity_id: "{{ target_player }}"
            data:
              shuffle: true

