automation:
  # ====================================================================
  # Bathroom - Motion Sensor
  # - Controls bathroom lighting based on occupancy sensors
  # - Turns on dimmed when sleeping, motion brightness (200) when awake
  # - Motion cleared: Turns off light only if currently at motion or sleep brightness
  # - Tolerates offline/unavailable sensors without blocking turn-off
  # - Manual switch or voice command overrules motion automation
  # ====================================================================

  - id: "bathroom_motion_sensor"
    alias: "Bathroom - Motion Sensor"
    mode: restart

    variables:
      brightness_sleep: "{{ states('input_number.light_brightness_sleep') | int(5) }}"
      brightness_motion: "{{ states('input_number.light_brightness_motion') | int(200) }}"

    trigger:
      # Motion detected or cleared on either occupancy sensor
      - trigger: state
        entity_id:
          - binary_sensor.bathroom_motion_sensor_occupancy
          - binary_sensor.bathroom_shower_motion_sensor_occupancy
        to:
          - "on"
          - "off"

    condition: []

    action:
      - choose:
          # Motion detected: turn on light if off, or recovering from clearance fade
          - conditions:
              # Motion active
              - condition: template
                value_template: "{{ trigger.to_state.state == 'on' }}"

              # Light is off, or low dimmed (<= sleep) during awake mode
              - condition: template
                value_template: >-
                  {% set b = state_attr('light.bathroom_light', 'brightness') | default(0, true) | int(0) %}
                  {{ is_state('light.bathroom_light', 'off') or (b <= brightness_sleep and is_state('input_boolean.presence_home', 'on')) }}
            sequence:
              # Turn light on (dimmed if sleeping, motion brightness otherwise)
              - action: light.turn_on
                target:
                  entity_id: light.bathroom_light
                data:
                  brightness: "{{ brightness_sleep if is_state('input_boolean.presence_home', 'off') else brightness_motion }}"
                  transition: 1

          # Motion cleared: turn off light only if set by motion (sleep or motion brightness)
          - conditions:
              # Motion cleared on trigger sensor
              - condition: template
                value_template: "{{ trigger.to_state.state == 'off' }}"

              # Neither motion sensor is actively detecting motion (tolerant to offline/unavailable sensors)
              - condition: template
                value_template: >-
                  {{ not is_state('binary_sensor.bathroom_motion_sensor_occupancy', 'on') and
                     not is_state('binary_sensor.bathroom_shower_motion_sensor_occupancy', 'on') }}

              # Light is currently on
              - condition: state
                entity_id: light.bathroom_light
                state: "on"

              # Light is at sleep brightness or motion brightness (manual/voice overrides)
              - condition: template
                value_template: >-
                  {% set b = state_attr('light.bathroom_light', 'brightness') | default(0, true) | int(0) %}
                  {{ b <= brightness_sleep or b == brightness_motion }}
            sequence:
              # Turn off slowly if bright, fast if already dim via light_low_before_off
              - action: script.light_low_before_off
                data:
                  entity_id: light.bathroom_light
                  transition: "{{ 1 if (state_attr('light.bathroom_light', 'brightness') | default(0, true) | int(0) <= brightness_sleep) else 15 }}"
