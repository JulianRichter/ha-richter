automation:
  # ====================================================================
  # Living Room - Motion Sensor
  # - Controls living room light group and tablet screen based on motion
  # - Turns on motion brightness (200) after dark when awake, dim red when sleeping
  # - Motion cleared: Turns off light only if currently at motion or sleep brightness
  # - Manual switch or voice command overrules motion automation
  # ====================================================================

  - id: "living_room_motion_sensor"
    alias: "Living Room - Motion Sensor"
    mode: restart

    variables:
      brightness_sleep: "{{ states('input_number.light_brightness_sleep') | int(5) }}"
      brightness_motion: "{{ states('input_number.light_brightness_motion') | int(200) }}"
      color_sleep: >-
        {% set raw = states('input_text.light_color_sleep') %}
        {{ raw.split(',') | map('int') | list if (raw not in ['unknown', 'unavailable', '', 'none'] and ',' in raw) else [255, 0, 0] }}
      color_awake: >-
        {% set raw = states('input_text.light_color_awake') %}
        {{ raw.split(',') | map('int') | list if (raw not in ['unknown', 'unavailable', '', 'none'] and ',' in raw) else [255, 166, 87] }}

    trigger:
      # Motion state changes
      - trigger: state
        entity_id: binary_sensor.living_room_motion_sensor_occupancy
        to:
          - "on"
          - "off"

    condition: []

    action:
      - choose:
          # Motion detected (awake, below horizon)
          - conditions:
              - condition: state
                entity_id: binary_sensor.living_room_motion_sensor_occupancy
                state: "on"
              - condition: state
                entity_id: sun.sun
                state: "below_horizon"
              - condition: state
                entity_id: input_boolean.presence_home
                state: "on"
            sequence:
              # Wake tablet screen
              - action: switch.turn_on
                target:
                  entity_id: switch.living_room_tablet_screen

              # Turn on motion light only if spot relay is off AND light group is off or recovering from fade
              - if:
                  - condition: state
                    entity_id: switch.living_room_spot_lights
                    state: "off"
                  - condition: template
                    value_template: >-
                      {% set b = state_attr('light.living_room_light_group', 'brightness') | default(0, true) | int(0) %}
                      {{ is_state('light.living_room_light_group', 'off') or b <= brightness_sleep }}
                then:
                  - action: light.turn_on
                    target:
                      entity_id: light.living_room_light_group
                    data:
                      brightness: "{{ brightness_motion }}"
                      rgb_color: "{{ color_awake }}"

          # Motion detected (sleeping, below horizon)
          - conditions:
              - condition: state
                entity_id: binary_sensor.living_room_motion_sensor_occupancy
                state: "on"
              - condition: state
                entity_id: sun.sun
                state: "below_horizon"
              - condition: state
                entity_id: input_boolean.presence_home
                state: "off"
            sequence:
              # Wake tablet screen
              - action: switch.turn_on
                target:
                  entity_id: switch.living_room_tablet_screen

              # Turn on night red light only if spot relay is off AND light group is off
              - if:
                  - condition: state
                    entity_id: switch.living_room_spot_lights
                    state: "off"
                  - condition: state
                    entity_id: light.living_room_light_group
                    state: "off"
                then:
                  - action: light.turn_on
                    target:
                      entity_id: light.living_room_light_group
                    data:
                      brightness: "{{ brightness_sleep }}"
                      rgb_color: "{{ color_sleep }}"

          # Motion detected (daytime, above horizon)
          - conditions:
              - condition: state
                entity_id: binary_sensor.living_room_motion_sensor_occupancy
                state: "on"
              - condition: state
                entity_id: sun.sun
                state: "above_horizon"
            sequence:
              # Wake tablet screen
              - action: switch.turn_on
                target:
                  entity_id: switch.living_room_tablet_screen

          # Motion cleared: turn off light only if set by motion (sleep or motion brightness)
          - conditions:
              - condition: state
                entity_id: binary_sensor.living_room_motion_sensor_occupancy
                state: "off"
              - condition: state
                entity_id: light.living_room_light_group
                state: "on"
              - condition: template
                value_template: >-
                  {% set b = state_attr('light.living_room_light_group', 'brightness') | default(0, true) | int(0) %}
                  {{ b <= brightness_sleep or b == brightness_motion }}
            sequence:
              - action: script.light_low_before_off
                data:
                  entity_id: light.living_room_light_group
                  transition: "{{ 1 if (state_attr('light.living_room_light_group', 'brightness') | default(0, true) | int(0) <= brightness_sleep) else 15 }}"

        default: []
