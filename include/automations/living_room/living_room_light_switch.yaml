automation:
  # ====================================================================
  # Living Room - Light Switch
  # - Controls living room light group and spot relays via wall switch
  # - Single press up when off: Turns on dim/warm ambient light first
  # - Single press up when on: Steps up to full daylight (or toggles back to dim)
  # - Single press down: Turns off lights smoothly via light_low_before_off
  # - Up/Down hold: Controls spot light switches
  # ====================================================================

  - id: "living_room_light_switch"
    alias: "Living Room - Light Switch"
    mode: single

    variables:
      brightness_high: "{{ states('input_number.light_brightness_high') | int(255) }}"
      brightness_awake: "{{ states('input_number.light_brightness_awake') | int(126) }}"
      color_awake: >-
        {% set raw = states('input_text.light_color_awake') %}
        {{ raw.split(',') | map('int') | list if (raw not in ['unknown', 'unavailable', '', 'none'] and ',' in raw) else [255, 166, 87] }}

    trigger:
      # Button action event from living room switch
      - trigger: state
        entity_id: event.living_room_light_switch_action
        not_from: unavailable
        not_to: unavailable

    condition: []

    action:
      - choose:
          # Up single press: toggle between bright daylight and warm ambient
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'on' }}"
            sequence:
              - choose:
                  # If living room lights are off: always start with dim/warm ambient first
                  - conditions:
                      - condition: state
                        entity_id: light.living_room_light_group
                        state: "off"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.living_room_light_group
                        data:
                          brightness: "{{ brightness_awake }}"
                          rgb_color: "{{ color_awake }}"

                  # If already at full brightness: toggle back to dim/warm ambient
                  - conditions:
                      - condition: template
                        value_template: "{{ state_attr('light.living_room_light_group', 'brightness') | default(0, true) | int(0) == brightness_high }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.living_room_light_group
                        data:
                          brightness: "{{ brightness_awake }}"
                          rgb_color: "{{ color_awake }}"

                # If already at dim/warm: step up to full brightness
                default:
                  - action: light.turn_on
                    target:
                      entity_id: light.living_room_light_group
                    data:
                      brightness: "{{ brightness_high }}"
                      color_temp_kelvin: 2700

          # Down single press: turn off lights smoothly
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'off' }}"
            sequence:
              - action: script.light_low_before_off
                data:
                  entity_id: light.living_room_light_group

          # Up hold: turn on spot lights
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_up' }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.living_room_spot_lights

          # Down hold: turn off spot lights
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_down' }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.living_room_spot_lights
