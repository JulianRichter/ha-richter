automation:
  # ====================================================================
  # Living Room - Window Sensor
  # - Controls living room thermostat & curtain based on window contact state
  # - Opens left curtain and turns off thermostat when window is opened
  # - Restores thermostat and re-closes left curtain if right curtain is closed
  # - Announces in German and optionally in Chinese via play_media_tts_window scripts
  # ====================================================================

  - id: "living_room_window_sensor"
    alias: "Living Room - Window Sensor"
    mode: restart
    trigger:
      # Window opened
      - trigger: state
        entity_id: binary_sensor.living_room_window_contact
        from: "off"
        to: "on"
        id: window_opened

      # Window closed
      - trigger: state
        entity_id: binary_sensor.living_room_window_contact
        from: "on"
        to: "off"
        id: window_closed

    condition: []

    action:
      - choose:
          # Window opened: open left curtain, turn off heating, and announce
          - conditions:
              - condition: trigger
                id: window_opened
            sequence:
              # Automatically open left curtain to clear window area
              - if:
                  - condition: template
                    value_template: "{{ states('cover.living_room_curtain_left') != 'open' }}"
                then:
                  - action: cover.open_cover
                    target:
                      entity_id: cover.living_room_curtain_left

              # Turn off living room thermostat
              - action: climate.turn_off
                target:
                  entity_id: climate.living_room_thermostat

              # Announce window opened via caring TTS
              - action: script.play_media_tts_window_opened
                data:
                  entity_id: media_player.living_room
                  humidity_sensor: sensor.living_room_multi_sensor_humidity

          # Window closed: restore left curtain if right is closed, turn on heating, and announce
          - conditions:
              - condition: trigger
                id: window_closed
            sequence:
              # Restore left curtain to closed if right curtain is closed/closing
              - if:
                  - condition: template
                    value_template: >
                      {{ states('cover.living_room_curtain_right') in ['closed', 'closing']
                         and states('cover.living_room_curtain_left') != 'closed' }}
                then:
                  - action: cover.close_cover
                    target:
                      entity_id: cover.living_room_curtain_left

              # Turn on living room thermostat
              - action: climate.turn_on
                target:
                  entity_id: climate.living_room_thermostat

              # Announce window closed via caring TTS
              - action: script.play_media_tts_window_closed
                data:
                  entity_id: media_player.living_room
                  humidity_sensor: sensor.living_room_multi_sensor_humidity
