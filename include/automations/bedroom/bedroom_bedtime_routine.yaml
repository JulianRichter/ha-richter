automation:
  # ====================================================================
  # Bedroom - Bedtime Routine
  # - Detects Julian going to sleep between 22:00 and 06:00
  # - Triggers when phone is charging AND left bedside light is turned off
  # - Handles both event sequences (plugging in then light off, or light off then plugging in)
  # - Transitions house to night presence state, sets thermostats to night setpoint
  # - Smoothly turns off all remaining lights across living room, kitchen, bathroom, and baby room
  # ====================================================================

  - id: "bedroom_bedtime_routine"
    alias: "Bedroom - Bedtime Routine"
    mode: single

    trigger:
      # Sequence A: Bedside light turned off while phone is already charging
      - id: light_turned_off
        trigger: state
        entity_id: light.bedroom_light_left
        to: "off"

      # Sequence B: Phone plugged into charger while bedside light is already off
      - id: phone_charging_binary
        trigger: state
        entity_id: binary_sensor.julian_is_charging
        to: "on"

    condition:
      # Only activate during night hours (10:00 PM to 6:00 AM)
      - condition: time
        after: "22:00:00"
        before: "06:00:00"

      # Family is home
      - condition: state
        entity_id: group.residents
        state: "home"

      # Only run if house is currently in awake/home mode (avoids re-triggering during sleep)
      - condition: state
        entity_id: input_boolean.presence_home
        state: "on"

      # Left bedside lamp must be off
      - condition: state
        entity_id: light.bedroom_light_left
        state: "off"

      # Julian's phone must be actively charging
      - condition: template
        value_template: "{{ is_state('binary_sensor.julian_is_charging', 'on') }}"

    action:
      # Set house presence to night/away state
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.presence_home

      # Lower thermostats to nighttime setback temperature
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.living_room_thermostat
            - climate.kitchen_thermostat
            - climate.bedroom_thermostat
            - climate.baby_room_thermostat
        data:
          temperature: "{{ states('input_number.dashboard_thermostat_setpoint_night') | float(17) }}"

      # Smoothly turn off remaining lights throughout the house
      - action: script.light_low_before_off
        data:
          entity_id:
            - light.living_room_light_group
            - light.kitchen_light_group
            - light.bathroom_light
            - light.bedroom_light_sphere
            - light.bedroom_light_right
            - light.baby_room_light

      # Turn off living room spot relay switch if active
      - action: switch.turn_off
        target:
          entity_id: switch.living_room_spot_lights
