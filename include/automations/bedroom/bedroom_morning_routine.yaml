automation:
  # ====================================================================
  # Bedroom - Morning Routine
  # - Starts 15 min before alarm (once/day when alarm enabled and residents home)
  # - Priority: Google Home alarm > Julian next phone alarm > input_datetime fallback
  # - Starts 10m sunrise light effect, opens blinds, plays TTS at alarm time, turns off light 15m later
  # ====================================================================

  - id: "bedroom_morning_routine"
    alias: "Bedroom - Morning Routine"
    mode: single

    variables:
      start_offset: 900 # 15 minutes before alarm time (in seconds)
      sunrise_time: 600 # 10 minutes duration for sunrise light effect (in seconds)

    trigger:
      # Priority 1: Google Home alarm (15 minutes prior)
      - trigger: template
        value_template: >
          {% set alarm_dt = states('sensor.bedroom_alarms') | as_datetime %}
          {% if alarm_dt is not none and alarm_dt > now() %}
            {{ (now() + timedelta(minutes=15)).strftime('%Y-%m-%d %H:%M') == (alarm_dt | as_local).strftime('%Y-%m-%d %H:%M') }}
          {% else %}
            false
          {% endif %}

      # Priority 2: Julian phone next alarm (15 minutes prior, if Google alarm unset)
      - trigger: template
        value_template: >
          {% set google_alarm_dt = states('sensor.bedroom_alarms') | as_datetime %}
          {% if google_alarm_dt is none or google_alarm_dt < now() %}
            {% set phone_alarm_dt = states('sensor.julian_next_alarm') | as_datetime %}
            {% if phone_alarm_dt is not none and phone_alarm_dt > now() %}
              {{ (now() + timedelta(minutes=15)).strftime('%Y-%m-%d %H:%M') == (phone_alarm_dt | as_local).strftime('%Y-%m-%d %H:%M') }}
            {% else %}
              false
            {% endif %}
          {% else %}
            false
          {% endif %}

      # Priority 3: Fallback datetime helper (15 minutes prior, if both Google and phone alarms unset)
      - trigger: template
        value_template: >
          {% set google_alarm_dt = states('sensor.bedroom_alarms') | as_datetime %}
          {% set phone_alarm_dt = states('sensor.julian_next_alarm') | as_datetime %}
          {% if (google_alarm_dt is none or google_alarm_dt < now()) and (phone_alarm_dt is none or phone_alarm_dt < now()) %}
            {% set alarm = states('input_datetime.bedroom_alarm_time') %}
            {% if alarm not in ['unknown', 'unavailable', 'none', ''] %}
              {{ (now() + timedelta(minutes=15)).strftime('%H:%M') == alarm[:5] }}
            {% else %}
              false
            {% endif %}
          {% else %}
            false
          {% endif %}

    condition:
      # Ensure bedroom morning alarm is not disabled
      - condition: state
        entity_id: input_boolean.bedroom_alarm_disabled
        state: "off"

      # Only run once per calendar day
      - condition: template
        value_template: >
          {% set last_run = state_attr('automation.bedroom_morning_routine', 'last_triggered') %}
          {{ last_run is none or (last_run | as_datetime | as_local).date() != now().date() }}

      # Only continue bedroom wake-up sequence if someone is at home
      - condition: state
        entity_id: group.residents
        state: "home"

    action:
      # Start 10-minute sunrise light ramp on bedside lamp
      - action: script.light_sunrise
        data:
          entity_id: light.bedroom_light_left
          seconds: "{{ sunrise_time }}"

      # Wait until wake-up time (15 minutes after routine start)
      - delay:
          seconds: "{{ start_offset }}"

      # Open bedroom roller blinds
      - action: cover.open_cover
        target:
          entity_id: cover.bedroom_roller_blinds

      # Play TTS "Guten Morgen" on bedroom speaker
      - action: script.play_media_tts_message
        data:
          entity_id: media_player.bedroom
          message: Guten Morgen

      # Keep light on for another 15 minutes before turning off
      - delay:
          seconds: "{{ start_offset }}"

      # Smoothly turn off bedside light
      - action: script.light_low_before_off
        data:
          entity_id: light.bedroom_light_left
