automation:
  # ====================================================================
  # Bedroom - Motion Sensor Right
  # - Controls right bedside light based on occupancy
  # - Sun down & home (awake): Turns on motion brightness (200)
  # - Sun down & away (sleeping): Turns on ultra-dim red night light (brightness 5)
  # - Motion cleared: Turns off light only if currently at motion or sleep brightness
  # - Bedside switch or voice command overrules motion automation
  # ====================================================================

  - id: "bedroom_motion_sensor_right"
    alias: "Bedroom - Motion Sensor Right"
    mode: restart

    variables:
      brightness_sleep: "{{ states('input_number.light_brightness_sleep') | int(5) }}"
      brightness_motion: "{{ states('input_number.light_brightness_motion') | int(200) }}"
      color_sleep: >-
        {% set raw = states('input_text.light_color_sleep') %}
        {{ raw.split(',') | map('int') | list if (raw not in ['unknown', 'unavailable', '', 'none'] and ',' in raw) else [255, 0, 0] }}
      color_awake: >-
        {% set raw = states('input_text.light_color_awake') %}
        {{ raw.split(',') | map('int') | list if (raw not in ['unknown', 'unavailable', '', 'none'] and ',' in raw) else [255, 166, 87] }}

    trigger:
      # Motion detected
      - trigger: state
        entity_id: binary_sensor.bedroom_motion_sensor_right_occupancy
        to: "on"
        id: motion_detected

      # Motion cleared
      - trigger: state
        entity_id: binary_sensor.bedroom_motion_sensor_right_occupancy
        to: "off"
        id: motion_cleared

    condition: []

    action:
      - choose:
          # ============================================================
          # Motion detected
          # ============================================================
          - conditions:
              - condition: trigger
                id: motion_detected
            sequence:
              - choose:
                  # ----------------------------------------------------
                  # Sleeping mode (Sun down & sleeping)
                  # ----------------------------------------------------
                  - conditions:
                      - condition: state
                        entity_id: sun.sun
                        state: below_horizon
                      - condition: state
                        entity_id: input_boolean.presence_home
                        state: "off"
                      # Only turn on if bedside lamp is off
                      - condition: state
                        entity_id: light.bedroom_light_right
                        state: "off"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.bedroom_light_right
                        data:
                          brightness: "{{ brightness_sleep }}"
                          rgb_color: "{{ color_sleep }}"

                  # ----------------------------------------------------
                  # Awake mode (Sun down & not sleeping)
                  # ----------------------------------------------------
                  - conditions:
                      - condition: state
                        entity_id: sun.sun
                        state: below_horizon
                      - condition: state
                        entity_id: input_boolean.presence_home
                        state: "on"
                      # Bedside lamp off or recovering from fade
                      - condition: template
                        value_template: >-
                          {% set b = state_attr('light.bedroom_light_right', 'brightness') | default(0, true) | int(0) %}
                          {{ is_state('light.bedroom_light_right', 'off') or b <= brightness_sleep }}
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.bedroom_light_right
                        data:
                          brightness: "{{ brightness_motion }}"
                          rgb_color: "{{ color_awake }}"

          # ============================================================
          # Motion cleared
          # ============================================================
          - conditions:
              - condition: trigger
                id: motion_cleared
            sequence:
              - choose:
                  # Turn off light only if currently on and set by motion
                  - conditions:
                      - condition: state
                        entity_id: light.bedroom_light_right
                        state: "on"
                      - condition: template
                        value_template: >-
                          {% set b = state_attr('light.bedroom_light_right', 'brightness') | default(0, true) | int(0) %}
                          {{ b <= brightness_sleep or b == brightness_motion }}
                    sequence:
                      - action: script.light_low_before_off
                        data:
                          entity_id: light.bedroom_light_right
                          transition: "{{ 1 if (state_attr('light.bedroom_light_right', 'brightness') | default(0, true) | int(0) <= brightness_sleep) else 15 }}"

        default: []

