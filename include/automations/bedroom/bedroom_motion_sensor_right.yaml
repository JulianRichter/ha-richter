automation:
  # ====================================================================
  # Bedroom - Motion Sensor Right
  # - Controls right bedside light based on occupancy
  # - Sun down & home (awake): Turns on warm ambient light (brightness 126)
  # - Sun down & away (sleeping): Turns on ultra-dim red night light (brightness 5)
  # - Motion cleared: Smoothly turns off light if set by automation
  # ====================================================================

  - id: "bedroom_motion_sensor_right"
    alias: "Bedroom - Motion Sensor Right"
    mode: parallel
    max: 10

    variables:
      brightness_sleep: 5
      brightness_awake: 126
      color_sleep: [255, 0, 0]
      color_awake: [255, 166, 87]

    trigger:
      # Motion detected
      - trigger: state
        entity_id: binary_sensor.bedroom_motion_sensor_right_occupancy
        to: "on"
        id: motion_detected

      # Motion cleared
      - trigger: state
        entity_id: binary_sensor.bedroom_motion_sensor_right_occupancy
        to: "off"
        id: motion_cleared

    condition: []

    action:
      - choose:
          # ============================================================
          # Motion detected
          # ============================================================
          - conditions:
              - condition: trigger
                id: motion_detected
            sequence:
              - choose:
                  # ----------------------------------------------------
                  # Sleeping mode (Sun down & sleeping)
                  # ----------------------------------------------------
                  - conditions:
                      - condition: state
                        entity_id: sun.sun
                        state: below_horizon
                      - condition: state
                        entity_id: input_boolean.presence_home
                        state: "off"
                      - condition: template
                        value_template: >-
                          {% set brightness = state_attr('light.bedroom_light_right', 'brightness') %}
                          {{ brightness is none or brightness | int <= brightness_sleep or brightness | int == brightness_awake }}
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.bedroom_light_right
                        data:
                          brightness: "{{ brightness_sleep }}"
                          rgb_color: "{{ color_sleep }}"

                  # ----------------------------------------------------
                  # Awake mode (Sun down & not sleeping)
                  # ----------------------------------------------------
                  - conditions:
                      - condition: state
                        entity_id: sun.sun
                        state: below_horizon
                      - condition: state
                        entity_id: input_boolean.presence_home
                        state: "on"
                      - condition: template
                        value_template: >-
                          {% set brightness = state_attr('light.bedroom_light_right', 'brightness') %}
                          {{ brightness is none or brightness | int <= brightness_sleep or brightness | int == brightness_awake }}
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.bedroom_light_right
                        data:
                          brightness: "{{ brightness_awake }}"
                          rgb_color: "{{ color_awake }}"

          # ============================================================
          # Motion cleared
          # ============================================================
          - conditions:
              - condition: trigger
                id: motion_cleared
            sequence:
              - choose:
                  # Turn off light only if currently on and set by automation
                  - conditions:
                      - condition: state
                        entity_id: light.bedroom_light_right
                        state: "on"
                      - condition: template
                        value_template: >-
                          {% set brightness = state_attr('light.bedroom_light_right', 'brightness') %}
                          {{ brightness | int <= brightness_sleep or brightness | int == brightness_awake }}
                    sequence:
                      - action: script.light_low_before_off
                        data:
                          entity_id: light.bedroom_light_right

        default: []

