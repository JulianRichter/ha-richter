automation:
  # ====================================================================
  # Bedroom - Light Switch Door
  # - Controls bedroom ceiling light group and sphere lamp via door switch
  # - Single press up: Toggles ceiling light group (full daylight / warm ambient)
  # - Single press down: Smoothly turns off ceiling light group via light_low_before_off
  # - Hold up: Toggles sphere lamp (full daylight / warm ambient)
  # - Hold down: Smoothly turns off sphere lamp via light_low_before_off
  # ====================================================================

  - id: "bedroom_light_switch_door"
    alias: "Bedroom - Light Switch Door"
    mode: single

    variables:
      brightness_high: "{{ states('input_number.light_brightness_high') | int(255) }}"
      brightness_awake: "{{ states('input_number.light_brightness_awake') | int(126) }}"
      color_awake: >-
        {% set raw = states('input_text.light_color_awake') %}
        {{ raw.split(',') | map('int') | list if (raw not in ['unknown', 'unavailable', '', 'none'] and ',' in raw) else [255, 166, 87] }}

    trigger:
      # Switch action event
      - trigger: state
        entity_id: event.bedroom_light_switch_door_action
        not_from: unavailable
        not_to: unavailable

    condition: []

    action:
      - choose:
          # ============================================================
          # Up: Light group on
          # ============================================================
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'on' }}"
            sequence:
              - choose:
                  # If not full brightness, turn on full
                  - conditions:
                      - condition: template
                        value_template: "{{ state_attr('light.bedroom_light_group', 'brightness') | default(0, true) | int(0) != brightness_high }}"
                    sequence:
                      - action: light.turn_on
                        data:
                          brightness: "{{ brightness_high }}"
                          color_temp_kelvin: 2000
                        target:
                          entity_id: light.bedroom_light_group
                default:
                  # Toggle to warm ambient brightness
                  - action: light.turn_on
                    data:
                      brightness: "{{ brightness_awake }}"
                      rgb_color: "{{ color_awake }}"
                    target:
                      entity_id: light.bedroom_light_group

          # ============================================================
          # Down: Light group off
          # ============================================================
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'off' }}"
            sequence:
              # Smooth turn off
              - action: script.light_low_before_off
                data:
                  entity_id: light.bedroom_light_group

          # ============================================================
          # Up hold: Sphere light on
          # ============================================================
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_up' }}"
            sequence:
              - choose:
                  # If not full brightness, turn on full
                  - conditions:
                      - condition: template
                        value_template: "{{ state_attr('light.bedroom_light_sphere', 'brightness') | default(0, true) | int(0) != brightness_high }}"
                    sequence:
                      - action: light.turn_on
                        data:
                          brightness: "{{ brightness_high }}"
                          color_temp_kelvin: 2000
                        target:
                          entity_id: light.bedroom_light_sphere
                default:
                  # Toggle to warm ambient brightness
                  - action: light.turn_on
                    data:
                      brightness: "{{ brightness_awake }}"
                      rgb_color: "{{ color_awake }}"
                    target:
                      entity_id: light.bedroom_light_sphere

          # ============================================================
          # Down hold: Sphere light off
          # ============================================================
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_down' }}"
            sequence:
              # Smooth turn off sphere light
              - action: script.light_low_before_off
                data:
                  entity_id: light.bedroom_light_sphere

        default: []
