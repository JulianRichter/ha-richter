automation:
  # ====================================================================
  # Bedroom - Light Switch Right
  # - Controls right bedroom bedside light via wall switch
  # - Single press up when off: Turns on dim/warm ambient light first
  # - Single press up when on: Steps up to full daylight (or toggles back to dim)
  # - Single press down: Smoothly turns off light via light_low_before_off
  # - Hold up: Activates Home scene (presence_home on)
  # - Hold down: Bedtime / Away scene (presence_home off; turns off bedroom lights if on, or all home lights if bedroom already off)
  # ====================================================================

  - id: "bedroom_light_switch_right"
    alias: "Bedroom - Light Switch Right"
    mode: single

    variables:
      brightness_high: "{{ states('input_number.light_brightness_high') | int(255) }}"
      brightness_awake: "{{ states('input_number.light_brightness_awake') | int(126) }}"
      color_awake: >-
        {% set raw = states('input_text.light_color_awake') %}
        {{ raw.split(',') | map('int') | list if (raw not in ['unknown', 'unavailable', '', 'none'] and ',' in raw) else [255, 166, 87] }}

    trigger:
      # Switch action event
      - trigger: state
        entity_id: event.bedroom_light_switch_right_action
        not_from: unavailable
        not_to: unavailable

    condition: []

    action:
      - choose:
          # ============================================================
          # Up: Light on
          # ============================================================
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'on' }}"
            sequence:
              - choose:
                  # If light is currently off: always start with dim/warm ambient first
                  - conditions:
                      - condition: state
                        entity_id: light.bedroom_light_right
                        state: "off"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.bedroom_light_right
                        data:
                          brightness: "{{ brightness_awake }}"
                          rgb_color: "{{ color_awake }}"

                  # If light is already on at full brightness: toggle back to dim/warm ambient
                  - conditions:
                      - condition: template
                        value_template: "{{ state_attr('light.bedroom_light_right', 'brightness') | default(0, true) | int(0) == brightness_high }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: light.bedroom_light_right
                        data:
                          brightness: "{{ brightness_awake }}"
                          rgb_color: "{{ color_awake }}"

                # If light is already on at dim/warm: step up to full brightness
                default:
                  - action: light.turn_on
                    target:
                      entity_id: light.bedroom_light_right
                    data:
                      brightness: "{{ brightness_high }}"
                      color_temp_kelvin: 2700

          # ============================================================
          # Down: Light off
          # ============================================================
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'off' }}"
            sequence:
              # Smooth turn off
              - action: script.light_low_before_off
                data:
                  entity_id: light.bedroom_light_right

          # ============================================================
          # Up hold: Home Scene
          # ============================================================
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_up' }}"
            sequence:
              # Activate home scene
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.presence_home

          # ============================================================
          # Down hold: Bedtime / Away Scene
          # ============================================================
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.event_type == 'brightness_move_down' }}"
            sequence:
              # Activate away / night scene
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.presence_home

              - choose:
                  # If any bedroom light is currently on: turn off all bedroom lights
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ is_state('light.bedroom_light_left', 'on')
                             or is_state('light.bedroom_light_right', 'on')
                             or is_state('light.bedroom_light_sphere', 'on') }}
                    sequence:
                      - action: script.light_low_before_off
                        data:
                          entity_id:
                            - light.bedroom_light_left
                            - light.bedroom_light_right
                            - light.bedroom_light_sphere

                # If all bedroom lights are already off: turn off all lights across the entire home
                default:
                  - action: script.light_low_before_off
                    data:
                      entity_id: light.all_lights_group

                  - action: switch.turn_off
                    target:
                      entity_id: switch.living_room_spot_lights

        default: []
