utility_meter:
  # ====================================================================
  # Fridge Utility Meter
  # ====================================================================

  # Daily power consumption of the fridge
  kitchen_fridge_kwh_daily:
    name: Kühlschrank
    source: sensor.kitchen_fridge_energy
