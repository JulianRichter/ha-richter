script:
  # ====================================================================
  # Light - Sunset
  # - Gradually dims light from 100% to 1% in warm amber tone
  # - Executes light_low_before_off at the end to prevent next-turn-on flash
  # - Aborts automatically if the light is turned off during the animation
  # ====================================================================

  light_sunset:
    alias: "Light - Sunset"
    mode: restart
    icon: mdi:weather-sunset-down

    fields:
      entity_id:
        name: Light
        description: "Light to be dimmed."
        required: true
        selector:
          entity:
            domain: light

      seconds:
        name: Seconds
        description: "Total duration of the sunset in seconds."
        default: 600
        selector:
          number:
            min: 30
            max: 3600
            unit_of_measurement: seconds

    sequence:
      # Initialize step counters and delays
      - variables:
          steps: 100
          step_delay: "{{ (seconds | default(600) / steps) | float(1.0) }}"
          light: "{{ entity_id }}"

      # Start full brightness in warm cozy tone
      - action: light.turn_on
        target:
          entity_id: "{{ light }}"
        data:
          brightness_pct: 100
          rgb_color: [255, 166, 87]

      # Allow bulb to apply initial state
      - delay:
          seconds: 1

      # Progressive dimming step loop (100% down to 1%)
      - repeat:
          count: "{{ steps }}"
          sequence:
            # Stop if light was turned off by user
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ is_state(light, 'off') }}"
                  sequence:
                    - stop: "Sunset stopped because the light was turned off."

            # Decrement brightness percentage
            - action: light.turn_on
              target:
                entity_id: "{{ light }}"
              data:
                brightness_pct: "{{ 100 - repeat.index }}"

            # Delay before next step
            - delay:
                seconds: "{{ step_delay }}"

      # Smooth shut off
      - action: script.light_low_before_off
        data:
          entity_id: "{{ light }}"

