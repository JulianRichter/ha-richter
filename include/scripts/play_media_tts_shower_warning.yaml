script:
  # ====================================================================
  # Play Media - TTS Shower Warning
  # - Plays a natural, intelligent TTS announcement for bathroom shower humidity changes
  # - Notifies when humidity is high (prompting to open window) or stabilized (prompting to close)
  # - Randomly selects from 8 Jarvis-like variations to prevent repetitive phrasing
  # - Announces in German and optionally in Chinese via play_media_tts_message
  # ====================================================================

  play_media_tts_shower_warning:
    alias: "Play Media - TTS Shower Warning"
    mode: queued
    max: 10
    icon: mdi:shower-head

    fields:
      entity_id:
        name: Speaker
        description: "Entity ID of the media player to announce on."
        example: media_player.bathroom
        required: false
        selector:
          entity:
            domain: media_player

      media_player:
        name: Speaker (Alternative)
        description: "Alternative entity ID of the media player to announce on."
        example: media_player.bathroom
        required: false
        selector:
          entity:
            domain: media_player

      status:
        name: Status
        description: "Humidity status: high (open window) or low / converged (close window)."
        example: "high"
        required: true
        selector:
          select:
            options:
              - "high"
              - "low"
              - "converged"

      humidity_sensor:
        name: Humidity Sensor
        description: "Optional entity ID of the bathroom humidity sensor."
        example: sensor.bathroom_multi_sensor_humidity
        required: false
        selector:
          entity:
            domain: sensor
            device_class: humidity

    sequence:
      # Prepare TTS text variables with 8 random variations and humidity formatting
      - variables:
          target_player: "{{ media_player | default(entity_id | default('media_player.bathroom', true), true) }}"
          h_sensor: "{{ humidity_sensor | default('', true) }}"
          has_humidity: "{{ h_sensor != '' and states(h_sensor) not in ['unavailable', 'unknown', ''] }}"
          humidity: "{{ states(h_sensor) | float(0) | round if h_sensor != '' else 0 }}"
          variant: "{{ [1, 2, 3, 4, 5, 6, 7, 8] | random }}"
          is_high: "{{ status in ['high', 'warning', 'too_high'] }}"
          message_de: >-
            {% if is_high %}
              {% if variant == 1 %}
                Die Luftfeuchtigkeit im Bad liegt nach dem Duschen bei {{ humidity }} Prozent. Bitte kurz das Fenster öffnen.
              {% elif variant == 2 %}
                Viel Dampf im Badezimmer: aktuell {{ humidity }} Prozent Feuchtigkeit. Ein kurzes Stoßlüften wäre ratsam.
              {% elif variant == 3 %}
                Die Luft im Bad ist mit {{ humidity }} Prozent gut feucht. Am besten kurz das Fenster aufmachen.
              {% elif variant == 4 %}
                Duschdampf im Badezimmer: {{ humidity }} Prozent Luftfeuchtigkeit. Zeit zum Durchlüften.
              {% elif variant == 5 %}
                Kurzer Hinweis: {{ humidity }} Prozent Feuchtigkeit im Bad. Stoßlüften lässt den Dampf schnell abziehen.
              {% elif variant == 6 %}
                Feuchtigkeit im Bad liegt bei {{ humidity }} Prozent. Bitte einmal kurz durchlüften.
              {% elif variant == 7 %}
                Badezimmer gut bedampft bei {{ humidity }} Prozent. Das Fenster sollte kurz geöffnet werden.
              {% else %}
                Erhöhte Badfeuchte nach dem Duschen mit {{ humidity }} Prozent. Zeit für Frischluft.
              {% endif %}
            {% else %}
              {% if variant == 1 %}
                Der Wasserdampf ist raus, Feuchtigkeit liegt wieder bei {{ humidity }} Prozent. Das Fenster kann wieder zu.
              {% elif variant == 2 %}
                Das Bad ist wieder trocken. Das Fenster kann geschlossen werden.
              {% elif variant == 3 %}
                Feuchtigkeit im Badezimmer hat sich gelegt bei {{ humidity }} Prozent. Fenster kann wieder zugemacht werden.
              {% elif variant == 4 %}
                Ausreichend gelüftet im Bad. Das Fenster kann wieder zu, damit es warm bleibt.
              {% elif variant == 5 %}
                Raumluft im Bad ist wieder im normalen Bereich. Ihr könnt das Fenster schließen.
              {% elif variant == 6 %}
                Der Duschdampf ist abgezogen. Fenster kann verriegelt werden.
              {% elif variant == 7 %}
                Luftfeuchtigkeit im Badezimmer ist wieder optimal bei {{ humidity }} Prozent. Fenster kann zu.
              {% else %}
                Badezimmer ist durchgelüftet. Fenster kann geschlossen werden.
              {% endif %}
            {% endif %}
          message_zh: >-
            {% if is_high %}
              {% if variant == 1 %}
                洗澡后浴室湿度较高{% if has_humidity %}（{{ humidity }}%）{% endif %}，建议开窗通风散散水汽。
              {% elif variant == 2 %}
                浴室水蒸气较多，当前湿度 {{ humidity }}%，顺手开一下窗户通通风吧。
              {% elif variant == 3 %}
                淋浴后浴室湿度达到 {{ humidity }}%，建议开窗透气让湿气散去。
              {% elif variant == 4 %}
                温馨提示：浴室水汽集中（{{ humidity }}%），短时间开窗通风干得更快。
              {% elif variant == 5 %}
                浴室当前湿度 {{ humidity }}%，建议打开窗户换换气。
              {% elif variant == 6 %}
                洗澡后水汽偏重，湿度 {{ humidity }}%，开窗通风几分钟吧。
              {% elif variant == 7 %}
                浴室湿度升至 {{ humidity }}%，建议开窗排湿。
              {% else %}
                提示：浴室湿度 {{ humidity }}%，请开窗通风散气。
              {% endif %}
            {% else %}
              {% if variant == 1 %}
                浴室水汽已散去{% if has_humidity %}，湿度降至 {{ humidity }}%{% endif %}，可以把窗户关上啦。
              {% elif variant == 2 %}
                浴室已经恢复干燥舒适，窗户可以关好了。
              {% elif variant == 3 %}
                淋浴水汽已完全排出，记得顺手把窗户关上。
              {% elif variant == 4 %}
                通风充分，浴室湿度恢复正常，可以关闭窗户保暖了。
              {% elif variant == 5 %}
                浴室空气已恢复干爽，窗户随时可以关上。
              {% elif variant == 6 %}
                水汽已散，浴室环境已稳定，可以关好窗户了。
              {% elif variant == 7 %}
                浴室湿度回到舒适水平（{{ humidity }}%），窗户可以关了。
              {% else %}
                浴室通风完成，窗户可以关闭。
              {% endif %}
            {% endif %}

      # Announce TTS message (German and optional Chinese)
      - action: script.play_media_tts_message
        data:
          entity_id: "{{ target_player }}"
          message: "{{ message_de }}"
          message_chinese: "{{ message_zh }}"
