script:
  # ====================================================================
  # Play Media - TTS Window Closed
  # - Plays a natural, intelligent TTS announcement when a window is closed
  # - Compares humidity against input_number.dashboard_humidity_threshold_medium
  # - Uses adapted smart phrasing if humidity remains elevated vs optimal
  # - Randomly selects from 8 Jarvis-like variations to prevent repetitive phrasing
  # - Announces in German and optionally in Chinese via play_media_tts_message
  # ====================================================================

  play_media_tts_window_closed:
    alias: "Play Media - TTS Window Closed"
    mode: queued
    max: 10
    icon: mdi:window-closed-variant

    fields:
      entity_id:
        name: Speaker
        description: "Entity ID of the media player to announce on."
        example: media_player.bedroom
        required: false
        selector:
          entity:
            domain: media_player

      media_player:
        name: Speaker (Alternative)
        description: "Alternative entity ID of the media player to announce on."
        example: media_player.bedroom
        required: false
        selector:
          entity:
            domain: media_player

      humidity_sensor:
        name: Humidity Sensor
        description: "Entity ID of the humidity sensor to report."
        example: sensor.bedroom_multi_sensor_humidity
        required: false
        selector:
          entity:
            domain: sensor
            device_class: humidity

    sequence:
      # Prepare TTS text variables with 8 random variations, threshold comparison, and formatting
      - variables:
          target_player: "{{ media_player | default(entity_id, true) }}"
          h_sensor: "{{ humidity_sensor | default('', true) }}"
          has_humidity: "{{ h_sensor != '' and states(h_sensor) not in ['unavailable', 'unknown', ''] }}"
          humidity: "{{ states(h_sensor) | float(0) | round if h_sensor != '' else 0 }}"
          threshold: "{{ states('input_number.dashboard_humidity_threshold_medium') | float(60) | round }}"
          is_high: "{{ has_humidity and humidity > threshold }}"
          variant: "{{ [1, 2, 3, 4, 5, 6, 7, 8] | random }}"
          message_de: >-
            {% if has_humidity %}
              {% if is_high %}
                {% if variant == 1 %}
                  Fenster geschlossen. Feuchtigkeit liegt noch bei {{ humidity }} Prozent, ich heize wieder an.
                {% elif variant == 2 %}
                  Fenster ist wieder zu. Thermostat übernimmt, Feuchte liegt bei {{ humidity }} Prozent.
                {% elif variant == 3 %}
                  Alles verriegelt. Heizkörper schalten sich wieder ein, Feuchte noch bei {{ humidity }} Prozent.
                {% elif variant == 4 %}
                  Fenster zu. Raumfeuchte ist noch bei {{ humidity }} Prozent, Heizung läuft wieder an.
                {% elif variant == 5 %}
                  Wieder dicht. Solltemperatur wird wiederhergestellt, Feuchtigkeit beträgt {{ humidity }} Prozent.
                {% elif variant == 6 %}
                  Fenster geschlossen, Heizung reaktiviert bei {{ humidity }} Prozent Feuchtigkeit.
                {% elif variant == 7 %}
                  Lüften beendet. Thermostat heizt wieder auf, Restfeuchte liegt bei {{ humidity }} Prozent.
                {% else %}
                  Fenster ist zu, Heizbetrieb fortgesetzt. Feuchtigkeit liegt bei {{ humidity }} Prozent.
                {% endif %}
              {% else %}
                {% if variant == 1 %}
                  Fenster geschlossen. Luftfeuchtigkeit liegt bei {{ humidity }} Prozent, Heizung läuft wieder an.
                {% elif variant == 2 %}
                  Fenster ist wieder zu. Thermostat übernimmt bei optimalen {{ humidity }} Prozent Feuchtigkeit.
                {% elif variant == 3 %}
                  Alles verriegelt. Heizkörper schalten sich bei {{ humidity }} Prozent Feuchte wieder ein.
                {% elif variant == 4 %}
                  Durchgelüftet. Die Heizung heizt bei {{ humidity }} Prozent Raumfeuchte wieder an.
                {% elif variant == 5 %}
                  Fenster zu. Ich stelle die Raumtemperatur wieder her, Feuchte liegt bei {{ humidity }} Prozent.
                {% elif variant == 6 %}
                  Wieder dicht. Heizung läuft bei optimalen {{ humidity }} Prozent Feuchtigkeit weiter.
                {% elif variant == 7 %}
                  Lüften beendet, Thermostat ist wieder aktiv. Feuchtigkeit liegt bei {{ humidity }} Prozent.
                {% else %}
                  Fenster geschlossen, Heizbetrieb fortgesetzt. Raumfeuchte bei {{ humidity }} Prozent.
                {% endif %}
              {% endif %}
            {% else %}
              {% if variant == 1 %}
                Fenster geschlossen, Heizung läuft wieder an.
              {% elif variant == 2 %}
                Fenster ist wieder zu. Thermostat übernimmt wieder.
              {% elif variant == 3 %}
                Alles verriegelt. Heizkörper schalten sich wieder ein.
              {% elif variant == 4 %}
                Durchgelüftet. Die Heizung heizt wieder an.
              {% elif variant == 5 %}
                Fenster zu. Ich stelle die Raumtemperatur wieder her.
              {% elif variant == 6 %}
                Wieder dicht. Heizung ist wieder aktiv.
              {% elif variant == 7 %}
                Lüften beendet, Thermostat regelt wieder.
              {% else %}
                Fenster geschlossen, Heizbetrieb fortgesetzt.
              {% endif %}
            {% endif %}
          message_zh: >-
            {% if has_humidity %}
              {% if is_high %}
                {% if variant == 1 %}
                  窗户已关好。湿度还在 {{ humidity }}%，已恢复暖气。
                {% elif variant == 2 %}
                  通风结束，窗户已关。正在重新加热，湿度 {{ humidity }}%。
                {% elif variant == 3 %}
                  窗户已闭合，温控已重新启动。当前湿度 {{ humidity }}%。
                {% elif variant == 4 %}
                  已关窗，暖气恢复运行。当前湿度 {{ humidity }}%。
                {% elif variant == 5 %}
                  窗户已关好，温控开始恢复室温。当前湿度 {{ humidity }}%。
                {% elif variant == 6 %}
                  通风完成，暖气重新开启。室内湿度 {{ humidity }}%。
                {% elif variant == 7 %}
                  窗户闭合，温控已接管。剩余湿度 {{ humidity }}%。
                {% else %}
                  已关窗，暖气已重新启动。室内湿度 {{ humidity }}%。
                {% endif %}
              {% else %}
                {% if variant == 1 %}
                  窗户已关好。当前湿度 {{ humidity }}%，暖气重新启动。
                {% elif variant == 2 %}
                  通风完成，窗户已关。湿度处于良好的 {{ humidity }}%，温控恢复正常。
                {% elif variant == 3 %}
                  窗户已闭合，当前湿度 {{ humidity }}%，暖气已重新开启。
                {% elif variant == 4 %}
                  通风结束，已关窗。室内湿度 {{ humidity }}%，正在恢复室温。
                {% elif variant == 5 %}
                  窗户已关好，湿度 {{ humidity }}%，温控接管运行。
                {% elif variant == 6 %}
                  已关窗，湿度处于舒适的 {{ humidity }}%，暖气继续运行。
                {% elif variant == 7 %}
                  通风完成，温控重新启动。当前湿度 {{ humidity }}%。
                {% else %}
                  已关窗，暖气恢复。室内湿度维持在 {{ humidity }}%。
                {% endif %}
              {% endif %}
            {% else %}
              {% if variant == 1 %}
                窗户已关好，暖气重新启动。
              {% elif variant == 2 %}
                通风完成，窗户已关，温控恢复正常。
              {% elif variant == 3 %}
                窗户已闭合，暖气已重新开启。
              {% elif variant == 4 %}
                通风结束，正在恢复室温。
              {% elif variant == 5 %}
                窗户已关好，温控接管运行。
              {% elif variant == 6 %}
                已关窗，暖气重新开启。
              {% elif variant == 7 %}
                通风完成，温控重新启动。
              {% else %}
                已关窗，暖气恢复。
              {% endif %}
            {% endif %}

      # Announce TTS message (German and optional Chinese)
      - action: script.play_media_tts_message
        data:
          entity_id: "{{ target_player }}"
          message: "{{ message_de }}"
          message_chinese: "{{ message_zh }}"
