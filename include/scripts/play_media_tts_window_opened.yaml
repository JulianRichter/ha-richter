script:
  # ====================================================================
  # Play Media - TTS Window Opened
  # - Plays a natural, intelligent TTS announcement when a window is opened
  # - Compares humidity against input_number.dashboard_humidity_threshold_medium
  # - Uses adapted smart phrasing depending on whether humidity is elevated or normal
  # - Randomly selects from 8 Jarvis-like variations to prevent repetitive phrasing
  # - Announces in German and optionally in Chinese via play_media_tts_message
  # ====================================================================

  play_media_tts_window_opened:
    alias: "Play Media - TTS Window Opened"
    mode: queued
    max: 10
    icon: mdi:window-open-variant

    fields:
      entity_id:
        name: Speaker
        description: "Entity ID of the media player to announce on."
        example: media_player.bedroom
        required: false
        selector:
          entity:
            domain: media_player

      media_player:
        name: Speaker (Alternative)
        description: "Alternative entity ID of the media player to announce on."
        example: media_player.bedroom
        required: false
        selector:
          entity:
            domain: media_player

      humidity_sensor:
        name: Humidity Sensor
        description: "Entity ID of the humidity sensor to report."
        example: sensor.bedroom_multi_sensor_humidity
        required: false
        selector:
          entity:
            domain: sensor
            device_class: humidity

    sequence:
      # Prepare TTS text variables with 8 random variations, threshold comparison, and formatting
      - variables:
          target_player: "{{ media_player | default(entity_id, true) }}"
          h_sensor: "{{ humidity_sensor | default('', true) }}"
          has_humidity: "{{ h_sensor != '' and states(h_sensor) not in ['unavailable', 'unknown', ''] }}"
          humidity: "{{ states(h_sensor) | float(0) | round if h_sensor != '' else 0 }}"
          threshold: "{{ states('input_number.dashboard_humidity_threshold_medium') | float(60) | round }}"
          is_high: "{{ has_humidity and humidity > threshold }}"
          variant: "{{ [1, 2, 3, 4, 5, 6, 7, 8] | random }}"
          message_de: >-
            {% if has_humidity %}
              {% if is_high %}
                {% if variant == 1 %}
                  Fenster geöffnet. Bei {{ humidity }} Prozent Luftfeuchtigkeit ist Lüften ideal, Heizung pausiert.
                {% elif variant == 2 %}
                  Frischluft zieht ein. Ich habe die Heizung abgedreht, Feuchtigkeit liegt bei {{ humidity }} Prozent.
                {% elif variant == 3 %}
                  Stoßlüften registriert. Heizkörper sind aus, Raumfeuchte liegt bei {{ humidity }} Prozent.
                {% elif variant == 4 %}
                  Thermostat pausiert. Bei {{ humidity }} Prozent Feuchtigkeit tut der Luftaustausch gut.
                {% elif variant == 5 %}
                  Fenster ist offen. Die Heizung ist abgeschaltet, Feuchtigkeit beträgt {{ humidity }} Prozent.
                {% elif variant == 6 %}
                  Lüftung läuft. Ich halte die Heizung an, aktuelle Luftfeuchtigkeit {{ humidity }} Prozent.
                {% elif variant == 7 %}
                  Alles klar, Heizung pausiert bei {{ humidity }} Prozent Luftfeuchtigkeit.
                {% else %}
                  Fenster offen, Heizkörper aus. Die Raumfeuchte liegt bei {{ humidity }} Prozent.
                {% endif %}
              {% else %}
                {% if variant == 1 %}
                  Fenster geöffnet. Heizung pausiert bei {{ humidity }} Prozent Luftfeuchtigkeit.
                {% elif variant == 2 %}
                  Frischluft zieht ein. Thermostat ist vorübergehend aus.
                {% elif variant == 3 %}
                  Fenster ist offen. Heizung pausiert bei {{ humidity }} Prozent Raumfeuchte.
                {% elif variant == 4 %}
                  Thermostat abgeschaltet, während das Fenster offen steht.
                {% elif variant == 5 %}
                  Alles klar, Heizkörper sind für die Lüftung abgedreht.
                {% elif variant == 6 %}
                  Lüftung registriert. Heizung ist pausiert, Feuchtigkeit bei {{ humidity }} Prozent.
                {% elif variant == 7 %}
                  Fenster auf, Heizung pausiert.
                {% else %}
                  Stoßlüften aktiv, Thermostate pausieren.
                {% endif %}
              {% endif %}
            {% else %}
              {% if variant == 1 %}
                Fenster geöffnet. Heizung pausiert.
              {% elif variant == 2 %}
                Frischluft zieht ein. Thermostat ist vorübergehend aus.
              {% elif variant == 3 %}
                Fenster ist offen. Heizkörper pausieren automatisch.
              {% elif variant == 4 %}
                Thermostat abgeschaltet, während gelüftet wird.
              {% elif variant == 5 %}
                Alles klar, ich drehe die Heizung kurz ab.
              {% elif variant == 6 %}
                Lüftung registriert, Heizung pausiert.
              {% elif variant == 7 %}
                Fenster auf, Heizung ist aus.
              {% else %}
                Stoßlüften aktiv, Thermostate pausieren.
              {% endif %}
            {% endif %}
          message_zh: >-
            {% if has_humidity %}
              {% if is_high %}
                {% if variant == 1 %}
                  窗户已开，暖气暂停。当前湿度 {{ humidity }}%，正好透透气。
                {% elif variant == 2 %}
                  正在开窗通风，暖气已关。室内湿度 {{ humidity }}%。
                {% elif variant == 3 %}
                  检测到开窗，已暂停加热。当前湿度 {{ humidity }}%。
                {% elif variant == 4 %}
                  通风中，温控已关闭。湿度为 {{ humidity }}%。
                {% elif variant == 5 %}
                  窗户打开，暖气已调低。当前室内湿度 {{ humidity }}%。
                {% elif variant == 6 %}
                  换气模式，暖气暂时停止。湿度 {{ humidity }}%。
                {% elif variant == 7 %}
                  收到，通风期间已暂停暖气。当前湿度 {{ humidity }}%。
                {% else %}
                  已开窗通风，暖气已关，湿度 {{ humidity }}%。
                {% endif %}
              {% else %}
                {% if variant == 1 %}
                  窗户已打开，暖气暂停。当前湿度 {{ humidity }}%。
                {% elif variant == 2 %}
                  正在通风，暖气已为您关闭。
                {% elif variant == 3 %}
                  窗户开启，温控已自动暂停。
                {% elif variant == 4 %}
                  通风中，暖气暂时关闭。湿度 {{ humidity }}%。
                {% elif variant == 5 %}
                  收到，开窗期间暖气已停。
                {% elif variant == 6 %}
                  检测到开窗，暖气已暂停。
                {% elif variant == 7 %}
                  窗户已开，温控关闭。
                {% else %}
                  通风模式，暖气暂停。
                {% endif %}
              {% endif %}
            {% else %}
              {% if variant == 1 %}
                窗户已打开，暖气暂停。
              {% elif variant == 2 %}
                正在通风，暖气已为您关闭。
              {% elif variant == 3 %}
                窗户开启，温控已自动暂停。
              {% elif variant == 4 %}
                通风中，暖气暂时关闭。
              {% elif variant == 5 %}
                收到，开窗期间暖气已停。
              {% elif variant == 6 %}
                检测到开窗，暖气已暂停。
              {% elif variant == 7 %}
                窗户已开，温控关闭。
              {% else %}
                通风模式，暖气暂停。
              {% endif %}
            {% endif %}

      # Announce TTS message (German and optional Chinese)
      - action: script.play_media_tts_message
        data:
          entity_id: "{{ target_player }}"
          message: "{{ message_de }}"
          message_chinese: "{{ message_zh }}"
