script:
  # ====================================================================
  # Play Media - TTS Humidity Warning
  # - Plays a natural, intelligent TTS announcement for room humidity changes
  # - Notifies when humidity is high (prompting to open window) or stabilized (prompting to close)
  # - Randomly selects from 8 Jarvis-like variations to prevent repetitive phrasing
  # - Announces in German and optionally in Chinese via play_media_tts_message
  # ====================================================================

  play_media_tts_humidity_warning:
    alias: "Play Media - TTS Humidity Warning"
    mode: queued
    max: 10
    icon: mdi:water-alert-outline

    fields:
      entity_id:
        name: Speaker
        description: "Entity ID of the media player to announce on."
        example: media_player.living_room
        required: false
        selector:
          entity:
            domain: media_player

      media_player:
        name: Speaker (Alternative)
        description: "Alternative entity ID of the media player to announce on."
        example: media_player.living_room
        required: false
        selector:
          entity:
            domain: media_player

      room:
        name: Room
        description: "Room identifier (e.g., bedroom, living_room, kitchen, baby_room, bathroom)."
        example: "bedroom"
        required: true
        selector:
          select:
            options:
              - "bedroom"
              - "living_room"
              - "kitchen"
              - "baby_room"
              - "bathroom"

      status:
        name: Status
        description: "Humidity status: high or converged (stabilized)."
        example: "high"
        required: true
        selector:
          select:
            options:
              - "high"
              - "converged"

      humidity_sensor:
        name: Humidity Sensor
        description: "Optional entity ID of the room's humidity sensor."
        example: sensor.bedroom_multi_sensor_humidity
        required: false
        selector:
          entity:
            domain: sensor
            device_class: humidity

    sequence:
      # Prepare TTS text variables with 8 random variations, room names, and humidity
      - variables:
          target_player: "{{ media_player | default(entity_id, true) }}"
          h_sensor: "{{ humidity_sensor | default('', true) }}"
          has_humidity: "{{ h_sensor != '' and states(h_sensor) not in ['unavailable', 'unknown', ''] }}"
          humidity: "{{ states(h_sensor) | float(0) | round if h_sensor != '' else 0 }}"
          variant: "{{ [1, 2, 3, 4, 5, 6, 7, 8] | random }}"
          is_high: "{{ status in ['high', 'warning', 'too_high'] }}"
          room_de_map:
            bedroom: "im Schlafzimmer"
            living_room: "im Wohnzimmer"
            kitchen: "in der Küche"
            baby_room: "im Kinderzimmer"
            bathroom: "im Badezimmer"
          room_zh_map:
            bedroom: "卧室"
            living_room: "客厅"
            kitchen: "厨房"
            baby_room: "儿童房"
            bathroom: "浴室"
          r_key: "{{ room | default('living_room') }}"
          room_de: "{{ room_de_map.get(r_key, r_key) }}"
          room_zh: "{{ room_zh_map.get(r_key, r_key) }}"
          message_de: >-
            {% if is_high %}
              {% if variant == 1 %}
                Kurzer Hinweis: Die Luftfeuchtigkeit {{ room_de }} liegt bei {{ humidity }} Prozent. Ein kurzes Stoßlüften wäre ratsam.
              {% elif variant == 2 %}
                Die Luft {{ room_de }} ist mit {{ humidity }} Prozent etwas feucht. Zeit für ein paar Minuten Frischluft.
              {% elif variant == 3 %}
                Erhöhte Feuchtigkeit {{ room_de }}: aktuell {{ humidity }} Prozent. Bitte kurz das Fenster öffnen.
              {% elif variant == 4 %}
                {{ humidity }} Prozent Luftfeuchtigkeit {{ room_de }}. Ein kurzes Durchlüften würde guttun.
              {% elif variant == 5 %}
                Hinweis zum Raumklima: {{ room_de | capitalize }} sind es {{ humidity }} Prozent Feuchte. Stoßlüften empfohlen.
              {% elif variant == 6 %}
                Die Feuchtigkeit {{ room_de }} ist auf {{ humidity }} Prozent gestiegen. Ein kurzes Öffnen des Fensters hilft.
              {% elif variant == 7 %}
                Kurzer Check: {{ humidity }} Prozent Luftfeuchtigkeit {{ room_de }}. Zeit für frische Luft.
              {% else %}
                Feuchtigkeitsanstieg {{ room_de }} auf {{ humidity }} Prozent. Kurzes Lüften wäre jetzt ideal.
              {% endif %}
            {% else %}
              {% if variant == 1 %}
                Die Luftfeuchtigkeit {{ room_de }} ist wieder normal{% if has_humidity %} bei {{ humidity }} Prozent{% endif %}. Das Fenster kann wieder geschlossen werden.
              {% elif variant == 2 %}
                Raumklima {{ room_de }} hat sich stabilisiert. Ihr könnt das Fenster wieder zumachen.
              {% elif variant == 3 %}
                Ausreichend gelüftet {{ room_de }}. Das Fenster kann wieder zu.
              {% elif variant == 4 %}
                Feuchtigkeit {{ room_de }} ist wieder im grünen Bereich{% if has_humidity %} mit {{ humidity }} Prozent{% endif %}. Fenster kann verriegelt werden.
              {% elif variant == 5 %}
                Genug frische Luft {{ room_de }}. Das Fenster kann geschlossen werden.
              {% elif variant == 6 %}
                Die Luftfeuchtigkeit {{ room_de }} hat sich eingepegelt. Fenster kann wieder zu.
              {% elif variant == 7 %}
                Luftaustausch {{ room_de }} abgeschlossen. Ihr könnt das Fenster wieder schließen.
              {% else %}
                Werte {{ room_de }} sind wieder optimal. Das Fenster kann wieder zugemacht werden.
              {% endif %}
            {% endif %}
          message_zh: >-
            {% if is_high %}
              {% if variant == 1 %}
                提示：{{ room_zh }}湿度偏高{% if has_humidity %}，达到 {{ humidity }}%{% endif %}，建议开窗通风一会儿。
              {% elif variant == 2 %}
                {{ room_zh }}的空气湿度有点高{% if has_humidity %}，现在是 {{ humidity }}%{% endif %}，开窗换换新鲜空气吧。
              {% elif variant == 3 %}
                室内湿度提示：{{ room_zh }}当前 {{ humidity }}%，建议短时间开窗透气。
              {% elif variant == 4 %}
                {{ room_zh }}湿度达到 {{ humidity }}%，适合开窗通风几分钟。
              {% elif variant == 5 %}
                环境提醒：{{ room_zh }}湿度偏高，可以开一下窗户保持空气干爽。
              {% elif variant == 6 %}
                {{ room_zh }}当前湿度 {{ humidity }}%，建议稍微开窗通风。
              {% elif variant == 7 %}
                空气质量提醒：{{ room_zh }}湿度上升至 {{ humidity }}%，适时开窗通风。
              {% else %}
                {{ room_zh }}湿度较高（{{ humidity }}%），建议开窗通风透气。
              {% endif %}
            {% else %}
              {% if variant == 1 %}
                {{ room_zh }}的湿度已恢复正常{% if has_humidity %}，现在是 {{ humidity }}%{% endif %}，可以把窗户关上啦。
              {% elif variant == 2 %}
                {{ room_zh }}通风已充分，环境已稳定，可以关好窗户了。
              {% elif variant == 3 %}
                空气已充分置换，{{ room_zh }}的窗户可以关上了。
              {% elif variant == 4 %}
                {{ room_zh }}湿度回到舒适区间，记得顺手关好窗户。
              {% elif variant == 5 %}
                {{ room_zh }}换气完成，可以把窗户关起来保暖了。
              {% elif variant == 6 %}
                环境指标正常，{{ room_zh }}的窗户随时可以关闭。
              {% elif variant == 7 %}
                {{ room_zh }}湿度已稳定，可以关闭窗户了。
              {% else %}
                通风充分，{{ room_zh }}窗户可以关上了。
              {% endif %}
            {% endif %}

      # Announce TTS message (German and optional Chinese)
      - action: script.play_media_tts_message
        data:
          entity_id: "{{ target_player }}"
          message: "{{ message_de }}"
          message_chinese: "{{ message_zh }}"
