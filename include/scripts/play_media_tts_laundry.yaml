script:
  # ====================================================================
  # Play Media - TTS Laundry
  # - Plays a natural, intelligent TTS announcement when washing machine finishes
  # - Randomly selects from 8 Jarvis-like variations to prevent repetitive phrasing
  # - Announces in German and optionally in Chinese via play_media_tts_message
  # ====================================================================

  play_media_tts_laundry:
    alias: "Play Media - TTS Laundry"
    mode: queued
    max: 5
    icon: mdi:washing-machine

    fields:
      entity_id:
        name: Speaker
        description: "Entity ID of the media player to announce on (default: media_player.minis)."
        example: media_player.minis
        required: false
        selector:
          entity:
            domain: media_player

      media_player:
        name: Speaker (Alternative)
        description: "Alternative entity ID of the media player to announce on."
        example: media_player.minis
        required: false
        selector:
          entity:
            domain: media_player

      volume_level:
        name: Volume Level
        description: "Optional volume level (0.0 to 1.0) to override default announcement volume."
        example: 0.4
        required: false
        selector:
          number:
            min: 0.0
            max: 1.0
            step: 0.05
            mode: slider

    sequence:
      # Prepare TTS text variables with 8 random variations
      - variables:
          target_player: "{{ media_player | default(entity_id | default('media_player.minis', true), true) }}"
          variant: "{{ [1, 2, 3, 4, 5, 6, 7, 8] | random }}"
          message_de: >-
            {% if variant == 1 %}
              Die Waschmaschine ist fertig. Die Wäsche kann aufgehängt werden.
            {% elif variant == 2 %}
              Kurzer Hinweis: Der Waschgang ist beendet.
            {% elif variant == 3 %}
              Die Wäsche ist fertig gewaschen und bereit zum Aufhängen.
            {% elif variant == 4 %}
              Waschprogramm abgeschlossen, die Wäsche ist fertig.
            {% elif variant == 5 %}
              Kurzes Update aus dem Bad: Der Waschgang ist abgeschlossen.
            {% elif variant == 6 %}
              Die Waschmaschine hat fertig geschleudert. Die Wäsche ist entnahmebereit.
            {% elif variant == 7 %}
              Waschgang beendet, alles wieder frisch gewaschen.
            {% else %}
              Die Waschmaschine hat ihr Programm beendet.
            {% endif %}
          message_zh: >-
            {% if variant == 1 %}
              洗衣机已完成运转，可以晾晒衣物。
            {% elif variant == 2 %}
              洗衣程序已结束，衣物清洗完毕。
            {% elif variant == 3 %}
              浴室通知：洗衣机已洗好，随时可以晾晒。
            {% elif variant == 4 %}
              洗衣完成，衣物已甩干，可以取出晾晒。
            {% elif variant == 5 %}
              洗衣机运转结束，衣物洁净清新。
            {% elif variant == 6 %}
              浴室更新：洗衣机已停机，可以取出衣物。
            {% elif variant == 7 %}
              洗涤程序结束，甩干已完成。
            {% else %}
              洗衣机程序结束，衣物准备就绪。
            {% endif %}

      # Announce TTS message (German and optional Chinese)
      - action: script.play_media_tts_message
        data:
          entity_id: "{{ target_player }}"
          message: "{{ message_de }}"
          message_chinese: "{{ message_zh }}"
          volume_level: "{{ volume_level if volume_level is defined else none }}"
