template:
  # ====================================================================
  # Presence - Away Switch Template
  # - Interactive Away entity that is the exact inverse of presence_home
  # - State is on when presence_home is off (sleeping or away)
  # - Used in Bubble Card dashboard to toggle presence cleanly
  # ====================================================================

  - switch:
      - name: "Presence Away"
        unique_id: presence_away
        icon: mdi:sleep
        state: "{{ is_state('input_boolean.presence_home', 'off') }}"
        turn_on:
          action: input_boolean.turn_off
          target:
            entity_id: input_boolean.presence_home
        turn_off:
          action: input_boolean.turn_on
          target:
            entity_id: input_boolean.presence_home

  # ====================================================================
  # Presence - Resident Wi-Fi Device Trackers
  # - Instant stationary presence detection based on home Wi-Fi SSID
  # - Added to person.julian and person.xingyang in Home Assistant UI
  # - Fast arrival trigger when entering home network range
  # ====================================================================

  - device_tracker:
      - name: "Julian WiFi"
        unique_id: julian_wifi
        icon: mdi:wifi-check
        in_zones: >-
          {{ ['zone.home'] if 'Nudelauflauf' in (states('sensor.julian_wifi_connection') | string) else [] }}

      - name: "Xingyang WiFi"
        unique_id: xingyang_wifi
        icon: mdi:wifi-check
        in_zones: >-
          {{ ['zone.home'] if 'Nudelauflauf' in (states('sensor.xingyang_ssid') | string) else [] }}

