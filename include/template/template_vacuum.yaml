template:
  #######################################################
  # Vacuum
  #######################################################

  # change icon depending on input_boolean.vacuum_mopping_enabled state
  - binary_sensor:
      - unique_id: vacuum_mopping_enabled
        state: >
          {% if is_state('input_boolean.vacuum_mopping_enabled', 'on') %}
            on
          {% else %}
            off
          {% endif %}
        attributes:
          friendly_name: Vacuum - Mopping Enabled
          icon: >
            {% if is_state('input_boolean.vacuum_mopping_enabled', 'on') %}
              mdi:water
            {% else %}
              mdi:water-off
            {% endif %}

  # Time since last cleaning to show in dashboard.
  - sensor:
      - unique_id: vacuum_idle_time
        state: >
          {% set last_ts = as_timestamp(states('sensor.vacuum_last_end_time'), default=none) %}
          {% if last_ts is none %}
            Unbekannt
          {% else %}
            {% set seconds = ( as_timestamp(now()) - last_ts ) | int %}
            {% set minutes = ( seconds / 60 ) | int %}
            {% set hours   = ( minutes / 60 ) | int %}
            {% set days    = ( hours   / 60 ) | int %}

            {% if   days     > 1 %}
              Vor {{ days }} Tagen
            {% elif days    == 1 %}
              Vor {{ days }} Tag
            {% elif hours    > 1 %}
              Vor {{ hours }} Stunden
            {% elif hours   == 1 %}
              Vor {{ hours }} Stunde
            {% elif minutes  > 1 %}
              Vor {{ minutes }} Minuten
            {% elif minutes == 1 %}
              Vor {{ minutes }} Minute
            {% elif seconds  > 1 %}
              Vor {{ seconds }} Sekunden
            {% elif seconds == 1 %}
              Vor {{ seconds }} Sekunde
            {% else %}
              Vor kurzer Zeit
            {% endif %}
          {% endif %}
        attributes:
          friendly_name: Vacuum - Idle Time
          icon: mdi:calendar-clock

  # Select vacuum fan speed from dashboard.
  - select:
      - unique_id: vacuum_fan_speed
        name: vacuum_fan_speed
        state: >
          {% set fan_speed = state_attr('vacuum.robi', 'fan_speed') %}
          {{ iif(fan_speed == None, 'Silent', fan_speed) }}
        options: >
          {% set fan_speed_list = state_attr('vacuum.robi', 'fan_speed_list') %}
          {{ iif(fan_speed_list == None, ['Silent'], fan_speed_list) }}
        select_option:
          action: vacuum.set_fan_speed
          target:
            entity_id: vacuum.robi
          data:
            fan_speed: >
              {{ option }}

  # Select vacuum water level from dashboard.
  - select:
      - unique_id: vacuum_water_level
        name: vacuum_water_level
        state: >
          {% set water_level = state_attr('vacuum.robi', 'water_level') %}
          {{ iif(water_level == None, 'High', water_level) }}
        options: >
          {% set water_level_list = state_attr('vacuum.robi', 'water_level_list') %}
          {{ iif(water_level_list == None, ['high'], water_level_list) }}
        select_option:
          action: xiaomi_vacuum.vacuum_set_water_level
          target:
            entity_id: vacuum.robi
          data:
            water_level: >
              {{ option }}
