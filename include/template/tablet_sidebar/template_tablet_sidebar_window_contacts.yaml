template:
  # ====================================================================
  # Tablet Sidebar - Window Contacts
  # - Displays open windows with duration, current humidity, and venting trend
  # - Replaces legacy arrow with clean typography and dynamic climate feedback
  # ====================================================================

  # Window contacts status display for tablet dashboard sidebar
  - binary_sensor:
      - unique_id: tablet_sidebar_window_contacts
        variables:
          entities:
            - binary_sensor.kitchen_window_contact
            - binary_sensor.living_room_window_contact
            - binary_sensor.bedroom_window_contact
            - binary_sensor.baby_room_window_contact
          derivatives:
            - sensor.kitchen_humidity_change
            - sensor.living_room_humidity_change
            - sensor.bedroom_humidity_change
            - sensor.baby_room_humidity_change
          humidities:
            - sensor.kitchen_multi_sensor_humidity
            - sensor.living_room_multi_sensor_humidity
            - sensor.bedroom_multi_sensor_humidity
            - sensor.baby_room_multi_sensor_humidity
        state: >
          {{ 'on' if entities | select('is_state', 'on') | list | count > 0 else 'off' }}
        attributes:
          count: >
            {{ entities | select('is_state', 'on') | list | count }}
          sidebar_html_text: >-
            {%- set open_windows = entities | select('is_state', 'on') | list -%}
            {%- if open_windows | count > 0 -%}
            <p><span style="display: block; font-weight: 500; color: #94a3b8; margin: 12px 0 4px 0;">Fenster offen:</span>
            {%- for sensor in open_windows -%}
              {%- set idx = entities.index(sensor) -%}
              {%- set deriv = states(derivatives[idx]) | float(0) -%}
              {%- set time_now = as_timestamp(now()) -%}
              {%- set time_changed = as_timestamp(states[sensor].last_updated) -%}
              {%- set diff = time_now - time_changed -%}
              {%- set m = (diff / 60) | int -%}
              {%- set s = (diff % 60) | int -%}
              {%- if m < 60 -%}
                {%- set time_str = '{:02}:{:02} min'.format(m, s) -%}
              {%- else -%}
                {%- set h = (m / 60) | int -%}
                {%- set rm = (m - 60 * h) | int -%}
                {%- set time_str = '{:02}:{:02} h'.format(h, rm) -%}
              {%- endif -%}
              {%- set raw_name = state_attr(sensor, 'friendly_name') | replace(' (F)', '') -%}
              {%- set name = raw_name
                | replace('Schlafzimmer', 'Schlafz.')
                | replace('Badezimmer', 'Bad')
                | replace('Kinderzimmer', 'Kinderz.')
                | replace('Wohnzimmer', 'Wohnz.')
              -%}
              {%- set smiley = '' -%}
              {%- set smiley_title = '' -%}
              {%- if m >= 25 -%}
                {%- set time_html = '<span style="color: #ffa726;">' ~ time_str ~ '</span>' -%}
              {%- elif deriv <= -0.2 -%}
                {%- set time_html = time_str -%}
                {%- set smiley = '🌬️' -%}
                {%- set smiley_title = 'Lüftet aktiv (Feuchte sinkt)' -%}
              {%- elif deriv >= 0.2 -%}
                {%- set time_html = time_str -%}
                {%- set smiley = '🌧️' -%}
                {%- set smiley_title = 'Feuchte steigt' -%}
              {%- else -%}
                {%- set time_html = time_str -%}
              {%- endif -%}
              {%- set icon_html = ('&nbsp;<span style="font-size: 14px; vertical-align: -1px;" title="' ~ smiley_title ~ '">' ~ smiley ~ '</span>') if smiley else '' -%}
              <span style="display: block; line-height: 22px;">- {{ name }} <span style="font-variant-numeric: tabular-nums; opacity: 0.75; font-size: 13px; margin-left: 4px;">· {{ time_html }}{{ icon_html }}</span></span>
            {%- endfor -%}
            </p>
            {%- endif -%}
