template:
  # ====================================================================
  # Tablet Sidebar - Sensors Offline
  # ====================================================================

  # Monitor offline sensors for tablet dashboard sidebar
  - binary_sensor:
      - unique_id: tablet_sidebar_sensors_offline
        variables:
          entities:
            - binary_sensor.kitchen_window_contact
            - binary_sensor.living_room_window_contact
            - binary_sensor.bedroom_window_contact
            - binary_sensor.baby_room_window_contact
            - sensor.kitchen_multi_sensor_temperature
            - sensor.living_room_multi_sensor_temperature
            - sensor.bedroom_multi_sensor_temperature
            - sensor.baby_room_multi_sensor_temperature
            - sensor.bathroom_multi_sensor_temperature
            - sensor.garden_multi_sensor_temperature
            - binary_sensor.kitchen_motion_sensor_occupancy
            - binary_sensor.living_room_motion_sensor_occupancy
            - binary_sensor.bedroom_motion_sensor_left_occupancy
            - binary_sensor.bedroom_motion_sensor_right_occupancy
            - binary_sensor.baby_room_motion_sensor_occupancy
            - binary_sensor.bathroom_motion_sensor_occupancy
            - binary_sensor.bathroom_shower_motion_sensor_occupancy
        state: >
          {{ 'on' if entities | select('is_state', 'unavailable') | list | count > 0 else 'off' }}
        attributes:
          count: >-
            {{ entities | select('is_state', 'unavailable') | list | count }}
          sidebar_html_text: >-
            {%- set offline = entities | select('is_state', 'unavailable') | list -%}

            {# Only show block if at least one sensor is offline #}
            {%- if offline | count > 0 -%}
            <p><span style="display: block; font-weight: 500; color: #94a3b8; margin: 12px 0 4px 0;">Sensor offline:</span>
            {%- for sensor in offline -%}

              {# Compute time since last update #}
              {%- set time_now     = as_timestamp(now()) -%}
              {%- set time_changed = as_timestamp(states[sensor].last_updated) -%}
              {%- set time_diff    = time_now - time_changed -%}
              {%- set m            = (time_diff / 60) | int -%}

              {%- if m < 60 -%}
                {%- set time_str = '{:02} min'.format(m) -%}
              {%- elif m < 1440 -%}
                {%- set time_hour = (m / 60) | int -%}
                {%- set time_rem  = (m - 60 * time_hour) | int -%}
                {%- set time_str  = '{:02}:{:02} h'.format(time_hour, time_rem) -%}
              {%- else -%}
                {%- set time_str  = '{:d} d'.format((m / 1440) | int) -%}
              {%- endif -%}

              {%- set raw_name = state_attr(sensor, 'friendly_name') -%}
              {%- set name = raw_name
                | replace('Schlafzimmer', 'Schlafz.')
                | replace('Badezimmer', 'Bad')
                | replace('Kinderzimmer', 'Kinderz.')
                | replace('Wohnzimmer', 'Wohnz.')
              -%}
              <span style="display: block; line-height: 22px;">- {{ name }} <span style="font-variant-numeric: tabular-nums; opacity: 0.65; font-size: 13px; margin-left: 4px;">· {{ time_str }}</span></span>
            {%- endfor -%}
            </p>
            {%- endif -%}
