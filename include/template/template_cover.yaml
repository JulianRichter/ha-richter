template:
  # =============================================
  # Google Home Helper
  # =============================================

  # Hack: Translate google home commands to cover positions
  - cover:
      - unique_id: home_assistant_controller_google
        name: Home Assistant Controller Google
        state: "open"
        position: "100"
        set_cover_position:
          - action: script.google_pass_command_to_home_assistant
            data:
              cover_position: "{{ position }}"

  # =============================================
  # Dashboard Helper
  # =============================================

  # Fix dashboard animation by just changing state when cover stops.
  - cover:
      - unique_id: bedroom_roller_blinds_dashboard
        name: Bedroom - Roller Blinds (Dashboard)
        device_class: blind
        availability: "{{ has_value('cover.bedroom_roller_blinds') }}"
        state: >
          {% set s = states('cover.bedroom_roller_blinds') %}
          {{ s if s in ['open', 'opening', 'closed', 'closing'] else 'closed' }}
        position: "{{ state_attr('cover.bedroom_roller_blinds', 'current_position') | default(0, true) | int(0) }}"
        set_cover_position:
          - action: cover.set_cover_position
            data:
              position: "{{ position }}"
            target:
              entity_id: cover.bedroom_roller_blinds
        stop_cover:
          - action: cover.stop_cover
            target:
              entity_id: cover.bedroom_roller_blinds

  # ====================================================================
  # Living Room Curtains (Smart Window Safety & Drift Compensation)
  # - Controls left and right living room curtains together as a group
  # - Protects left curtain from closing when living room window is open
  # - Reflects intended closed state via right curtain when window is open
  # - Compensates for motor slippage / end-stop drift with 5% threshold
  # - Uses hardware motor_state and running sensors to prevent stuck states
  # ====================================================================
  - cover:
      - unique_id: living_room_curtain_group
        name: Living Room Curtain Group
        device_class: curtain
        availability: >
          {{ has_value('cover.living_room_curtain_left') and has_value('cover.living_room_curtain_right') }}
        state: >
          {% set win_open = is_state('binary_sensor.living_room_window_contact', 'on') %}
          {% set left_pos = state_attr('cover.living_room_curtain_left', 'current_position') | default(0, true) | int(0) %}
          {% set right_pos = state_attr('cover.living_room_curtain_right', 'current_position') | default(0, true) | int(0) %}

          {# Check if motors are stopped via Aqara hardware sensors #}
          {% set left_stopped = is_state('sensor.living_room_curtain_left_motor_state', 'stopped') or is_state('binary_sensor.living_room_curtain_left_running', 'off') %}
          {% set right_stopped = is_state('sensor.living_room_curtain_right_motor_state', 'stopped') or is_state('binary_sensor.living_room_curtain_right_running', 'off') %}

          {# Active motion flags: only opening/closing if motor is not confirmed stopped #}
          {% set left_opening = is_state('sensor.living_room_curtain_left_motor_state', 'opening') or (is_state('cover.living_room_curtain_left', 'opening') and not left_stopped) %}
          {% set right_opening = is_state('sensor.living_room_curtain_right_motor_state', 'opening') or (is_state('cover.living_room_curtain_right', 'opening') and not right_stopped) %}

          {% set left_closing = is_state('sensor.living_room_curtain_left_motor_state', 'closing') or (is_state('cover.living_room_curtain_left', 'closing') and not left_stopped) %}
          {% set right_closing = is_state('sensor.living_room_curtain_right_motor_state', 'closing') or (is_state('cover.living_room_curtain_right', 'closing') and not right_stopped) %}

          {# Tolerant closed state: motor position <= 5% compensates for physical slip #}
          {% set left_closed = is_state('cover.living_room_curtain_left', 'closed') or left_pos <= 5 %}
          {% set right_closed = is_state('cover.living_room_curtain_right', 'closed') or right_pos <= 5 %}

          {% if left_opening or right_opening %}
            opening
          {% elif left_closing or right_closing %}
            closing
          {% elif win_open and right_closed %}
            closed
          {% elif left_closed and right_closed %}
            closed
          {% else %}
            open
          {% endif %}
        position: >
          {% set left_pos = state_attr('cover.living_room_curtain_left', 'current_position') | default(0, true) | int(0) %}
          {% set right_pos = state_attr('cover.living_room_curtain_right', 'current_position') | default(0, true) | int(0) %}
          {% if is_state('binary_sensor.living_room_window_contact', 'on') %}
            {% set pos = right_pos %}
          {% else %}
            {% set pos = ((left_pos + right_pos) / 2) | round(0) | int(0) %}
          {% endif %}
          {# Snap near-limit positions to 0% and 100% to ensure clean UI state and toggle reliability #}
          {% if pos <= 5 %}
            0
          {% elif pos >= 95 %}
            100
          {% else %}
            {{ pos }}
          {% endif %}
        open_cover:
          # Open both left and right curtains
          - action: cover.open_cover
            target:
              entity_id:
                - cover.living_room_curtain_left
                - cover.living_room_curtain_right
        close_cover:
          # Always close right curtain
          - action: cover.close_cover
            target:
              entity_id: cover.living_room_curtain_right
          # Only close left curtain if living room window is closed
          - if:
              - condition: state
                entity_id: binary_sensor.living_room_window_contact
                state: "off"
            then:
              - action: cover.close_cover
                target:
                  entity_id: cover.living_room_curtain_left
        stop_cover:
          # Stop both left and right curtains
          - action: cover.stop_cover
            target:
              entity_id:
                - cover.living_room_curtain_left
                - cover.living_room_curtain_right
        set_cover_position:
          # Set position for right curtain
          - action: cover.set_cover_position
            data:
              position: "{{ position }}"
            target:
              entity_id: cover.living_room_curtain_right
          # Only set position for left curtain if window is closed or target position is fully open
          - if:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: binary_sensor.living_room_window_contact
                    state: "off"
                  - condition: template
                    value_template: "{{ position | int(0) >= 95 }}"
            then:
              - action: cover.set_cover_position
                data:
                  position: "{{ position }}"
                target:
                  entity_id: cover.living_room_curtain_left
