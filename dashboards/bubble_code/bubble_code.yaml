            button_action:
              tap_action:
                action: navigate
                navigation_path: "#bubble_map_julian_popup"
            sub_button:
              - entity: person.julian
                icon: mdi:map-marker-outline
                tap_action:
                  action: navigate
                  navigation_path: "#bubble_map_julian_popup"
            button_type: state
            modules:
              - person_home_badge
          - type: custom:bubble-card
            card_type: button
            entity: person.xingyang
            show_last_changed: true
            show_state: true
            card_layout: large
            tap_action:
              action: navigate
              navigation_path: "#bubble_map_xingyang_popup"
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#bubble_map_xingyang_popup"
            sub_button:
              - entity: person.xingyang
                icon: mdi:map-marker-outline
                tap_action:
                  action: navigate
                  navigation_path: "#bubble_map_xingyang_popup"
            button_type: state
            modules:
              - person_home_badge
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                entity: input_boolean.presence_home
                name: Home
                icon: mdi:home
                card_layout: large
                modules:
                  - presence_home_motion
              - type: custom:bubble-card
                card_type: button
                entity: switch.presence_away
                name: Away
                icon: mdi:sleep
                card_layout: large
                modules:
                  - presence_away_motion
        columns: 1
        # Keep buttons tightly stacked and grid cell strictly sized to content
        card_mod:
          style: |
            :host {
              align-self: start !important;
            }
            #root {
              align-content: start !important;
            }
        view_layout:
          grid-area: cell4
      - type: horizontal-stack
        cards:
          - type: custom:bubble-card
            card_type: button
