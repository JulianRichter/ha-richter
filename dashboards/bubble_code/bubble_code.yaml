      - type: custom:bubble-card
        card_type: pop-up
        hash: "#bubble_weather_popup"
        show_header: false
        button_type: name
        styles: |
          .bubble-pop-up-background {
            background: rgba(26, 26, 26, 0.82) !important;
            backdrop-filter: blur(28px) !important;
            -webkit-backdrop-filter: blur(28px) !important;
            border: 1px solid rgba(255, 255, 255, 0.10) !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
          }
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Wetter – 3-Tage-Vorhersage
            icon: mdi:weather-partly-cloudy
            grid_options:
              columns: 12
          - type: custom:apexcharts-card
            graph_span: 3d
            span:
              start: day
            update_interval: 10min
            yaxis:
              - id: temp
                show: true
                decimals: 0
                apex_config:
                  tickAmount: 4
                  labels:
                    style:
                      colors: "#90a4ae"
                      fontSize: "11px"
                    formatter: |
                      EVAL:function(val) { return Math.round(val) + "°"; }
              - id: rain
                show: false
                min: 0
                max: 4
              - id: wind
                show: false
                min: 0
                max: 25
            now:
              show: true
              color: "rgba(255, 255, 255, 0.4)"
              label: "Jetzt"
            series:
              - name: Regen
                entity: sensor.weather_home_forecast_at_midnight
                data_generator: |
                  const list = entity?.attributes?.datetime || [];
                  const now0 = new Date();
                  now0.setHours(0, 0, 0, 0);
                  const t0 = now0.getTime();
                  const pts = list.map((datetime, index) => {
                    const p = entity.attributes.precipitation[index] || 0;
                    return [new Date(datetime).getTime(), p];
                  });
                  if (pts.length > 0 && pts[0][0] > t0) {
                    pts.unshift([t0, pts[0][1]]);
                  }
                  return pts;
                type: area
                stroke_width: 0
                color: "#38bdf8"
                opacity: 0.38
                curve: smooth
                yaxis_id: rain
                unit: mm
                show:
                  in_legend: true
                  legend_value: false
              - name: Wind
                entity: sensor.weather_home_forecast_at_midnight
                data_generator: |
                  const list = entity?.attributes?.datetime || [];
                  const now0 = new Date();
                  now0.setHours(0, 0, 0, 0);
                  const t0 = now0.getTime();
                  const pts = list.map((datetime, index) => {
                    const raw = (entity.attributes.wind_speed && entity.attributes.wind_speed[index] !== undefined)
                      ? entity.attributes.wind_speed[index]
                      : 0;
                    const w = Math.max(0, raw - 10);
                    return [new Date(datetime).getTime(), w];
                  });
                  if (pts.length > 0 && pts[0][0] > t0) {
                    pts.unshift([t0, pts[0][1]]);
                  }
                  return pts;
                type: area
                stroke_width: 0
                color: "#cbd5e1"
                opacity: 0.30
                curve: smooth
                yaxis_id: wind
                unit: " km/h"
                show:
                  in_legend: true
                  legend_value: false
              - name: Vorhersage
                entity: sensor.weather_home_forecast
                data_generator: |
                  const list = entity?.attributes?.datetime || [];
                  return list.map((datetime, index) => {
                    return [new Date(datetime).getTime(), entity.attributes.temperature[index]];
                  });
                type: line
                stroke_width: 3
                color: "#ffa726"
                opacity: 0.85
                curve: smooth
                yaxis_id: temp
                unit: "°C"
                show:
                  in_legend: false
                  legend_value: false
              - name: Temperatur
                entity: sensor.weather_home_current_temperature
                extend_to: now
                type: line
                stroke_width: 3
                color: "#ffa726"
                curve: smooth
                yaxis_id: temp
                unit: "°C"
                show:
                  in_legend: true
                  legend_value: false
              - name: Aktuell
                entity: sensor.weather_home_current_temperature
                data_generator: |
                  const val = parseFloat(entity.state);
                  const ts = Date.now();
                  return [[ts, val]];
                type: line
                stroke_width: 0
                color: "#ffa726"
                yaxis_id: temp
                unit: "°C"
                show:
                  in_legend: false
                  legend_value: false
            apex_config:
              stroke:
                curve: smooth
              markers:
                size: 0
                strokeWidth: 0
                strokeColors: "transparent"
                discrete:
                  - seriesIndex: 4
                    dataPointIndex: 0
                    size: 4
                    fillColor: "#ffa726"
                    strokeColor: "#ffffff"
                    strokeWidth: 2
              chart:
                height: 180px
                width: 100%
                toolbar:
                  show: false
              grid:
                show: true
                borderColor: "rgba(255, 255, 255, 0.05)"
                strokeDashArray: 3
                padding:
                  left: 6
                  right: 18
                  top: -10
                  bottom: 2
                xaxis:
                  lines:
                    show: true
                yaxis:
                  lines:
                    show: true
              xaxis:
                type: datetime
                tickAmount: 3
                labels:
                  hideOverlappingLabels: false
                  style:
                    colors: "#90a4ae"
                    fontSize: "11px"
                    fontWeight: 500
                  formatter: |
                    EVAL:function(val, timestamp) {
                      const days = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
                      const d = new Date((timestamp || val) + 43200000);
                      return days[d.getDay()];
                    }
                axisBorder:
                  show: false
                axisTicks:
                  show: false
              legend:
                show: true
                position: top
                horizontalAlign: center
                offsetX: 18
                fontSize: "11px"
                fontWeight: 500
                labels:
                  colors: "#cfd8dc"
                markers:
                  width: 7
                  height: 7
                  radius: 12
                  offsetX: -2
                itemMargin:
                  horizontal: 14
                  vertical: 0
              tooltip:
                enabled: true
                x:
                  format: "ddd, HH:mm"
                y:
                  formatter: |
                    EVAL:function(val, opts) {
                      if (val === undefined || val === null) return "";
                      if (opts.seriesIndex === 0) {
                        return val.toFixed(1) + " mm";
                      }
                      if (opts.seriesIndex === 1) {
                        return (val > 0 ? (val + 10).toFixed(1) : "< 10") + " km/h";
                      }
                      return val.toFixed(1) + " °C";
                    }
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                  padding: 8px 4px 4px 4px !important;
                }
                .apexcharts-legend-series[seriesname="Vorhersage"],
                .apexcharts-legend-series[seriesname="Aktuell"],
                .apexcharts-legend-series:has(.apexcharts-legend-text:empty) {
                  display: none !important;
                }
                .apexcharts-xaxis-annotations rect {
                  rx: 4px !important;
                  fill: rgba(30, 30, 30, 0.75) !important;
                  stroke: rgba(255, 255, 255, 0.22) !important;
                }
                .apexcharts-xaxis-annotations text {
                  fill: #ffffff !important;
                  font-size: 9px !important;
                  font-weight: 500 !important;
                }
            grid_options:
              columns: 12
          - type: custom:clock-weather-card
            entity: weather.weather_home_mock
            weather_icon_type: line
            locale: de
            sections:
              header:
                hide: true
              forecast_strip:
                hide: true
              forecast_list:
                hide: false
                count: 3
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                  padding: 8px 8px !important;
                }
                .card-content {
                  padding: 0 !important;
                }
            grid_options:
              columns: 12
          - type: custom:bubble-card
            card_type: separator
            name: Aktuelle Messwerte
            icon: mdi:gauge
            grid_options:
              columns: 12
          - type: custom:bubble-card
            card_type: button
            button_type: name
            entity: sensor.weather_home_current_rain_probability
            name: Niederschlag
            icon: mdi:weather-rainy
            show_state: true
            card_layout: large
            grid_options:
              columns: 6
          - type: custom:bubble-card
            card_type: button
            button_type: name
            entity: sensor.weather_home_current_wind_speed
            name: Wind
            icon: mdi:weather-windy
            show_state: true
            card_layout: large
            grid_options:
              columns: 6
            styles: |
              ${(() => {
                const s = hass.states['sensor.weather_home_current_wind_speed'];
                const spd = parseFloat(s?.state || '0');
                const bft = s?.attributes?.bft_desc || '';
                const gust = hass.states['sensor.weather_home_forecast']?.attributes?.max_gust_today;
                const gustStr = (gust && gust > 0) ? Math.round(gust) + ' km/h' : '';
                
                const stateEl = card.querySelector('.bubble-state');
                if (stateEl) {
                  stateEl.innerHTML = spd.toFixed(1) + ' km/h' + (bft ? ' &nbsp;·&nbsp; ' + bft : '');
                }
                const nameEl = card.querySelector('.bubble-name');
                if (nameEl) {
                  nameEl.innerHTML = 'Wind' + (gustStr ? ' &nbsp;<span style="font-size: 11px; opacity: 0.7;">(Böen bis ' + gustStr + ')</span>' : '');
                }
              })()}
      - type: custom:bubble-card
        card_type: pop-up
        hash: "#bubble_sensors_offline_popup"
        show_header: false
        button_type: name
        styles: |
          .bubble-pop-up-background {
            background: rgba(26, 26, 26, 0.85) !important;
            backdrop-filter: blur(28px) !important;
            -webkit-backdrop-filter: blur(28px) !important;
            border: 1px solid rgba(255, 255, 255, 0.10) !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
          }
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Sensor Status & Offline Diagnose
            icon: mdi:access-point-network-off
            grid_options:
              columns: 12
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  border: none !important;
                  background: rgba(0, 0, 0, 0.25) !important;
                  border-radius: var(--bubble-border-radius, 24px) !important;
                  padding: 14px 18px !important;
                  box-shadow: none !important;
                }
                blockquote {
                  background: rgba(239, 83, 80, 0.18) !important;
                  border-left: 4px solid #ef5350 !important;
                  border-radius: 8px !important;
                  padding: 10px 14px !important;
                  margin: 0 0 14px 0 !important;
                }
                :host ha-markdown blockquote, ha-markdown blockquote {
                  background: rgba(239, 83, 80, 0.18) !important;
                  border-left: 4px solid #ef5350 !important;
                  border-radius: 8px !important;
                  padding: 10px 14px !important;
                  margin: 0 0 14px 0 !important;
                }
                ha-card table, ha-markdown table {
                  width: 100%;
                  border-collapse: collapse;
                  margin: 8px 0 14px 0;
                }
                ha-card th, ha-card td, ha-markdown th, ha-markdown td {
                  padding: 7px 8px;
                  text-align: left;
                  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
                }
                ha-card th, ha-markdown th {
                  font-size: 11px;
                  text-transform: uppercase;
                  letter-spacing: 0.5px;
                  color: rgba(255, 255, 255, 0.5);
                }
                ha-card td, ha-markdown td {
                  font-size: 13px;
                }
                ul {
                  padding-left: 18px;
                  margin: 6px 0 2px 0;
                }
                li {
                  font-size: 12px;
                  line-height: 1.6;
                  color: rgba(255, 255, 255, 0.75);
                }
            content: |
              {% set tracked = [
                ('binary_sensor.kitchen_window_contact', 'sensor.kitchen_window_battery', 'Küche – Fensterkontakt', 'mdi:window-closed-variant'),
                ('binary_sensor.living_room_window_contact', 'sensor.living_room_window_battery', 'Wohnzimmer – Fensterkontakt', 'mdi:window-closed-variant'),
                ('binary_sensor.bedroom_window_contact', 'sensor.bedroom_window_battery', 'Schlafzimmer – Fensterkontakt', 'mdi:window-closed-variant'),
                ('binary_sensor.baby_room_window_contact', 'sensor.baby_room_window_battery', 'Kinderzimmer – Fensterkontakt', 'mdi:window-closed-variant'),
                ('sensor.kitchen_multi_sensor_temperature', 'sensor.kitchen_multi_sensor_battery', 'Küche – Klimasensor', 'mdi:thermometer'),
                ('sensor.living_room_multi_sensor_temperature', 'sensor.living_room_multi_sensor_battery', 'Wohnzimmer – Klimasensor', 'mdi:thermometer'),
                ('sensor.bedroom_multi_sensor_temperature', 'sensor.bedroom_multi_sensor_battery', 'Schlafzimmer – Klimasensor', 'mdi:thermometer'),
                ('sensor.baby_room_multi_sensor_temperature', 'sensor.baby_room_multi_sensor_battery', 'Kinderzimmer – Klimasensor', 'mdi:thermometer'),
                ('sensor.bathroom_multi_sensor_temperature', 'sensor.bathroom_multi_sensor_battery', 'Badezimmer – Klimasensor', 'mdi:thermometer'),
                ('sensor.garden_multi_sensor_temperature', 'sensor.garden_multi_sensor_battery', 'Garten – Klimasensor', 'mdi:thermometer'),
                ('binary_sensor.kitchen_motion_sensor_occupancy', 'sensor.kitchen_motion_sensor_battery', 'Küche – Bewegungsmelder', 'mdi:motion-sensor'),
                ('binary_sensor.living_room_motion_sensor_occupancy', 'sensor.living_room_motion_sensor_battery', 'Wohnzimmer – Bewegungsmelder', 'mdi:motion-sensor'),
                ('binary_sensor.bedroom_motion_sensor_left_occupancy', 'sensor.bedroom_motion_sensor_left_battery', 'Schlafzimmer Links – Bewegungsmelder', 'mdi:motion-sensor'),
                ('binary_sensor.bedroom_motion_sensor_right_occupancy', 'sensor.bedroom_motion_sensor_right_battery', 'Schlafzimmer Rechts – Bewegungsmelder', 'mdi:motion-sensor'),
                ('binary_sensor.baby_room_motion_sensor_occupancy', 'sensor.baby_room_motion_sensor_battery', 'Kinderzimmer – Bewegungsmelder', 'mdi:motion-sensor'),
                ('binary_sensor.bathroom_motion_sensor_occupancy', 'sensor.bathroom_motion_sensor_battery', 'Badezimmer – Bewegungsmelder', 'mdi:motion-sensor'),
                ('binary_sensor.bathroom_shower_motion_sensor_occupancy', 'sensor.bathroom_shower_motion_sensor_battery', 'Badezimmer Dusche – Bewegungsmelder', 'mdi:motion-sensor')
              ] %}
              {% set offline = tracked | selectattr('0', 'is_state', 'unavailable') | list %}
              {% set count = offline | count %}

              {% if count > 0 %}
              > ⚠️ **{{ count }} {{ 'Sensor ist' if count == 1 else 'Sensoren sind' }} aktuell offline**  
              > Diese Geräte antworten nicht mehr auf Mesh-Abfragen und sind im System als `nicht verfügbar` geführt.

              | Sensor / Raum | Letzter Kontakt | Offline seit | Batteriestatus |
              | :--- | :--- | :--- | :--- |
              {% set raw_tracked = state_attr('sensor.tablet_sidebar_offline_sensors_tracker', 'offline_timestamps') | default({}, true) %}
              {% set tracked = (raw_tracked | from_json) if raw_tracked is string else (raw_tracked if raw_tracked is mapping else {}) %}
              {% for entity_id, batt_id, label, icon in offline %}
              {%- set s = states[entity_id] -%}
              {%- set rec_ts = tracked.get(entity_id) if tracked is mapping else none -%}
              {%- set ts = as_timestamp(rec_ts) if rec_ts else as_timestamp(s.last_updated) -%}
              {%- set diff = as_timestamp(now()) - ts -%}
              {%- set days = (diff // 86400) | int -%}
              {%- set hours = ((diff % 86400) // 3600) | int -%}
              {%- set mins = ((diff % 3600) // 60) | int -%}
              {%- set elapsed = (days ~ 'd ' ~ hours ~ 'h') if days > 0 else (hours ~ 'h ' ~ mins ~ 'm') -%}
              {%- set batt = states(batt_id) -%}
              | **{{ label }}** | {{ ts | timestamp_custom('%d.%m. %H:%M') }} | {{ elapsed }} | {{ batt ~ '%' if batt not in ['unavailable', 'unknown'] else '<span style="color:#ef5350;">nicht erreichbar</span>' }} |
              {% endfor %}
              {% else %}
              <div style="background: rgba(102, 187, 106, 0.15); border-left: 4px solid #66bb6a; border-radius: 8px; padding: 10px 14px; color: #a5d6a7;">
                ✅ <b>Alle 17 überwachten Sensoren sind online</b> und senden reguläre Messwerte.
              </div>
              {% endif %}

              **🛠️ Schnellhilfe & Diagnose:**
              - 🔋 **Batterie prüfen:** Meist ist die Knopfzelle (CR2032 oder CR2450) erschöpft.
              - 📡 **Funk & Mesh:** Prüfen, ob Zigbee-Router (z.B. Zwischenstecker) ausgesteckt wurden.
              - 🔄 **Aufwecken:** Pinhole-Taste am Sensor 1x kurz drücken, um Check-in zu erzwingen.
            grid_options:
              columns: 12
