title: Bubble Code
kiosk_mode:
  user_settings:
    - users:
        - tablet
      hide_header: true
      hide_sidebar: true
      hide_settings: true
      hide_overflow: true
views:
  - type: custom:grid-layout
    title: Home
    path: Home
    theme: bubble_code_theme
    layout:
      margin: 0
      padding: 0
      card_margin: 0
      grid-gap: 3.0vw
      grid-template-columns: 1fr 1.5fr 1.5fr 0fr
      # Size rows 1-3 to content so row 2 (Home) does not expand to fit 4 buttons
      grid-template-rows: auto auto auto 1fr
      grid-template-areas: |
        "sidebar  cell1   cell2   ."
        "sidebar  cell3   cell4   ."
        "sidebar  footer  footer  ."
        "sidebar  .       .       ."
      mediaquery:
        # Mobile layout: single column, sidebar hidden via card_mod
        "(max-width: 600px)":
          grid-template-columns: 1fr
          grid-template-rows: auto auto auto auto auto auto
          grid-template-areas: |
            "cell1"
            "cell2"
            "cell3"
            "cell4"
            "footer"
            "sidebar"
    cards:
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: button
            entity: sensor.template_tablet_sidebar_time
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            tap_action:
              action: navigate
              navigation_path: "#bubble_calendar_popup"
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#bubble_calendar_popup"
            modules:
              - bubble_sidebar_text

          - type: custom:bubble-card
            card_type: button
            entity: sensor.template_tablet_sidebar_date
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            tap_action:
              action: navigate
              navigation_path: "#bubble_calendar_popup"
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#bubble_calendar_popup"
            modules:
              - bubble_sidebar_text

          - type: custom:bubble-card
            card_type: button
            entity: sensor.template_tablet_sidebar_weather
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            tap_action:
              action: navigate
              navigation_path: "#bubble_weather_popup"
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#bubble_weather_popup"
            modules:
              - bubble_sidebar_text

          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
            update_interval: 5min
            yaxis:
              - id: temp
                show: false
              - id: rain
                min: 0
                max: 4
                show: false
              - id: wind
                min: 0
                max: 25
                show: false
            series:
              - name: Rain
                entity: sensor.weather_home_forecast_at_midnight
                data_generator: |
                  const list = entity?.attributes?.datetime || [];
                  const now0 = new Date();
                  now0.setHours(0, 0, 0, 0);
                  const t0 = now0.getTime();
                  const pts = list.map((datetime, index) => {
                    const p = entity.attributes.precipitation[index] || 0;
                    return [new Date(datetime).getTime(), p];
                  });
                  if (pts.length > 0 && pts[0][0] > t0) {
                    pts.unshift([t0, pts[0][1]]);
                  }
                  return pts;
                type: area
                stroke_width: 0
                color: "#38bdf8"
                opacity: 0.38
                curve: smooth
                yaxis_id: rain
              - name: Wind
                entity: sensor.weather_home_forecast_at_midnight
                data_generator: |
                  const list = entity?.attributes?.datetime || [];
                  const now0 = new Date();
                  now0.setHours(0, 0, 0, 0);
                  const t0 = now0.getTime();
                  const pts = list.map((datetime, index) => {
                    const raw = (entity.attributes.wind_speed && entity.attributes.wind_speed[index] !== undefined)
                      ? entity.attributes.wind_speed[index]
                      : 0;
                    const w = Math.max(0, raw - 10);
                    return [new Date(datetime).getTime(), w];
                  });
                  if (pts.length > 0 && pts[0][0] > t0) {
                    pts.unshift([t0, pts[0][1]]);
                  }
                  return pts;
                type: area
                stroke_width: 0
                color: "#cbd5e1"
                opacity: 0.30
                curve: smooth
                yaxis_id: wind
              - name: Forecast
                entity: sensor.weather_home_forecast
                data_generator: |
                  const list = entity?.attributes?.datetime || [];
                  return list.map((datetime, index) => {
                    return [new Date(datetime).getTime(), entity.attributes.temperature[index]];
                  });
                type: line
                stroke_width: 3
                color: "#ffa726"
                opacity: 0.2
                yaxis_id: temp
              - name: Temperature
                entity: sensor.weather_home_current_temperature
                extend_to: now
                type: line
                stroke_width: 3
                color: "#ffa726"
                yaxis_id: temp
              - name: Temperature
                entity: sensor.weather_home_current_temperature
                data_generator: |
                  const val = parseFloat(entity.state);
                  const ts = Date.now();
                  return [[ts, val]];
                type: line
                stroke_width: 0
                color: "#ffa726"
                yaxis_id: temp
            apex_config:
              stroke:
                curve: smooth
              markers:
                size: 0
                strokeWidth: 0
                strokeColors: "transparent"
                discrete:
                  - seriesIndex: 4
                    dataPointIndex: 0
                    size: 3
                    fillColor: "#ffa726"
                    strokeColor: "#ffa726"
                    strokeWidth: 0
              chart:
                height: 90px
                width: 100%
              grid:
                show: false
              xaxis:
                labels:
                  show: false
                axisBorder:
                  show: false
                axisTicks:
                  show: false
              yaxis:
                show: false
              legend:
                show: false
              tooltip:
                enabled: false
              sparkline:
                enabled: true
            card_mod:
              style: |
                :host {
                  min-width: 0 !important;
                }
                ha-card {
                  margin: -3vh 3vw 0 2.5vw;
                  background-color: rgba(0, 0, 0, 0) !important;
                  border: none !important;
                  min-width: 0 !important;
                  max-width: calc(100% - 5.5vw) !important;
                  width: auto !important;
                  overflow: hidden !important;
                }
                .wrapper, #graph-wrapper, .apexcharts-canvas, svg {
                  min-width: 0 !important;
                  max-width: 100% !important;
                }
                .apexcharts-marker[default-marker-size="0.1"],
                .apexcharts-marker[default-marker-size="0"] {
                  display: none !important;
                  opacity: 0 !important;
                }

          - type: custom:clock-weather-card
            entity: weather.weather_home_mock
            weather_icon_type: line
            locale: de
            sections:
              header:
                hide: true
              forecast_strip:
                hide: true
              forecast_list:
                hide: false
                count: 3
            card_mod:
              style: |
                ha-card {
                  padding: 0 3vw 0 3vw;
                  background-color: rgba(0, 0, 0, 0) !important;
                  border: none !important;
                  border-radius: 0px;
                }
                .card-content {
                  padding: 0 !important;
                }
                clock-weather-card-divider {
                  display: none !important;
                }
                clock-weather-card-forecast-list .rows {
                  grid-template-columns: var(--cwc-list-row-height, 28px) max-content 1fr max-content !important;
                }
                clock-weather-card-forecast-list-item .label {
                  display: none !important;
                }

          - type: custom:bubble-card
            card_type: button
            entity: sensor.template_tablet_sidebar_greeting
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            modules:
              - bubble_sidebar_text

          - type: custom:bubble-card
            card_type: button
            entity: binary_sensor.template_tablet_sidebar_birthday_notification
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            modules:
              - bubble_sidebar_notification

          - type: custom:bubble-card
            card_type: button
            entity: binary_sensor.template_tablet_sidebar_anniversary_notification
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            modules:
              - bubble_sidebar_notification

          - type: custom:bubble-card
            card_type: button
            entity: binary_sensor.template_tablet_sidebar_sensors_offline
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            tap_action:
              action: navigate
              navigation_path: "#bubble_sensors_offline_popup"
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#bubble_sensors_offline_popup"
            modules:
              - bubble_sidebar_notification

          - type: custom:bubble-card
            card_type: button
            entity: binary_sensor.template_tablet_sidebar_window_contacts
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            modules:
              - bubble_sidebar_notification

        # Sidebar styling: subtle dark background and divider border
        card_mod:
          style: |
            :host {
              --stack-card-gap: 0px !important;
              --vertical-stack-card-margin: 0px !important;
              background-color: rgba(0, 0, 0, 0.06) !important;
              border-right: 0.1vw solid rgba(58, 69, 73, 0.5) !important;
              height: 100% !important;
              min-height: 100vh !important;
              box-sizing: border-box !important;
              margin: 0 !important;
            }
            #root {
              --stack-card-gap: 0px !important;
              --vertical-stack-card-margin: 0px !important;
              gap: 0 !important;
              height: 100% !important;
              min-height: 100vh !important;
              margin: 0 !important;
              padding: 0 !important;
            }
            /* Mobile: hide sidebar entirely */
            @media (max-width: 600px) {
              :host {
                display: none !important;
              }
            }
        view_layout:
          grid-area: sidebar
      - square: false
        type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Geräte
            modules:
              - bubble_header_separator
            styles: |
              ha-card {
                padding: 1.5vw 0 0 0 !important;
              }
          - type: custom:bubble-card
            card_type: button
            entity: vacuum.robi
            name: Robi
            icon: mdi:robot-vacuum
            card_layout: large
            sub_button:
              - entity: vacuum.robi
                tap_action:
                  action: perform-action
                  perform_action: select.select_next
                  target:
                    entity_id: select.robi_suction_level
                  data:
                    cycle: true
              - entity: vacuum.robi
                tap_action:
                  action: perform-action
                  perform_action: input_boolean.toggle
                  target:
                    entity_id: input_boolean.vacuum_mopping_enabled
              - entity: vacuum.robi
                icon: mdi:dots-horizontal
            modules:
              - vacuum_attention_badge
              - vacuum_cleaning_motion
            styles: |
              ${(() => {
                const sIcon = hass.states['select.robi_suction_level']?.attributes?.icon;
                if (sIcon && subButtonIcon[0]) subButtonIcon[0].setAttribute("icon", sIcon);
                const mIcon = hass.states['binary_sensor.template_vacuum_mopping_enabled']?.attributes?.icon;
                if (mIcon && subButtonIcon[1]) subButtonIcon[1].setAttribute("icon", mIcon);
              })()}
          - type: custom:bubble-card
            card_type: button
            entity: switch.living_room_tv
            name: TV
            icon: mdi:television
            card_layout: large
            sub_button:
              - entity: switch.living_room_nintendo
                icon: mdi:dots-horizontal
                tap_action:
                  action: perform-action
                  perform_action: switch.toggle
                  target:
                    entity_id: switch.living_room_nintendo
          - type: custom:bubble-card
            card_type: button
            entity: switch.living_room_desktop
            name: Computer
            icon: mdi:laptop
            card_layout: large
          - type: custom:bubble-card
            card_type: button
            entity: cover.living_room_curtain_group
            name: Rollo
            card_layout: large
            sub_button:
              - entity: cover.baby_room_roller_blinds
                icon: mdi:dots-horizontal
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              - entity: cover.bedroom_roller_blinds
                icon: mdi:dots-horizontal
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
        columns: 1
        view_layout:
          grid-area: cell1
      - square: false
        type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Räume
            modules:
              - bubble_header_separator
            styles: |
              ha-card {
                padding: 1.5vw 0 0 0 !important;
              }

          - type: custom:bubble-card
            card_type: button
            entity: light.living_room_light_group
            name: Wohnzimmer
            icon: mdi:sofa
            show_state: true
            card_layout: large
            sub_button:
              - entity: switch.living_room_spot_lights
                icon: mdi:dots-horizontal
                tap_action:
                  action: toggle
            button_type: switch
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            modules:
              - bubble_room_climate
              - room_light_color
              - room_window_badge
              - room_battery_badge
              - room_motion_badge

          - type: custom:bubble-card
            card_type: button
            entity: light.bedroom_light_group
            name: Schlafzimmer
            icon: mdi:bed
            show_state: true
            card_layout: large
            sub_button:
              - entity: light.bedroom_light_sphere
                icon: mdi:dots-horizontal
                tap_action:
                  action: toggle
            button_type: switch
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            modules:
              - bubble_room_climate
              - room_light_color
              - room_window_badge
              - room_battery_badge
              - room_motion_badge

          - type: custom:bubble-card
            card_type: button
            entity: light.baby_room_light
            name: Kinderzimmer
            icon: mdi:cradle
            show_state: true
            card_layout: large
            sub_button:
              - entity: switch.baby_room_heater
                icon: mdi:dots-horizontal
                tap_action:
                  action: toggle
            button_type: switch
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            modules:
              - bubble_room_climate
              - room_light_color
              - room_window_badge
              - room_battery_badge
              - room_motion_badge

          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                entity: light.kitchen_light_group
                name: Küche
                icon: mdi:fridge-outline
                show_state: true
                card_layout: large
                button_type: switch
                button_action:
                  tap_action:
                    action: toggle
                tap_action:
                  action: perform-action
                  perform_action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.kitchen_dishwasher_done
                hold_action:
                  action: more-info
                modules:
                  - bubble_room_climate
                  - room_light_color
                  - room_window_badge
                  - dishwasher_done_badge
                  - room_motion_badge

              - type: custom:bubble-card
                card_type: button
                entity: light.bathroom_light
                name: Bad
                icon: mdi:toilet
                show_state: true
                card_layout: large
                button_type: switch
                button_action:
                  tap_action:
                    action: toggle
                tap_action:
                  action: perform-action
                  perform_action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.bathroom_laundry
                hold_action:
                  action: more-info
                modules:
                  - bubble_room_climate
                  - room_light_color
                  - washer_done_badge
                  - room_battery_badge
                  - room_motion_badge

        columns: 1
        view_layout:
          grid-area: cell2
      - square: false
        type: grid
        columns: 1
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Sensor
            modules:
              - bubble_header_separator

          - type: custom:apexcharts-card
            graph_span: 4h
            update_interval: 1min
            yaxis:
              - id: humidity
                min: ~58
                show: false
            apex_config:
              chart:
                height: 177px
                toolbar:
                  show: false
                zoom:
                  enabled: false
                parentHeightOffset: 0
                events:
                  mounted: |
                    EVAL:function(chartContext, config) {
                      const updateSplit = function() {
                        try {
                          const root = chartContext.el.getRootNode();
                          const haCard = root.querySelector('ha-card');
                          const line = root.querySelector('.apexcharts-yaxis-annotations line');
                          if (haCard) {
                            if (line) {
                              const cRect = haCard.getBoundingClientRect();
                              const lRect = line.getBoundingClientRect();
                              if (cRect.height > 0) {
                                const pct = Math.max(0, Math.min(100, ((lRect.top - cRect.top) / cRect.height) * 100));
                                haCard.style.setProperty('--split-pct', pct.toFixed(1) + '%');
                              }
                            } else {
                              const minY = chartContext.w?.globals?.minY;
                              const maxY = chartContext.w?.globals?.maxY;
                              if (minY !== undefined && 60 <= minY) {
                                haCard.style.setProperty('--split-pct', '100%');
                              } else if (maxY !== undefined && 60 >= maxY) {
                                haCard.style.setProperty('--split-pct', '0%');
                              }
                            }
                          }
                        } catch(e) {}
                      };
                      setTimeout(updateSplit, 50);
                      setTimeout(updateSplit, 300);
                    }
                  updated: |
                    EVAL:function(chartContext, config) {
                      setTimeout(function() {
                        try {
                          const root = chartContext.el.getRootNode();
                          const haCard = root.querySelector('ha-card');
                          const line = root.querySelector('.apexcharts-yaxis-annotations line');
                          if (haCard) {
                            if (line) {
                              const cRect = haCard.getBoundingClientRect();
                              const lRect = line.getBoundingClientRect();
                              if (cRect.height > 0) {
                                const pct = Math.max(0, Math.min(100, ((lRect.top - cRect.top) / cRect.height) * 100));
                                haCard.style.setProperty('--split-pct', pct.toFixed(1) + '%');
                              }
                            } else {
                              const minY = chartContext.w?.globals?.minY;
                              const maxY = chartContext.w?.globals?.maxY;
                              if (minY !== undefined && 60 <= minY) {
                                haCard.style.setProperty('--split-pct', '100%');
                              } else if (maxY !== undefined && 60 >= maxY) {
                                haCard.style.setProperty('--split-pct', '0%');
                              }
                            }
                          }
                        } catch(e) {}
                      }, 50);
                    }
              stroke:
                curve: smooth
                width: 2.5
              grid:
                show: true
                borderColor: "rgba(255, 255, 255, 0.06)"
                strokeDashArray: 3
                padding:
                  left: 18
                  right: 18
                  top: -10
                  bottom: 2
                xaxis:
                  lines:
                    show: true
                yaxis:
                  lines:
                    show: false
              xaxis:
                type: numeric
                tickAmount: 4
                labels:
                  formatter: |
                    EVAL:function(val) {
                      const diffHours = Math.round((Date.now() - val) / 3600000);
                      if (diffHours <= 0) return "Jetzt";
                      return "-" + diffHours + "h";
                    }
                  style:
                    colors: "#90a4ae"
                    fontSize: "10px"
                axisBorder:
                  show: false
                axisTicks:
                  show: false
              legend:
                show: true
                position: top
                horizontalAlign: center
                fontSize: "11px"
                fontWeight: 500
                labels:
                  colors: "#cfd8dc"
                markers:
                  width: 7
                  height: 7
                  radius: 12
                  offsetX: -2
                itemMargin:
                  horizontal: 12
                  vertical: 0
              annotations:
                yaxis:
                  - y: 60
                    borderColor: "rgba(34, 197, 94, 0.7)"
                    borderWidth: 1.5
                    strokeDashArray: 3
            series:
              - entity: sensor.living_room_multi_sensor_humidity
                name: Wohnz.
                color: "#ffa726"
                stroke_width: 2.5
                curve: smooth
                yaxis_id: humidity
                show:
                  legend_value: false
              - entity: sensor.bedroom_multi_sensor_humidity
                name: Schlafz.
                color: "#ef5350"
                stroke_width: 2.5
                curve: smooth
                yaxis_id: humidity
                show:
                  legend_value: false
              - entity: sensor.baby_room_multi_sensor_humidity
                name: Kinderz.
                color: "#ab47bc"
                stroke_width: 2.5
                curve: smooth
                yaxis_id: humidity
                show:
                  legend_value: false
              - entity: sensor.bathroom_multi_sensor_humidity
                name: Badez.
                color: "#38bdf8"
                stroke_width: 2.5
                curve: smooth
                yaxis_id: humidity
                show:
                  legend_value: false
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(180deg,
                    rgba(239, 68, 68, 0.12) 0%,
                    rgba(239, 68, 68, 0.03) calc(var(--split-pct, 50%) - 4%),
                    rgba(34, 197, 94, 0.03) calc(var(--split-pct, 50%) + 4%),
                    rgba(34, 197, 94, 0.14) 100%),
                    rgba(26, 26, 26, 0.82) !important;
                  border-radius: var(--bubble-border-radius, 25px) !important;
                  border: 1px solid rgba(255, 255, 255, 0.10) !important;
                  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25) !important;
                  padding: 8px 4px 4px 4px !important;
                }
        # Keep grid content aligned to top without stretching
        card_mod:
          style: |
            :host {
              align-self: start !important;
            }
            #root {
              align-content: start !important;
            }
        view_layout:
          grid-area: cell3
      - square: false
        type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Home
            modules:
              - bubble_header_separator
          - type: custom:bubble-card
            card_type: button
            entity: person.julian
            show_last_changed: true
            show_state: true
            card_layout: large
            tap_action:
              action: navigate
