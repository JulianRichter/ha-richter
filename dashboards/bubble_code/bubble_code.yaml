                const sKp = hass.states['sensor.augsburg_curtiusstrasse_koenigsplatz'];
                const sLh = hass.states['sensor.augsburg_curtiusstrasse_lechh_n_ostfriedh'];
                const formatTime = (s) => {
                  if (!s) return '--';
                  let m = null;
                  if (s.attributes && s.attributes.next_departure_minutes != null) m = s.attributes.next_departure_minutes;
                  else if (s.attributes && s.attributes.departures && s.attributes.departures[0]) m = s.attributes.departures[0].minutes_until_departure;
                  if (m == null) m = s.state;
                  if (m == null || m === '' || m === 'unavailable' || m === 'unknown') return '--';
                  const min = parseInt(m, 10);
                  if (isNaN(min)) return m;
                  if (min >= 60) {
                    const h = Math.floor(min / 60);
                    return `${h}h`;
                  }
                  return `${min}m`;
                };
                const kpText = formatTime(sKp);
                const lhText = formatTime(sLh);
                const el = card.querySelector('.bubble-state');
                if (el) el.innerHTML = kpText + " \u00A0|\u00A0 " + lhText;
              })()}
