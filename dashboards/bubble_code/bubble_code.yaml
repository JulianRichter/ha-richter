      - type: custom:bubble-card
        card_type: pop-up
        hash: "#bubble_tram_popup"
        show_header: false
        button_type: name
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Tram 1 – Curtiusstraße
            icon: mdi:tram
            grid_options:
              columns: 12
          - type: custom:bubble-card
            card_type: button
            entity: sensor.augsburg_curtiusstrasse_koenigsplatz
            name: Königsplatz / Göggingen
            icon: mdi:city
            show_state: true
            sub_button:
              - entity: sensor.tram_1_konigsplatz_walk_status
                show_state: true
                show_icon: true
                icon: mdi:walk
            grid_options:
              columns: 12
          - type: custom:bubble-card
            card_type: button
            entity: sensor.augsburg_curtiusstrasse_lechh_n_ostfriedh
            name: Lechhausen Neuer Ostfriedhof
            icon: mdi:compass-outline
            show_state: true
            sub_button:
              - entity: sensor.tram_1_lechhausen_walk_status
                show_state: true
                show_icon: true
                icon: mdi:walk
            grid_options:
              columns: 12
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  border: none !important;
                  background: transparent !important;
                  box-shadow: none !important;
                }
            content: |
              **Königsplatz / Göggingen (Bstg. e)**
              {% set kp_deps = state_attr('sensor.augsburg_curtiusstrasse_koenigsplatz', 'departures') %}
              {%- if kp_deps and kp_deps | length > 0 -%}
              {%- for dep in kp_deps -%}
              {%- set dest = dep.destination | replace('Augsburg, ', '') | replace('Augsburg ', '') -%}
              {%- set parts = dep.departure_time.split(':') if ':' in dep.departure_time else ['0', '0'] -%}
              {%- set h = parts[0] | int -%}
              {%- set m = parts[1] | int -%}
              {%- set arr_m = m + 25 -%}
              {%- set arr_h = (h + (arr_m // 60)) % 24 -%}
              {%- set arr_m = arr_m % 60 -%}
              {%- set arr_time = '%02d:%02d' | format(arr_h, arr_m) -%}
              {%- set dep_m = dep.minutes_until_departure | int(0) -%}
              {%- if dep_m >= 60 -%}
                {%- set dep_str = (dep_m // 60) ~ 'h' -%}
              {%- else -%}
                {%- set dep_str = dep_m ~ ' min' -%}
              {%- endif -%}
              - **Abfahrt:** {{ dep.departure_time }} (in {{ dep_str }}) → **{{ dest }}:** ~{{ arr_time }}{% if dep.delay and dep.delay > 0 %} <span style="color: #ef5350;">(+{{ dep.delay }}m)</span>{% endif %}
              {% endfor -%}
              {%- else -%}
              - Keine Abfahrtsdaten verfügbar
              {%- endif %}

              <br>

              **Lechhausen Neuer Ostfriedhof (Bstg. a)**
              {% set lh_deps = state_attr('sensor.augsburg_curtiusstrasse_lechh_n_ostfriedh', 'departures') %}
              {%- if lh_deps and lh_deps | length > 0 -%}
              {%- for dep in lh_deps -%}
              {%- set dest = dep.destination | replace('Augsburg, ', '') | replace('Augsburg ', '') -%}
              {%- set parts = dep.departure_time.split(':') if ':' in dep.departure_time else ['0', '0'] -%}
              {%- set h = parts[0] | int -%}
              {%- set m = parts[1] | int -%}
              {%- set arr_m = m + 10 -%}
              {%- set arr_h = (h + (arr_m // 60)) % 24 -%}
              {%- set arr_m = arr_m % 60 -%}
              {%- set arr_time = '%02d:%02d' | format(arr_h, arr_m) -%}
              {%- set dep_m = dep.minutes_until_departure | int(0) -%}
              {%- if dep_m >= 60 -%}
                {%- set dep_str = (dep_m // 60) ~ 'h' -%}
              {%- else -%}
                {%- set dep_str = dep_m ~ ' min' -%}
              {%- endif -%}
              - **Abfahrt:** {{ dep.departure_time }} (in {{ dep_str }}) → **{{ dest }}:** ~{{ arr_time }}{% if dep.delay and dep.delay > 0 %} <span style="color: #ef5350;">(+{{ dep.delay }}m)</span>{% endif %}
              {% endfor -%}
              {%- else -%}
              - Keine Abfahrtsdaten verfügbar
              {%- endif %}
            grid_options:
              columns: 12
