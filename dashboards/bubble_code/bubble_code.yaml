title: Bubble Code
kiosk_mode:
  user_settings:
    - users:
        - tablet
      hide_header: true
      hide_sidebar: true
      hide_settings: true
      hide_overflow: true
views:
  - type: custom:grid-layout
    title: Home
    path: Home
    theme: tablet_grid_theme
    layout:
      margin: 0
      padding: 0
      card_margin: 0
      grid-gap: 3.0vw
      grid-template-columns: 1fr 1.5fr 1.5fr 0fr
      # Size rows 1-3 to content so row 2 (Home) does not expand to fit 4 buttons
      grid-template-rows: auto auto auto 1fr
      grid-template-areas: |
        "sidebar  cell1   cell2   ."
        "sidebar  cell3   cell4   ."
        "sidebar  footer  footer  ."
        "sidebar  .       .       ."
      mediaquery:
        # Mobile layout: single column, sidebar hidden via card_mod
        "(max-width: 600px)":
          grid-template-columns: 1fr
          grid-template-rows: auto auto auto auto auto auto
          grid-template-areas: |
            "cell1"
            "cell2"
            "cell3"
            "cell4"
            "footer"
            "sidebar"
    cards:
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: button
            entity: sensor.template_tablet_sidebar_time
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            tap_action:
              action: navigate
              navigation_path: "#bubble_calendar_popup"
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#bubble_calendar_popup"
            styles: |
              /* position button in sidebar */
              ha-card {
                padding: 1.5vw 0 0 0 !important;
                cursor: pointer !important;
              }
              .bubble-button-card-container {
                background-color: rgba(0, 0, 0, 0) !important;
                border-radius: 0 !important;
                #height: 2em !important;
              }
              .bubble-name-container {
                margin: 0 3vw !important;
              }

              /* style text */
              .time {
                font-family: SF Text, Roboto;
                font-size: 56px; # 5.6vw;
                font-weight: 500;
                line-height: 56px;
                #letter-spacing: -0.05vw;
                color: rgba(255, 255, 255, 0.8);
              }
              .time-colon {
                position: relative;
                top: -.09em;
              }

          - type: custom:bubble-card
            card_type: button
            entity: sensor.template_tablet_sidebar_date
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            tap_action:
              action: navigate
              navigation_path: "#bubble_calendar_popup"
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#bubble_calendar_popup"
            styles: >
              /* position button in sidebar */

              ha-card {
                padding: 0 0 0 0 !important;
                cursor: pointer !important;
              }

              .bubble-button-card-container {
                background-color: rgba(0, 0, 0, 0) !important;
                border-radius: 0 !important;
              }

              .bubble-name-container {
                margin: 0 3vw !important;
              }


              /* style text */

              .date {
                font-family: SF Display, Roboto;
                font-size: 18px;
                font-weight: 700;
                color: #6a7377;
                line-height: 21px;
              }


              /* Inline JS to dynamically set height (margin-block-top + header
              +

              content) */ ${(() => {
                const fontSize = 18;
                const lineHeight = 21; 
                const height = 1*fontSize + lineHeight;
                const el = this.shadowRoot.querySelector('.bubble-button-card-container');
                if (el) el.style.height = height + 'px';
              })()}

          - type: custom:bubble-card
            card_type: button
            entity: sensor.template_tablet_sidebar_weather
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            tap_action:
              action: navigate
              navigation_path: "#bubble_weather_popup"
            button_action:
              tap_action:
                action: navigate
                navigation_path: "#bubble_weather_popup"
            styles: |
              /* position button in sidebar */
              ha-card {
                padding: 0 0 0 0 !important;
              }
              .bubble-button-card-container {
                background-color: rgba(0, 0, 0, 0) !important;
                border-radius: 0 !important;
                #height: 3em !important;
              }
              .bubble-name-container {
                margin: 0 3vw !important;
              }

              /* style weather display */
              .weather-widget {
                display: grid;
                grid-template-columns: 1fr 1fr;
                align-items: center;
              }
              .condition {
                font-family: SF Display, Roboto;
                font-size: 16px;
                font-weight: 400;
                color: #6a7377;
              }
              .temperature {
                font-family: SF Display, Roboto;
                font-size: 16px;
                font-weight: 700;
              }
              .weather-icon img {
                height: 6em;
              }

          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: day
            update_interval: 5min
            yaxis:
              - id: temp
                show: false
              - id: rain
                min: 0
                max: 100
                show: false
            series:
              - name: Rain
                entity: sensor.weather_home_forecast_at_midnight
                data_generator: |
                  return entity.attributes.datetime.map((datetime, index) => {
                    return [new Date(datetime).getTime(), entity.attributes.precipitation[index]];
                  });
                type: area
                stroke_width: 0
                color: "#42a5f5"
                opacity: 0.1
                yaxis_id: rain
              - name: Forecast
                entity: sensor.weather_home_forecast
                data_generator: |
                  return entity.attributes.datetime.map((datetime, index) => {
                    return [new Date(datetime).getTime(), entity.attributes.temperature[index]];
                  });
                type: line
                stroke_width: 3
                color: "#ffa726"
                opacity: 0.2
                yaxis_id: temp
              - name: Temperature
                entity: sensor.weather_home_current_temperature
                extend_to: now
                type: line
                stroke_width: 3
                color: "#ffa726"
                yaxis_id: temp
              - name: Temperature
                entity: sensor.weather_home_current_temperature
                data_generator: |
                  const val = parseFloat(entity.state);
                  const ts = Date.now();
                  return [[ts, val]];
                type: line
                stroke_width: 0
                color: "#ffa726"
                yaxis_id: temp
            apex_config:
              markers:
                size: 0
                discrete:
                  - seriesIndex: 3
                    dataPointIndex: 0
                    size: 3
                    fillColor: "#ffa726"
                    strokeColor: "#ffa726"
              chart:
                height: 90px
                width: 100%
              grid:
                show: false
              xaxis:
                labels:
                  show: false
                axisBorder:
                  show: false
                axisTicks:
                  show: false
              yaxis:
                show: false
              legend:
                show: false
              tooltip:
                enabled: false
              sparkline:
                enabled: true
            card_mod:
              style: |
                :host {
                  min-width: 0 !important;
                }
                ha-card {
                  margin: -3vh 3vw 0 2.5vw;
                  background-color: rgba(0, 0, 0, 0) !important;
                  border: none !important;
                  min-width: 0 !important;
                  max-width: calc(100% - 5.5vw) !important;
                  width: auto !important;
                  overflow: hidden !important;
                }
                .wrapper, #graph-wrapper, .apexcharts-canvas, svg {
                  min-width: 0 !important;
                  max-width: 100% !important;
                }

          - type: custom:clock-weather-card
            entity: weather.weather_home_mock
            weather_icon_type: line
            forecast_rows: 3
            time_pattern: HH:mm
            time_format: 24
            hide_today_section: true
            hide_forecast_section: false
            show_humidity: false
            hide_clock: false
            hide_date: true
            card_mod:
              style: |
                ha-card {
                  padding: 0 3vw 0 3vw;
                  background-color: rgba(0, 0, 0, 0) !important;
                  border: none !important;
                  border-radius: 0px;
                }
                .card-content {
                  padding: 0 !important;
                }
                clock-weather-card-forecast-row {
                  grid-template-columns: 2rem 2.1rem auto 2.1rem !important;
                }
                clock-weather-card-forecast-row forecast-text:nth-of-type(1) {
                  display: none !important;
                }

          - type: custom:bubble-card
            card_type: button
            entity: binary_sensor.template_tablet_sidebar_birthday_notification
            show_icon: false
            show_name: false
            show_attribute: true
            attribute: sidebar_html_text
            styles: >
              /* position button in sidebar */

              ha-card {
                padding: 0 0 0 0 !important;
              }

              .bubble-button-card-container {
                background-color: rgba(0, 0, 0, 0) !important;
                border-radius: 0 !important;
              }

              .bubble-button-background {
                 background-color: rgba(0, 0, 0, 0) !important;
              }

              .bubble-name-container {
                margin: 0 3vw !important;
              }


              /* style text */

              p {
                font-family: SF Display, Roboto;
                font-size: 18px;
                font-weight: 400;
                color: #6a7377;
                margin-block-end: 0 !important;
                line-height: 21px;
              }


              /* Inline JS to dynamically set height (margin + two line content)
              */

              ${(() => {
                const entity = 'binary_sensor.template_tablet_sidebar_birthday_notification';
                const count = hass.states[entity]?.attributes?.count || 0;
                const isVisible = count > 0;
                const fontSize = 18;
                const lineHeight = 21; 
                const height = isVisible ? 1*fontSize + (2*lineHeight * count) : 0;
                const el = this.shadowRoot.querySelector('.bubble-button-card-container');
                if (el) {
                  el.style.height = height + 'px';
                  el.style.display = isVisible ? '' : 'none';
                }
                this.style.display = isVisible ? '' : 'none';
                const updateParent = () => {
                  const h = this.closest('hui-card') || this.parentElement;
                  if (h) h.style.display = isVisible ? '' : 'none';
                };
                updateParent();
                if (!this.closest('hui-card')) {
                  requestAnimationFrame(updateParent);
                }
                return isVisible ? '' : ':host { display: none !important; } ha-card { display: none !important; }';
              })()}

