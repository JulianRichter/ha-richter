        # Sidebar styling: subtle dark background and divider border
        card_mod:
          style: |
            :host {
              --stack-card-gap: 0px !important;
              --vertical-stack-card-margin: 0px !important;
              background-color: rgba(0, 0, 0, 0.06) !important;
              border-right: 0.1vw solid rgba(58, 69, 73, 0.5) !important;
              height: 100% !important;
              min-height: 100vh !important;
              box-sizing: border-box !important;
              margin: 0 !important;
            }
            #root {
              --stack-card-gap: 0px !important;
              --vertical-stack-card-margin: 0px !important;
              gap: 0 !important;
              height: 100% !important;
              min-height: 100vh !important;
              margin: 0 !important;
              padding: 0 !important;
            }
            /* Mobile: hide sidebar entirely */
            @media (max-width: 600px) {
              :host {
                display: none !important;
              }
            }
        view_layout:
          grid-area: sidebar
      - square: false
        type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Geräte
            styles: |
              .bubble-name {
                font-size: var(--dashboard-header-font-size);
                font-weight: var(--dashboard-header-font-weight);
              }
              ha-card {
                padding: 1.5vw 0 0 0 !important;
              }
          - type: custom:bubble-card
            card_type: button
            entity: vacuum.robi
            name: Robi
            icon: mdi:robot-vacuum
            card_layout: large
            sub_button:
              - entity: vacuum.robi
                tap_action:
                  action: perform-action
                  perform_action: dreame_vacuum.select_select_next
                  target:
                    entity_id: select.robi_suction_level
              - entity: vacuum.robi
                tap_action:
                  action: perform-action
                  perform_action: input_boolean.toggle
                  target:
                    entity_id: input_boolean.vacuum_mopping_enabled
              - entity: vacuum.robi
                icon: mdi:dots-horizontal
            styles: >
              ${subButtonIcon[0].setAttribute("icon",
              hass.states['select.robi_suction_level'].attributes.icon )}
              ${subButtonIcon[1].setAttribute("icon",
              hass.states['binary_sensor.template_vacuum_mopping_enabled'].attributes.icon
              )}
          - type: custom:bubble-card
            card_type: button
            entity: switch.living_room_tv
            name: TV
            icon: mdi:television
            card_layout: large
            sub_button:
              - entity: switch.living_room_nintendo
                icon: mdi:dots-horizontal
                tap_action:
                  action: perform-action
                  perform_action: switch.toggle
                  target:
                    entity_id: switch.living_room_nintendo
          - type: custom:bubble-card
            card_type: button
            entity: switch.living_room_desktop
            name: Computer
            icon: mdi:laptop
            card_layout: large
          - type: custom:bubble-card
            card_type: button
            entity: cover.living_room_curtain_group
            name: Rollo
            card_layout: large
            sub_button:
              - entity: cover.baby_room_roller_blinds
                icon: mdi:dots-horizontal
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              - entity: cover.bedroom_roller_blinds
                icon: mdi:dots-horizontal
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
        columns: 1
        view_layout:
          grid-area: cell1
      - square: false
        type: grid
        cards:
