          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                entity: light.kitchen_light_group
                name: Küche
                icon: mdi:fridge-outline
                show_state: true
                card_layout: large
                styles: |
                  .bubble-button-background {
                     background-color: ${state === 'on' ? 'rgb(255, 167, 88)' : 'var(--bubble-background-background-color)'} !important;
                  }
                  .bubble-icon {
                     color: ${state === 'on' ? 'rgb(255, 167, 88)' : 'var(--primary-text-color)'} !important;
                  }

                  ${(() => {
