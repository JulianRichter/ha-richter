      - type: custom:bubble-card
        card_type: pop-up
        hash: "#bubble_weather_popup"
        show_header: false
        button_type: name
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Wetter – 3-Tage-Vorhersage
            icon: mdi:weather-partly-cloudy
            grid_options:
              columns: 12
          - type: custom:apexcharts-card
            graph_span: 3d
            span:
              start: day
            update_interval: 10min
            yaxis:
              - id: temp
                show: true
                decimals: 0
                apex_config:
                  tickAmount: 4
                  labels:
                    style:
                      colors: "#90a4ae"
                      fontSize: "11px"
                    formatter: |
                      EVAL:function(val) { return Math.round(val) + "°"; }
              - id: rain
                min: 0
                max: 4
                show: false
            now:
              show: true
              color: "rgba(255, 255, 255, 0.4)"
              label: "Jetzt"
            series:
              - name: Regen
                entity: sensor.weather_home_forecast_at_midnight
                data_generator: |
                  return entity.attributes.datetime.map((datetime, index) => {
                    const p = entity.attributes.precipitation[index] || 0;
                    return [new Date(datetime).getTime(), p];
                  });
                type: area
                stroke_width: 1
                color: "#42a5f5"
                opacity: 0.3
                curve: smooth
                yaxis_id: rain
                unit: mm
              - name: Vorhersage
                entity: sensor.weather_home_forecast
                data_generator: |
                  return entity.attributes.datetime.map((datetime, index) => {
                    return [new Date(datetime).getTime(), entity.attributes.temperature[index]];
                  });
                type: line
                stroke_width: 3
                color: "#ffa726"
                opacity: 0.35
                curve: smooth
                yaxis_id: temp
                unit: "°C"
              - name: Temperatur
                entity: sensor.weather_home_current_temperature
                extend_to: now
                type: line
                stroke_width: 3
                color: "#ffa726"
                curve: smooth
                yaxis_id: temp
                unit: "°C"
              - name: Aktuell
                entity: sensor.weather_home_current_temperature
                data_generator: |
                  const val = parseFloat(entity.state);
                  const ts = Date.now();
                  return [[ts, val]];
                type: line
                stroke_width: 0
                color: "#ffa726"
                yaxis_id: temp
                unit: "°C"
            apex_config:
              markers:
                size: 0
                discrete:
                  - seriesIndex: 3
                    dataPointIndex: 0
                    size: 4
                    fillColor: "#ffa726"
                    strokeColor: "#ffffff"
                    strokeWidth: 2
              chart:
                height: 180px
                width: 100%
                toolbar:
                  show: false
              grid:
                show: true
                borderColor: "rgba(255, 255, 255, 0.12)"
                strokeDashArray: 3
                xaxis:
                  lines:
                    show: true
                yaxis:
                  lines:
                    show: true
              xaxis:
                type: datetime
                tickAmount: 3
                labels:
                  format: "ddd"
                  style:
                    colors: "#90a4ae"
                    fontSize: "12px"
                    fontWeight: 500
                axisBorder:
                  show: false
                axisTicks:
                  show: false
              legend:
                show: false
              tooltip:
                enabled: true
                x:
                  format: "ddd, HH:mm"
            card_mod:
              style: |
                ha-card {
                  border: none !important;
                  background: rgba(0, 0, 0, 0.2) !important;
                  border-radius: var(--bubble-border-radius, 24px) !important;
                  padding: 8px 12px !important;
                }
            grid_options:
              columns: 12
          - type: custom:clock-weather-card
            entity: weather.weather_home_mock
            weather_icon_type: line
            forecast_rows: 3
            time_pattern: HH:mm
            time_format: 24
            hide_today_section: true
            hide_forecast_section: false
            show_humidity: false
            hide_clock: true
            hide_date: true
            card_mod:
              style: |
                ha-card {
                  background: rgba(0, 0, 0, 0.2) !important;
                  border: none !important;
                  border-radius: var(--bubble-border-radius, 24px) !important;
                  padding: 8px 16px !important;
                }
                .card-content {
                  padding: 0 !important;
                }
            grid_options:
              columns: 12
          - type: custom:bubble-card
            card_type: separator
            name: Aktuelle Messwerte
            icon: mdi:gauge
            grid_options:
              columns: 12
          - type: custom:bubble-card
            card_type: button
            entity: sensor.weather_home_current_rain_probability
            name: Regenrisiko
            icon: mdi:water-percent
            show_state: true
            card_layout: large
            grid_options:
              columns: 6
          - type: custom:bubble-card
            card_type: button
            entity: sensor.weather_home_current_wind_speed
            name: Windgeschwindigkeit
            icon: mdi:weather-windy
            show_state: true
            card_layout: large
            grid_options:
              columns: 6
