            card_type: separator
            name: Räume
            styles: |
              .bubble-name {
                font-size: var(--dashboard-header-font-size);
                font-weight: var(--dashboard-header-font-weight);
              }
              ha-card {
                padding: 1.5vw 0 0 0 !important;
              }

          - type: custom:bubble-card
            card_type: button
            entity: light.living_room_light_group
            name: Wohnzimmer
            icon: mdi:sofa
            show_state: true
            card_layout: large
            sub_button:
              - entity: switch.living_room_spot_lights
                icon: mdi:dots-horizontal
                tap_action:
                  action: toggle
            button_type: switch
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            styles: |
              ${(() => {
                const hum = parseFloat(hass.states['sensor.living_room_multi_sensor_humidity'].state);
                const thresh = parseFloat(hass.states['input_number.dashboard_humidity_threshold_medium'].state);
                const isAlert = hum > thresh;
                const isLightOn = state === 'on';
                const humStyle = isAlert 
                  ? (isLightOn ? "color: #8b0000; font-weight: 700;" : "color: #eb4d5b; font-weight: 600;") 
                  : "color: inherit;";
                const el = card.querySelector('.bubble-state');
                if (el) {
                  el.innerHTML =
                    parseFloat(hass.states['sensor.living_room_multi_sensor_temperature'].state).toFixed(1)
                    + " C°"
                    + " \u00A0 | \u00A0 "
                    + "<span style='" + humStyle + "'>"
                    + hum.toFixed(1)
                    + " %</span>";
                }
              })()}

