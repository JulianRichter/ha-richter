# ====================================================================
# Dashboard - Bubble Kiosk Edition
# - Modern single-viewport (100vh) zero-scroll tablet dashboard
# - 4-room column layout with 1-tap everyday controls for the family
# - Top status & master scene chips, bottom glance & media bar
# ====================================================================

title: Bubble Kiosk
kiosk_mode:
  user_settings:
    - users:
        - tablet
      hide_header: true
      hide_sidebar: true
      hide_settings: true
      hide_overflow: true

views:
  - type: custom:grid-layout
    title: Home
    path: Home
    theme: tablet_kiosk_theme
    layout:
      margin: 0
      padding: 1.2vh 1.4vw
      card_margin: 0
      grid-gap: 1.4vh 1.2vw
      grid-template-columns: 1fr 1fr 1fr 1fr
      grid-template-rows: auto 1fr auto
      grid-template-areas: |
        "topbar   topbar   topbar   topbar"
        "room1    room2    room3    room4"
        "glance   glance   glance   glance"
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: 1fr 1fr
          grid-template-rows: auto auto auto auto
          grid-template-areas: |
            "topbar topbar"
            "room1  room2"
            "room3  room4"
            "glance glance"
    cards:
      # ==============================================================
      # TOPBAR: Clock, Weather, Master Scenes, Family & Tram
      # ==============================================================
      - type: horizontal-stack
        view_layout:
          grid-area: topbar
        card_mod:
          style: |
            :host {
              background: rgba(18, 24, 38, 0.72) !important;
              backdrop-filter: blur(24px) !important;
              -webkit-backdrop-filter: blur(24px) !important;
              border: 1px solid rgba(255, 255, 255, 0.08) !important;
              border-radius: 24px !important;
              box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35) !important;
              padding: 0.6vh 1.0vw !important;
              box-sizing: border-box !important;
            }
            #root {
              align-items: center !important;
              justify-content: space-between !important;
              gap: 1.0vw !important;
            }
        cards:
          # --- Left: Clock & Weather Chip ---
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                entity: sensor.template_tablet_sidebar_time
                name: Zeit
                show_icon: false
                show_name: false
                show_attribute: true
                attribute: sidebar_html_text
                tap_action:
                  action: navigate
                  navigation_path: "#bubble_calendar_popup"
                styles: |
                  ha-card {
                    background: transparent !important;
                    box-shadow: none !important;
                    border: none !important;
                  }
                  .bubble-button-card-container {
                    background: transparent !important;
                    height: 44px !important;
                  }
                  .time {
                    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
                    font-size: 30px;
                    font-weight: 700;
                    letter-spacing: -0.5px;
                    color: #ffffff;
                    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
                  }
                  .time-colon {
                    opacity: 0.8;
                  }

              - type: custom:bubble-card
                card_type: button
                entity: sensor.weather_home_current_temperature
                name: Wetter
                icon: mdi:weather-partly-cloudy
                show_state: true
                show_name: false
                tap_action:
                  action: navigate
                  navigation_path: "#bubble_climate_popup"
                styles: |
                  ha-card {
                    background: rgba(255, 255, 255, 0.06) !important;
                    border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    border-radius: 18px !important;
                  }
                  .bubble-button-card-container {
                    background: transparent !important;
                    height: 44px !important;
                  }
                  .bubble-state {
                    font-size: 14px !important;
                    font-weight: 600 !important;
                    color: #f1f5f9 !important;
                  }
                  ${(() => {
                    const temp = hass.states['sensor.weather_home_current_temperature']?.state || '--';
                    const cond = hass.states['sensor.weather_home_current_condition']?.state || '';
                    const el = card.querySelector('.bubble-state');
                    if (el) el.innerHTML = temp + '°C · ' + cond;
                  })()}

          # --- Center: 4 Master Quick Action Chips ---
          - type: horizontal-stack
            cards:
              # 1. Gute Nacht (All Lights Off)
              - type: custom:bubble-card
                card_type: button
                name: "Gute Nacht"
                icon: mdi:weather-night
                button_type: name
                tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id:
                      - light.living_room_light_group
                      - light.bedroom_light_group
                      - light.bedroom_light_sphere
                      - light.baby_room_light
                      - light.kitchen_light_group
                      - light.bathroom_light
                styles: |
                  ha-card {
                    background: rgba(255, 255, 255, 0.05) !important;
                    border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    border-radius: 18px !important;
                  }
                  .bubble-button-card-container {
                    background: transparent !important;
                    height: 44px !important;
                  }
                  .bubble-icon {
                    color: #a78bfa !important;
                  }
                  .bubble-name {
                    font-weight: 600 !important;
                    font-size: 13px !important;
                  }

              # 2. Master Presence (Zuhause)
              - type: custom:bubble-card
                card_type: button
                entity: input_boolean.presence_home
                name: "Zuhause"
                icon: mdi:home-heart
                button_type: switch
                tap_action:
                  action: toggle
                styles: |
                  ha-card {
                    border-radius: 18px !important;
                  }
                  .bubble-button-card-container {
                    height: 44px !important;
                  }
                  .bubble-name {
                    font-weight: 600 !important;
                    font-size: 13px !important;
                  }

              # 3. 1-Click Spotify Resume (Musik)
              - type: custom:bubble-card
                card_type: button
                name: "Musik"
                icon: mdi:music-circle
                button_type: name
                tap_action:
                  action: perform-action
                  perform_action: script.media_resume_last_played
                styles: |
                  ha-card {
                    background: rgba(255, 255, 255, 0.05) !important;
                    border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    border-radius: 18px !important;
                  }
                  .bubble-button-card-container {
                    background: transparent !important;
                    height: 44px !important;
                  }
                  .bubble-icon {
                    color: #10b981 !important;
                  }
                  .bubble-name {
                    font-weight: 600 !important;
                    font-size: 13px !important;
                  }

              # 4. Robi Saugen
              - type: custom:bubble-card
                card_type: button
                entity: vacuum.robi
                name: "Robi"
                icon: mdi:robot-vacuum
                button_type: switch
                tap_action:
                  action: perform-action
                  perform_action: vacuum.start_pause
                  target:
                    entity_id: vacuum.robi
                hold_action:
                  action: navigate
                  navigation_path: "#bubble_vacuum_popup"
                styles: |
                  ha-card {
                    border-radius: 18px !important;
                  }
                  .bubble-button-card-container {
                    height: 44px !important;
                  }
                  .bubble-name {
                    font-weight: 600 !important;
                    font-size: 13px !important;
                  }

          # --- Right: Family Presence & Tram Pill ---
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                entity: person.julian
                name: Julian
                show_state: false
                button_type: state
                styles: |
                  ha-card {
                    background: rgba(255, 255, 255, 0.05) !important;
                    border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    border-radius: 18px !important;
                  }
                  .bubble-button-card-container {
                    background: transparent !important;
                    height: 44px !important;
                    padding-right: 10px !important;
                  }
                  .bubble-name {
                    font-size: 13px !important;
                    font-weight: 600 !important;
                  }

              - type: custom:bubble-card
                card_type: button
                entity: person.xingyang
                name: Xingyang
                show_state: false
                button_type: state
                styles: |
                  ha-card {
                    background: rgba(255, 255, 255, 0.05) !important;
                    border: 1px solid rgba(255, 255, 255, 0.08) !important;
                    border-radius: 18px !important;
                  }
                  .bubble-button-card-container {
                    background: transparent !important;
                    height: 44px !important;
                    padding-right: 10px !important;
                  }
                  .bubble-name {
                    font-size: 13px !important;
                    font-weight: 600 !important;
                  }

              - type: custom:bubble-card
                card_type: button
                entity: sensor.augsburg_curtiusstrasse_koenigsplatz
                name: Tram
                icon: mdi:tram
                show_state: true
                show_name: false
                tap_action:
                  action: navigate
                  navigation_path: "#bubble_tram_popup"
                styles: |
                  ha-card {
                    background: rgba(14, 165, 233, 0.12) !important;
                    border: 1px solid rgba(14, 165, 233, 0.3) !important;
                    border-radius: 18px !important;
                  }
                  .bubble-button-card-container {
                    background: transparent !important;
                    height: 44px !important;
                  }
                  .bubble-icon {
                    color: #38bdf8 !important;
                  }
                  .bubble-state {
                    font-size: 13px !important;
                    font-weight: 600 !important;
                    color: #38bdf8 !important;
                  }
                  ${(() => {
                    const s = hass.states['sensor.augsburg_curtiusstrasse_koenigsplatz'];
                    let m = s?.attributes?.next_departure_minutes ?? s?.attributes?.departures?.[0]?.minutes_until_departure ?? s?.state;
                    const el = card.querySelector('.bubble-state');
                    if (el) el.innerHTML = (m && m !== 'unavailable' ? m + 'm' : '--');
                  })()}

      # ==============================================================
      # ROOM 1: WOHNZIMMER
      # ==============================================================
      - type: vertical-stack
        view_layout:
          grid-area: room1
        card_mod:
          style: |
            :host {
              background: rgba(18, 24, 38, 0.72) !important;
              backdrop-filter: blur(24px) !important;
              -webkit-backdrop-filter: blur(24px) !important;
              border: 1px solid rgba(255, 255, 255, 0.08) !important;
              border-radius: 24px !important;
              box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35) !important;
              padding: 1.2vh 0.8vw !important;
              box-sizing: border-box !important;
              height: 100% !important;
            }
            #root {
              gap: 1.0vh !important;
              height: 100% !important;
              display: flex !important;
              flex-direction: column !important;
              justify-content: space-between !important;
            }
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Wohnzimmer
            icon: mdi:sofa
            sub_button:
              - entity: sensor.living_room_multi_sensor_temperature
                show_state: true
                show_icon: false
              - entity: sensor.living_room_multi_sensor_humidity
                show_state: true
                show_icon: false
            styles: |
              ha-card {
                padding: 0 !important;
              }
              .bubble-name {
                font-size: 18px !important;
                font-weight: 700 !important;
                color: #ffffff !important;
              }
              .bubble-sub-button {
                background: rgba(255, 255, 255, 0.07) !important;
                font-weight: 600 !important;
                font-size: 12px !important;
                color: #94a3b8 !important;
                border-radius: 12px !important;
              }

          - type: custom:bubble-card
            card_type: button
            entity: light.living_room_light_group
            name: Deckenlicht
            icon: mdi:ceiling-light
            show_state: true
            card_layout: large
            button_type: switch
            sub_button:
              - entity: switch.living_room_spot_lights
                icon: mdi:dots-horizontal
                tap_action:
                  action: toggle
            tap_action:
              action: toggle
            hold_action:
              action: more-info

          - type: custom:bubble-card
            card_type: button
            entity: switch.living_room_tv
            name: Fernseher
            icon: mdi:television
            show_state: true
            card_layout: large
            button_type: switch
            sub_button:
              - entity: switch.living_room_nintendo
                icon: mdi:nintendo-switch
                tap_action:
                  action: toggle
            tap_action:
              action: toggle

          - type: custom:bubble-card
            card_type: button
            entity: cover.living_room_curtain_group
            name: Vorhänge
            icon: mdi:curtains
            show_state: true
            card_layout: large
            button_type: switch
            tap_action:
              action: toggle
            hold_action:
              action: more-info

          - type: custom:bubble-card
            card_type: button
            entity: switch.living_room_desktop
            name: Computer
            icon: mdi:laptop
            show_state: true
            card_layout: large
            button_type: switch
            tap_action:
              action: toggle

      # ==============================================================
      # ROOM 2: SCHLAFZIMMER
      # ==============================================================
      - type: vertical-stack
        view_layout:
          grid-area: room2
        card_mod:
          style: |
            :host {
              background: rgba(18, 24, 38, 0.72) !important;
              backdrop-filter: blur(24px) !important;
              -webkit-backdrop-filter: blur(24px) !important;
              border: 1px solid rgba(255, 255, 255, 0.08) !important;
              border-radius: 24px !important;
              box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35) !important;
              padding: 1.2vh 0.8vw !important;
              box-sizing: border-box !important;
              height: 100% !important;
            }
            #root {
              gap: 1.0vh !important;
              height: 100% !important;
              display: flex !important;
              flex-direction: column !important;
              justify-content: space-between !important;
            }
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Schlafzimmer
            icon: mdi:bed
            sub_button:
              - entity: sensor.bedroom_multi_sensor_temperature
                show_state: true
                show_icon: false
              - entity: sensor.bedroom_multi_sensor_humidity
                show_state: true
                show_icon: false
            styles: |
              ha-card {
                padding: 0 !important;
              }
              .bubble-name {
                font-size: 18px !important;
                font-weight: 700 !important;
                color: #ffffff !important;
              }
              .bubble-sub-button {
                background: rgba(255, 255, 255, 0.07) !important;
                font-weight: 600 !important;
                font-size: 12px !important;
                color: #94a3b8 !important;
                border-radius: 12px !important;
              }

          - type: custom:bubble-card
            card_type: button
            entity: light.bedroom_light_group
            name: Deckenlicht
            icon: mdi:ceiling-light
            show_state: true
            card_layout: large
            button_type: switch
            sub_button:
              - entity: light.bedroom_light_left
                icon: mdi:lamp
                tap_action:
                  action: toggle
            tap_action:
              action: toggle
            hold_action:
              action: more-info

          - type: custom:bubble-card
            card_type: button
            entity: light.bedroom_light_sphere
            name: Kugellampe
            icon: mdi:globe-light
            show_state: true
            card_layout: large
            button_type: switch
            tap_action:
              action: toggle
            hold_action:
              action: more-info

          - type: custom:bubble-card
            card_type: button
            entity: cover.bedroom_roller_blinds
            name: Rollos
            icon: mdi:window-shutter
            show_state: true
            card_layout: large
            button_type: switch
            tap_action:
              action: toggle
            hold_action:
              action: more-info

          - type: custom:bubble-card
            card_type: button
            entity: climate.bedroom_thermostat
            name: Heizung
            icon: mdi:radiator
            show_state: true
            card_layout: large
            tap_action:
              action: navigate
              navigation_path: "#bubble_climate_popup"
            styles: |
              ${(() => {
                const s = hass.states['climate.bedroom_thermostat'];
                const target = s?.attributes?.temperature ? s.attributes.temperature + '°C' : (s?.state || '--');
                const el = card.querySelector('.bubble-state');
                if (el) el.innerHTML = target + ' Ziel';
              })()}

      # ==============================================================
      # ROOM 3: KINDERZIMMER
      # ==============================================================
      - type: vertical-stack
        view_layout:
          grid-area: room3
        card_mod:
          style: |
            :host {
              background: rgba(18, 24, 38, 0.72) !important;
              backdrop-filter: blur(24px) !important;
              -webkit-backdrop-filter: blur(24px) !important;
              border: 1px solid rgba(255, 255, 255, 0.08) !important;
              border-radius: 24px !important;
              box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35) !important;
              padding: 1.2vh 0.8vw !important;
              box-sizing: border-box !important;
              height: 100% !important;
            }
            #root {
              gap: 1.0vh !important;
              height: 100% !important;
              display: flex !important;
              flex-direction: column !important;
              justify-content: space-between !important;
            }
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Kinderzimmer
            icon: mdi:baby-carriage
            sub_button:
              - entity: sensor.baby_room_multi_sensor_temperature
                show_state: true
                show_icon: false
              - entity: sensor.baby_room_multi_sensor_humidity
                show_state: true
                show_icon: false
            styles: |
              ha-card {
                padding: 0 !important;
              }
              .bubble-name {
                font-size: 18px !important;
                font-weight: 700 !important;
                color: #ffffff !important;
              }
              .bubble-sub-button {
                background: rgba(255, 255, 255, 0.07) !important;
                font-weight: 600 !important;
                font-size: 12px !important;
                color: #94a3b8 !important;
                border-radius: 12px !important;
              }

          - type: custom:bubble-card
            card_type: button
            entity: light.baby_room_light
            name: Deckenlicht
            icon: mdi:ceiling-light
            show_state: true
            card_layout: large
            button_type: switch
            tap_action:
              action: toggle
            hold_action:
              action: more-info

          - type: custom:bubble-card
            card_type: button
            entity: switch.baby_room_heater
            name: Wandheizung
            icon: mdi:radiator
            show_state: true
            card_layout: large
            button_type: switch
            tap_action:
              action: toggle

          - type: custom:bubble-card
            card_type: button
            entity: cover.baby_room_roller_blinds
            name: Rollos
            icon: mdi:window-shutter
            show_state: true
            card_layout: large
            button_type: switch
            tap_action:
              action: toggle
            hold_action:
              action: more-info

          - type: custom:bubble-card
            card_type: button
            entity: climate.baby_room_thermostat
            name: Thermostat
            icon: mdi:thermometer
            show_state: true
            card_layout: large
            tap_action:
              action: navigate
              navigation_path: "#bubble_climate_popup"
            styles: |
              ${(() => {
                const s = hass.states['climate.baby_room_thermostat'];
                const target = s?.attributes?.temperature ? s.attributes.temperature + '°C' : (s?.state || '--');
                const el = card.querySelector('.bubble-state');
                if (el) el.innerHTML = target + ' Ziel';
              })()}

      # ==============================================================
      # ROOM 4: KÜCHE & BAD
      # ==============================================================
      - type: vertical-stack
        view_layout:
          grid-area: room4
        card_mod:
          style: |
            :host {
              background: rgba(18, 24, 38, 0.72) !important;
              backdrop-filter: blur(24px) !important;
              -webkit-backdrop-filter: blur(24px) !important;
              border: 1px solid rgba(255, 255, 255, 0.08) !important;
              border-radius: 24px !important;
              box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35) !important;
              padding: 1.2vh 0.8vw !important;
              box-sizing: border-box !important;
              height: 100% !important;
            }
            #root {
              gap: 1.0vh !important;
              height: 100% !important;
              display: flex !important;
              flex-direction: column !important;
              justify-content: space-between !important;
            }
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Küche & Bad
            icon: mdi:silverware-fork-knife
            sub_button:
              - entity: sensor.kitchen_multi_sensor_temperature
                show_state: true
                show_icon: false
              - entity: sensor.bathroom_multi_sensor_temperature
                show_state: true
                show_icon: false
            styles: |
              ha-card {
                padding: 0 !important;
              }
              .bubble-name {
                font-size: 18px !important;
                font-weight: 700 !important;
                color: #ffffff !important;
              }
              .bubble-sub-button {
                background: rgba(255, 255, 255, 0.07) !important;
                font-weight: 600 !important;
                font-size: 12px !important;
                color: #94a3b8 !important;
                border-radius: 12px !important;
              }
              # [DEBUG] Uncomment to inspect viewport & screen resolution on a new device:
              # ${(() => {
              #   const el = card.querySelector('.bubble-name');
              #   if (el) {
              #     const w = window.innerWidth;
              #     const h = window.innerHeight;
              #     const sw = window.screen.width;
              #     const sh = window.screen.height;
              #     const dpr = Math.round((window.devicePixelRatio || 1) * 10) / 10;
              #     el.innerText = `${w}x${h} (Scr: ${sw}x${sh} @${dpr}x)`;
              #   }
              # })()}

          - type: custom:bubble-card
            card_type: button
            entity: light.kitchen_light_group
            name: Küche Licht
            icon: mdi:ceiling-light
            show_state: true
            card_layout: large
            button_type: switch
            sub_button:
              - entity: light.kitchen_light_left
                icon: mdi:lightbulb-outline
                tap_action:
                  action: toggle
            tap_action:
              action: toggle
            hold_action:
              action: more-info

          - type: custom:bubble-card
            card_type: button
            entity: light.bathroom_light
            name: Bad Licht
            icon: mdi:shower
            show_state: true
            card_layout: large
            button_type: switch
            tap_action:
              action: toggle
            hold_action:
              action: more-info

          - type: custom:bubble-card
            card_type: button
            entity: binary_sensor.kitchen_dishwasher
            name: Spülmaschine
            icon: mdi:dishwasher
            show_state: true
            card_layout: large
            button_type: state
            sub_button:
              - entity: input_boolean.kitchen_dishwasher_done
                icon: mdi:check-circle-outline
                show_state: false
                tap_action:
                  action: toggle
            styles: |
              ${(() => {
                const isDone = hass.states['input_boolean.kitchen_dishwasher_done']?.state === 'on';
                const isActive = hass.states['binary_sensor.kitchen_dishwasher']?.state === 'on';
                const el = card.querySelector('.bubble-state');
                if (el) {
                  if (isDone) {
                    el.innerHTML = '<span style="color:#34d399;font-weight:700;">Fertig! ✓</span>';
                  } else if (isActive) {
                    el.innerHTML = '<span style="color:#38bdf8;font-weight:600;">Läuft...</span>';
                  } else {
                    el.innerHTML = 'Bereit';
                  }
                }
              })()}

          - type: custom:bubble-card
            card_type: button
            entity: binary_sensor.template_bathroom_washer
            name: Waschmaschine
            icon: mdi:washing-machine
            show_state: true
            card_layout: large
            button_type: state
            sub_button:
              - entity: input_boolean.bathroom_laundry
                icon: mdi:check-circle-outline
                show_state: false
                tap_action:
                  action: toggle
            styles: |
              ${(() => {
                const isDone = hass.states['input_boolean.bathroom_laundry']?.state === 'on';
                const isActive = hass.states['binary_sensor.template_bathroom_washer']?.state === 'on';
                const el = card.querySelector('.bubble-state');
                if (el) {
                  if (isDone) {
                    el.innerHTML = '<span style="color:#34d399;font-weight:700;">Fertig! ✓</span>';
                  } else if (isActive) {
                    el.innerHTML = '<span style="color:#38bdf8;font-weight:600;">Läuft...</span>';
                  } else {
                    el.innerHTML = 'Bereit';
                  }
                }
              })()}

