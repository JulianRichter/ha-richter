bubble_sidebar_notification:
  name: "Sidebar Notification Item"
  description: "Handles typography, transparent background, and dynamic auto-collapse height for sidebar notifications"
  version: "1.0"
  code: |
    ha-card {
      padding: 0 0 0 0 !important;
    }
    .bubble-button-card-container {
      background-color: rgba(0, 0, 0, 0) !important;
      border-radius: 0 !important;
    }
    .bubble-button-background {
      background-color: rgba(0, 0, 0, 0) !important;
    }
    .bubble-name-container {
      margin: 0 3vw !important;
    }
    p {
      font-family: SF Display, Roboto, sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: #6a7377;
      margin: 0 !important;
      padding: 0 !important;
      line-height: 22px;
    }
    ${(() => {
      const count = hass.states[entity]?.attributes?.count || 0;
      const isVisible = count > 0;
      const el = card.querySelector('.bubble-button-card-container');
      const nc = card.querySelector('.bubble-name-container');
      if (el) {
        const height = isVisible ? ((nc?.scrollHeight || nc?.offsetHeight || (count * 22 + 32)) + 4) : 0;
        el.style.height = isVisible ? (height + 'px') : '0px';
        el.style.display = isVisible ? '' : 'none';
      }
      card.style.display = isVisible ? '' : 'none';
      const updateParent = () => {
        const h = card.closest('hui-card') || card.parentElement;
        if (h) h.style.display = isVisible ? '' : 'none';
      };
      updateParent();
      if (!card.closest('hui-card')) {
        requestAnimationFrame(updateParent);
      }
      return isVisible ? '' : ':host { display: none !important; } ha-card { display: none !important; }';
    })()}

