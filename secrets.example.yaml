# ====================================================================
# Home Assistant Secrets Template (Example)
# - Copy this file to `secrets.yaml` and replace placeholder values.
# - DO NOT commit your real `secrets.yaml` to source control.
# ====================================================================

# Home Assistant Instance URLs
home_assistant_internal_url: "http://homeassistant.local:8123"
home_assistant_external_url: "https://your-domain.duckdns.org"

# MariaDB / Recorder Database connection string
maria_db_url: "mysql://homeassistant:your_db_password@core-mariadb/homeassistant?charset=utf8mb4"

# Google Assistant Actions Project ID (Actions Console project ID)
google_assistant_project_id: "your-google-assistant-project-id"

# Gmail IMAP / Notification credentials
google_mail: "your-email@gmail.com"
google_app_password: "xxxx xxxx xxxx xxxx"
